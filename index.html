<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eva工作台</title>
<style>
:root{
  --bg:#f5f5f7;--card:#fff;--line:#e5e5ea;--txt:#1d1d1f;--sub:#6e6e73;
  --red:#ff3b30;
  --accent:#007aff;--accent-d:#00448f;--accent-b:#0058b8;--accent-b2:#003d82;--accent-soft:#ebf4ff;--accent-hv:#d6eaff;--accent-g1:#a6d0ff;--accent-g2:#7abaff;
  --oem-1:#ffcf8c;--oem-2:#ff9500;
  --shadow:0 1px 3px rgba(0,0,0,.04),0 10px 30px rgba(0,0,0,.06);
  --r:16px;
}
/* Apple 系统色（iOS/macOS 官方色板）：每个模块一个系统色，切换模块时整体色调跟随；
   派生色配方全站统一：soft/hv/g1/g2 = 系统色与白 92%/84%/65%/48% 混合（浅底与图形）；
   d = 与黑 44% 混合（浅底上的文字，深色字对比度达标）；
   b/b2 = 与黑 34%/52% 混合（白字实心按钮/导航/选中态，白字对比度全模块 ≥4.6） */
body[data-mod="dash"]{--accent:#007AFF;--accent-d:#00448f;--accent-b:#0051a8;--accent-b2:#003b7a;--accent-soft:#ebf4ff;--accent-hv:#d6eaff;--accent-g1:#a6d0ff;--accent-g2:#7abaff}   /* Blue · 蓝 */
body[data-mod="cust"]{--accent:#5856D6;--accent-d:#313078;--accent-b:#3a398d;--accent-b2:#2a2967;--accent-soft:#f2f1fc;--accent-hv:#e4e4f8;--accent-g1:#c5c4f1;--accent-g2:#a8a7ea}   /* Indigo · 靛蓝 */
body[data-mod="prod"]{--accent:#FF2D55;--accent-d:#8f1930;--accent-b:#a81e38;--accent-b2:#7a1629;--accent-soft:#ffeef1;--accent-hv:#ffdde4;--accent-g1:#ffb6c4;--accent-g2:#ff92a7}   /* Pink · 粉 */
body[data-mod="prodo"]{--accent:#AF52DE;--accent-d:#622e7c;--accent-b:#733693;--accent-b2:#54276b;--accent-soft:#f9f1fc;--accent-hv:#f2e3fa;--accent-g1:#e3c2f3;--accent-g2:#d5a5ee}   /* Purple · 紫 */
body[data-mod="stock"]{--accent:#34C759;--accent-d:#1d6f32;--accent-b:#22833b;--accent-b2:#19602b;--accent-soft:#effbf2;--accent-hv:#dff6e4;--accent-g1:#b8ebc5;--accent-g2:#95e2a9}   /* Green · 绿 */
body[data-mod="order"]{--accent:#FF9500;--accent-d:#8f5300;--accent-b:#a86200;--accent-b2:#7a4800;--accent-soft:#fff7eb;--accent-hv:#ffeed6;--accent-g1:#ffdaa6;--accent-g2:#ffc87a}   /* Orange · 橙 */
body[data-mod="ship"]{--accent:#32ADE6;--accent-d:#1c6181;--accent-b:#217298;--accent-b2:#18536e;--accent-soft:#eff8fd;--accent-hv:#def2fb;--accent-g1:#b7e2f6;--accent-g2:#94d4f2}   /* Cyan · 青 */
body[data-mod="pay"]{--accent:#00C7BE;--accent-d:#006f6a;--accent-b:#00837d;--accent-b2:#00605b;--accent-soft:#ebfbfa;--accent-hv:#d6f6f5;--accent-g1:#a6ebe8;--accent-g2:#7ae2dd}   /* Mint · 薄荷 */
body[data-mod="dev"]{--accent:#A2845E;--accent-d:#5b4a35;--accent-b:#6b573e;--accent-b2:#4e3f2d;--accent-soft:#f8f5f2;--accent-hv:#f0ebe5;--accent-g1:#ded4c7;--accent-g2:#cfbfab}   /* Brown · 棕 */
body[data-mod="log"]{--accent:#8E8E93;--accent-d:#505052;--accent-b:#5e5e61;--accent-b2:#444447;--accent-soft:#f6f6f6;--accent-hv:#ededee;--accent-g1:#d7d7d9;--accent-g2:#c4c4c7}   /* Gray · 灰 */
body[data-mod="doc"]{--accent:#30B0C7;--accent-d:#1b636f;--accent-b:#207483;--accent-b2:#175460;--accent-soft:#eef9fb;--accent-hv:#def2f6;--accent-g1:#b7e3eb;--accent-g2:#93d6e2}   /* Teal · 蓝绿 */
body[data-mod="set"]{--accent:#6E6E73;--accent-d:#3e3e40;--accent-b:#49494c;--accent-b2:#353537;--accent-soft:#f3f3f4;--accent-hv:#e8e8e9;--accent-g1:#ccccce;--accent-g2:#b4b4b6}   /* Gray · 深灰 */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
.app{display:flex;min-height:100vh}
.sidebar{width:200px;background:linear-gradient(180deg,var(--accent-soft) 0%,rgba(255,255,255,.82) 58%,rgba(255,255,255,.72) 100%);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-right:1px solid var(--accent-g1);color:#3c3c43;flex-shrink:0;display:flex;flex-direction:column}
.sidebar .logo{padding:18px 16px;color:var(--accent-d);font-size:17px;font-weight:bold;border-bottom:1px solid var(--accent-g1)}
.sidebar .logo small{display:block;font-size:11px;font-weight:normal;color:#8e8e93;margin-top:3px}
.nav{flex:1;padding:10px 0}
.nav a{display:flex;align-items:center;gap:9px;padding:11px 18px;color:#3c3c43;text-decoration:none;font-size:14px;cursor:pointer}
.sidebar .foot{padding:12px 16px;font-size:11px;color:var(--sub);border-top:1px solid var(--accent-g1)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--card);border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:14px}
.topbar .date{color:var(--sub);font-size:13px}
.content{padding:20px 22px;flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:16px;overflow:hidden}
.card .card-hd{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card .card-hd .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--accent-g1);text-align:left;vertical-align:middle;padding:9px 10px;border-bottom:1px solid var(--accent-g1);color:var(--accent-d);font-weight:600;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--accent-soft);vertical-align:middle;text-align:left}
.empty{text-align:center;color:var(--sub);padding:36px 0}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--txt);font-size:13px;cursor:pointer}
.btn.dgr{color:var(--red)}
.btn.sm{padding:3px 9px;font-size:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs span{padding:5px 13px;border-radius:16px;background:var(--accent-soft);color:var(--accent-d);font-size:12.5px;cursor:pointer}
.tag{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px}
.tag.c1{background:var(--accent-soft);color:var(--accent-d)}.tag.c2{background:#fff4e5;color:#c2500a}.tag.c3{background:#e6f9ec;color:#1d7a34}
.tag.warn{background:#ffe9e7;color:#d70015}.tag.ok{background:#e6f9ec;color:#1d7a34}.tag.pend{background:#fff4e5;color:#c2500a}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:1100px){.chart-grid{grid-template-columns:1fr}}
.bar-row{display:flex;align-items:center;gap:9px;margin-bottom:9px;font-size:12.5px}
.bar-row .bl{width:110px;text-align:right;color:var(--sub);flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .bt{flex:1;background:var(--accent-soft);border-radius:4px;height:18px;position:relative}
.bar-row .bf{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent-g1),var(--accent))}
.bar-row .bv{width:110px;flex-shrink:0}
/* 阶段性返点进度板（产品政策页顶部）：窄屏时数值换到条形图下方整行显示 */
.pstage-row{flex-wrap:wrap;cursor:pointer}
.pstage-row .bl{width:190px}
.pstage-row .bv{width:300px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
@media(max-width:700px){
  .pstage-row .bl{width:104px;font-size:11.5px}
  .pstage-row .bv{width:100%;padding-left:0}
}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.40);display:none;align-items:flex-start;justify-content:center;z-index:100;overflow:auto;padding:30px 16px}
.mask.show{display:flex}
.modal{background:#fff;border-radius:10px;width:680px;max-width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal .m-hd{padding:15px 20px;background:linear-gradient(90deg,var(--accent-soft) 0%,rgba(255,255,255,.5) 100%);border-bottom:1px solid var(--accent-g1);display:flex;align-items:center;border-radius:inherit;border-bottom-left-radius:0;border-bottom-right-radius:0}
.modal .m-hd h3{font-size:16px;color:var(--accent-d)}
.modal .m-hd .x{margin-left:auto;cursor:pointer;color:var(--sub);font-size:20px;line-height:1}
.modal .m-bd{padding:18px 20px;max-height:66vh;overflow:auto}
.modal .m-ft{padding:13px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px 16px}
.fgrid .full{grid-column:1/-1}
.fitem label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:5px}
.fitem label b{color:var(--red)}
.fitem input,.fitem select,.fitem textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:13.5px;font-family:inherit;background:#fff}
.fitem input:focus,.fitem select:focus,.fitem textarea:focus{outline:none;border-color:var(--accent)}
.fitem input[readonly]{background:#f7f7f9;color:var(--sub)}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
.fitem textarea{height:74px;resize:vertical}
.fitem .hint{font-size:11.5px;color:var(--accent-d);margin-top:4px}
.fitem .errhint{font-size:11.5px;color:var(--red);margin-top:4px;display:none}
.photo-box{border:1px dashed var(--line);border-radius:6px;padding:8px;text-align:center;cursor:pointer;color:var(--sub);font-size:12.5px;min-height:56px;display:flex;align-items:center;justify-content:center;gap:8px;background:#f7f7f9}
.photo-box img{max-height:52px;max-width:100%;border-radius:4px}
.err{border-color:var(--red)!important}
.search{padding:7px 11px;border:1px solid var(--line);border-radius:6px;font-size:13px;width:190px}
.photo-thumb{width:44px;height:34px;object-fit:cover;border-radius:4px;cursor:zoom-in;border:1px solid var(--line)}
.big-photo-mask{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:200;display:none;align-items:center;justify-content:center;cursor:zoom-out}
.big-photo-mask.show{display:flex}
.big-photo-mask img{max-width:92%;max-height:92%}
.mono{font-family:Consolas,monospace}
.sec-title{font-size:13px;font-weight:600;color:var(--sub);margin:4px 0 10px}
.fgroup{grid-column:1/-1;margin-top:4px;padding:7px 10px;background:var(--accent-soft);border-radius:6px;font-size:12.5px;font-weight:600;color:var(--accent-d)}
.flt{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;margin-left:2px;border-radius:4px;cursor:pointer;font-size:11px;color:var(--sub);vertical-align:middle;user-select:none}
.flt-pop{position:fixed;z-index:300;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:8px;min-width:170px}
.flt-pop .flt-opt{padding:7px 11px;border-radius:6px;cursor:pointer;font-size:13px}
.flt-pop .flt-opt:hover{background:#f2f2f7}
.flt-pop .flt-opt.on{background:var(--accent-soft);color:var(--accent-d);font-weight:600}
.flt-pop .flt-input{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px;margin-bottom:7px}
.flt-pop .flt-input:focus{outline:none;border-color:var(--accent)}
.flt-pop .row{display:flex;gap:6px;align-items:center;justify-content:space-between}
/* 列表横向滚动：滚动条常显（macOS 默认隐藏导致"滚轮不能用"的观感）；电脑端单元格单行不换行，宽表横向滚动 */
.tbl-wrap{max-width:100%}
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.tbl-scroll::-webkit-scrollbar{height:9px}
.tbl-scroll::-webkit-scrollbar-thumb{background:#c7c7cc;border-radius:8px}
.tbl-scroll::-webkit-scrollbar-track{background:transparent}
/* 横向滚动条：固定在整个工作台底部，竖向滑到任何位置都能看到；自动跟随当前可见的宽表 */
#hbar{position:fixed;left:0;right:0;bottom:0;height:16px;overflow-x:auto;overflow-y:hidden;display:none;z-index:70;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--accent-g1);padding:2px 0}
#hbar>div{height:1px}
#hbar::-webkit-scrollbar{height:11px}
#hbar::-webkit-scrollbar-thumb{background:#aeaeb4;border-radius:8px}
#hbar::-webkit-scrollbar-track{background:transparent}
body.hbar-on .content{padding-bottom:40px}
/* 合并单元格（rowspan）：内容与标记上下左右居中 */
td.mg{vertical-align:middle;text-align:left}
td.mg>.tag,td.mg>span.tag{display:inline-block;vertical-align:middle}
td.mg input.chkbox{vertical-align:middle}
tbody tr.grp-first td{border-top:1px solid var(--accent-g1)}
tbody tr.grp-last td{border-bottom:1px solid var(--accent-g1)}
@media(min-width:901px){.tbl-scroll td{white-space:nowrap}}
/* ================= 苹果风增强：马卡龙渐变 / 毛玻璃 / 圆角 / 移动端 ================= */
html,body{max-width:100%;overflow-x:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","SF Pro Text","PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;background:linear-gradient(180deg,var(--accent-soft) 0%,#fbfbfd 48%,#f7f7f9 100%);background-attachment:fixed;-webkit-font-smoothing:antialiased}
.main{min-width:0}
.sidebar{background:linear-gradient(180deg,var(--accent-soft) 0%,rgba(255,255,255,.82) 58%,rgba(255,255,255,.72) 100%)}
.sidebar .logo small{color:#8e8e93}
.nav a{gap:10px;border-radius:12px;margin:2px 9px;padding:10px 13px;color:#3c3c43;transition:all .18s}
.nav a:hover{background:rgba(0,0,0,.05);color:#1d1d1f}
.nav a.active{background:linear-gradient(135deg,var(--accent-b) 0%,var(--accent-b2) 100%);color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.10)}
.nav .nav-ic{font-size:17px;width:22px;text-align:center;flex-shrink:0}
.topbar{position:sticky;top:0;z-index:50;background:linear-gradient(90deg,var(--accent-soft) 0%,rgba(255,255,255,.86) 72%);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--accent-g1);padding:13px 24px}
.topbar h2{font-size:17px;letter-spacing:.3px}
.topbar h2::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--accent-g1),var(--accent));margin-right:9px;vertical-align:2px}
.card{border:none;border-radius:var(--r);box-shadow:var(--shadow);background:linear-gradient(180deg,var(--accent-soft) 0%,rgba(255,255,255,.99) 12%,rgba(255,255,255,.995) 100%)}
.card .card-hd{background:linear-gradient(90deg,var(--accent-g1) 0%,var(--accent-soft) 46%,rgba(255,255,255,.4) 100%);border-bottom:1px solid var(--accent-g1);border-radius:var(--r) var(--r) 0 0;padding:13px 18px}
.card .card-hd h3{font-size:14.5px;color:var(--accent-d)}
.card .card-bd{padding:16px 18px}
.btn{border-radius:999px;border:1px solid #e5e5ea;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:all .18s}
.btn:hover{border-color:var(--accent-d);color:var(--accent-d)}
.btn.pri{background:linear-gradient(135deg,var(--accent-b) 0%,var(--accent-b2) 100%);border-color:transparent;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.btn.pri:hover{background:linear-gradient(135deg,var(--accent-b) 0%,var(--accent-b2) 100%);color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.10);filter:brightness(1.08)}
.btn.sm{border-radius:9px}
.btn.dgr:hover{border-color:var(--red);color:var(--red)}
.tabs span{border-radius:999px;border:1px solid var(--accent-g1);transition:all .18s}
.tabs span:hover{border-color:var(--accent-d);color:var(--accent-d)}
.tabs span.on{background:linear-gradient(135deg,var(--accent-b) 0%,var(--accent-b2) 100%);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.bar-row .bt{border-radius:6px;background:var(--accent-soft)}
.bar-row .bf{display:block;border-radius:6px;background:linear-gradient(90deg,var(--accent-g1),var(--accent))}
th{background:var(--accent-g1);color:var(--accent-d)}
tr:hover td{background:var(--accent-hv)}
/* 明细列表隔行底色：全工作台统一口径——「单数序号纯白、双数序号着色」。
   单元格必须显式白底，否则会透出卡片顶部的模块色渐变 → 出现「深浅不一的橘色 / 序号1不是纯白」。
   同一订单/发货单共用一个序号 → 整单一块同色，相邻单交替（.grp-first/.grp-last 为块首尾分隔线） */
tbody tr td{background:#fff}
tbody tr.z2 td{background:var(--accent-soft)}
tbody tr.z2:hover td{background:var(--accent-hv)}
tfoot td{background:#fff}
/* 核对勾选列（销售订单 / 回款明细）：序号前的小方格，点一下打勾✅ */
td.chk-th,th.chk-th{width:62px;text-align:center;white-space:nowrap}
th.chk-th .flt{margin-left:2px}
input.chkbox{appearance:none;-webkit-appearance:none;width:19px;height:19px;margin:0;padding:0;border:1.5px solid #c7c7cc;border-radius:5px;background:#fff;cursor:pointer;vertical-align:middle;position:relative;transition:background .15s,border-color .15s}
input.chkbox:checked{background:var(--accent-b);border-color:var(--accent-b)}
input.chkbox:checked::after{content:'✓';color:#fff;font-size:13px;font-weight:700;line-height:19px;position:absolute;left:0;top:0;right:0;bottom:0;text-align:center}
tbody td.chk-on{background:#f0fbf2!important}
tbody tr.z2 td.chk-on{background:#e4f7e9!important}
/* 订单 ↔ 回款 匹配面板 */
.mch-sum{display:flex;flex-wrap:wrap;gap:4px 20px;padding:10px 12px;background:#f5f5f7;border-radius:10px;font-size:12.5px;line-height:1.7}
.mch-sum em{font-style:normal;color:var(--sub)}
.mch-sum b{color:var(--accent-d)}
.mch-list{margin-top:10px;max-height:44vh;overflow:auto;border:1px solid #e5e5ea;border-radius:10px}
.mch-row{display:flex;align-items:center;gap:10px;padding:7px 10px;border-bottom:1px solid #f2f2f7;cursor:pointer;font-size:12.5px}
.mch-row:last-child{border-bottom:0}
.mch-row:hover{background:var(--accent-soft)}
.mch-row .mno{font-family:Consolas,monospace;min-width:92px}
.mch-row .mg{flex:1;min-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--sub)}
.mch-row .md{min-width:70px;text-align:right;color:var(--sub)}
.mch-row .ma{min-width:84px;text-align:right}
.mch-row .mt{min-width:56px;text-align:right}
@media(max-width:560px){
  .mch-row{flex-wrap:wrap;gap:3px 8px}
  .mch-row .mg{flex:0 0 100%;order:4}
  .mch-row .mno{min-width:0}
}
.fitem input,.fitem select,.fitem textarea{border-radius:10px;border-color:#e5e5ea;background:#f7f7f9}
.fitem input:focus,.fitem select:focus,.fitem textarea:focus{border-color:var(--accent);background:#fff}
.fgroup{background:var(--accent-soft);color:var(--accent-d);border-radius:8px}
.flt.on{background:var(--accent-b);color:#fff}
.flt:hover{background:var(--accent-soft);color:var(--accent-d)}
.flt-pop{border-radius:14px;box-shadow:0 12px 36px rgba(0,0,0,.10)}

<script>
/* ================= 存储 ================= */
var DB_KEY='pharmaSalesWorkbench';
var DB_TABLES=['customers','products','batches','orders','shipments','payments','logs','prodOrders','develop','todos','prodPolicies','docs','wnotes'];
/* 历史数据自愈用到的字段表（必须在 load() 之前初始化，否则打开瞬间的自愈会空跑） */
var DATE_FIELDS={orders:['shipDate'],shipments:['shipDate'],payments:['payDate','ym'],batches:['inDate','prodDate','expire'],prodOrders:['date','shipDate'],develop:['date','orderDate'],logs:['date','planDate']};
var _HEALED=0;
var db=load();
healSerialDates();   /* 打开即自愈：把历史上被当成日期的 Excel 序列号（46035）还原成 2026-01-13 */
function ensureStruct(d){
  for(var i=0;i<DB_TABLES.length;i++)if(!Array.isArray(d[DB_TABLES[i]]))d[DB_TABLES[i]]=[];
  if(typeof d.seq!=='number')d.seq=1;
  if(!d.del||typeof d.del!=='object'||Array.isArray(d.del))d.del={};
  return d;
}
function load(){
  try{var d=JSON.parse(localStorage.getItem(DB_KEY));if(d&&d.orders)return ensureStruct(d);}catch(e){}
  return ensureStruct({customers:[],products:[],batches:[],orders:[],shipments:[],payments:[],logs:[],prodOrders:[],develop:[],prodPolicies:[],docs:[],seq:1});
}
/* 历史数据自愈：早期版本把 Excel 的「日期序列号」当成日期存了进来（2026/1/13 → 46035），
   这里按序列号还原成真实日期；每次打开、以及每次合并云端数据后都会跑一遍，
   所以在任何一台设备上都不会再看到「日期是一串数字」。改过的记录会打时间戳，自愈结果会回传云端。 */
function healSerialDates(){
  var n=0;
  for(var t in DATE_FIELDS){
    var arr=db[t],fs=DATE_FIELDS[t];if(!arr)continue;
    for(var i=0;i<arr.length;i++){
      var r=arr[i],ch=false;if(!r)continue;
      for(var f=0;f<fs.length;f++){
        var k=fs[f],s=(r[k]==null?'':String(r[k]));
        if(!/^\d{5}(\.\d+)?$/.test(s))continue;   /* 只处理像 Excel 序列号的值 */
        var d=xlDate(s);if(!d)continue;
        r[k]=(k==='ym')?d.slice(0,7):d;ch=true;n++;
      }
      if(ch)touch(r);
    }
  }
  _HEALED+=n;
  return n;
}
/* 清0批次直接删除：库存为0的批次不保留（保存时自动清理，并留下删除标记以便另一端同步删除） */
function purgeZeroBatches(){
  var gone=[];
  db.batches=db.batches.filter(function(b){
    var p=findProd(b.pid);

/* 空值判定：''/null/undefined/0 都视为"未填"（本工作台价格与数量字段 0 即未填） */
function isBlank(v){return v===undefined||v===null||v===''||v===0||v==='0'||(typeof v==='number'&&isNaN(v));}

function fillEmptyFields(local,cloud){
  var out=local,cloned=false;
  for(var k in cloud){
    if(k==='id')continue;
    if(isBlank(out[k])&&!isBlank(cloud[k])){
      if(!cloned){out={};for(var kk in local)out[kk]=local[kk];cloned=true;}
      out[k]=cloud[k];

var DEL_KEEP_DAYS=365; // 删除标记保留天数（覆盖离线设备重新上线的时间窗）
function markDel(ids){
  if(!ids)return;
  if(!db.del||typeof db.del!=='object')db.del={};
  var list=Array.isArray(ids)?ids:[ids],t=Date.now();
  for(var i=0;i<list.length;i++)if(list[i])db.del[list[i]]=t;

function pruneDel(){
  if(!db.del)return;
  var cut=Date.now()-DEL_KEEP_DAYS*86400000;

function mergeDel(cd){
  if(!cd||typeof cd!=='object')return false;
  if(!db.del||typeof db.del!=='object')db.del={};
  var any=false;
  for(var id in cd){
    var ct=Number(cd[id])||0;
    if(ct>(Number(db.del[id])||0)){db.del[id]=ct;any=true;}
  }
  return any;
}
/* 多设备安全合并：按 id 取并集 + 删除标记比对；
   两端都有的记录先比记录级 _t，都无 _t 时逐字段补空（任一端填过的字段都能同步过去）；
   任一端删除过的记录，另一端同步移除 */
function mergeCloud(cloud){
  var any=mergeDel(cloud.del);
  MERGE_KEYS.forEach(function(k){
    var lm={},cm={},ids={};
    (db[k]||[]).forEach(function(r){if(r&&r.id){lm[r.id]=r;ids[r.id]=1;}});
    (cloud[k]||[]).forEach(function(r){if(r&&r.id){cm[r.id]=r;ids[r.id]=1;}});
    var out=[],changed=false;
    Object.keys(ids).forEach(function(id){
      var lr=lm[id],cr=cm[id];
      var lt=lr?(Number(lr._t)||0):0,ct=cr?(Number(cr._t)||0):0;
      var dt=Number(db.del&&db.del[id])||0;
      if(dt){
        // 两端记录都没有"删除之后又被修改"，说明确属删除：本地/云端一并移除
        if(lt<=dt&&ct<=dt){if(lr||cr)changed=true;return;}
        delete db.del[id]; // 删除后又被编辑过：以编辑为准，撤销删除标记
      }
      if(lr&&!cr)out.push(lr);                     // 本地独有：保留（并会随推送回传云端）
      else if(cr&&!lr){out.push(cr);changed=true;} // 云端独有：并入本地
      else{                                        // 两边都有：先比记录级 _t，无 _t 则字段级补空
        if(ct>lt){out.push(cr);changed=true;}
        else if(lt>ct){out.push(lr);}
        else{var mg=fillEmptyFields(lr,cr);if(mg!==lr)changed=true;out.push(mg);}
      }
    });
    if(changed||out.length!==(db[k]||[]).length){db[k]=out;any=true;}
  });

  if(cs> (Number(db.seq)||0)){db.seq=cs;any=true;}

  var ct2=Number(cloud.payTargetT)||0,lt2=Number(db.payTargetT)||0;
  if(ct2>lt2&&Number(cloud.payTarget)>0){db.payTarget=Number(cloud.payTarget);db.payTargetT=ct2;any=true;}
  return any;
}
function pullCloud(){

  .then(function(r){return r.json().then(function(d){return {ok:r.ok,status:r.status,data:d};});})
  .then(function(res){
    cloudPulling=false;
    var d=res.data;
    if(!res.ok){
      console.log('云拉取失败',res.status,d&&d.message);
      cloudStatus('云同步未连接');
      if(_dirty)flushPush();
      return;
    }
    cloudPulled=true; // 已成功读到云端：此后才允许「载入示例数据」等会写云端的操作
    var content=d&&d.files&&d.files[GIST_FILE]&&d.files[GIST_FILE].content;
    if(content){
      var cloud;
      try{cloud=JSON.parse(content);}catch(e){cloud=null;}
      if(cloud&&Array.isArray(cloud.orders)){
        var ct=Number(cloud._t)||0,lt=Number(db._t)||0;
        backupLocal(); // 合并前备份本地数据（救援保险）
        ensureStruct(cloud);
        var changed=mergeCloud(cloud);
        if(healSerialDates())changed=true;   /* 自愈后必须回传云端，避免其他设备又拿到序列号 */
        if(_HEALED){changed=true;_HEALED=0;}
        if(autoMatchPays(true).n)changed=true;   /* 完全能确定的回款↔订单自动联动，没把握的不动 */
        var newT=Math.max(lt,ct);
        if(newT>lt){db._t=newT;changed=true;}
        if(changed){
          _IDX_VER++; // 合并后数据已变，索引缓存失效
          try{localStorage.setItem(DB_KEY,JSON.stringify(db));}catch(e){}
          var modalOpen=false;try{modalOpen=document.getElementById('mask').classList.contains('show');}catch(e){}
          if(!modalOpen)render();
          _dirty=true;flushPush(); // 合并结果回传云端，两端保持一致（内容含云端全部记录，不会丢数据）
          cloudStatus('已合并同步 · '+new Date().toLocaleTimeString('zh-CN',{hour12:false}));
        }else{
          cloudStatus('已连接云端 · '+new Date().toLocaleTimeString('zh-CN',{hour12:false}));
        }
      }else{cloudStatus('已连接云端');}
    }else{

  }).catch(function(e){
    cloudPulling=false;console.log('云拉取失败',e);
    cloudStatus('云同步未连接');
    if(_dirty)flushPush();
  });
}

var _NF=null;

/* 两位补零：先转数字，避免把已经补过零的字符串（'03'）再补一次变成 '003' */
function p2(n){var v=parseInt(n,10);if(isNaN(v))v=0;return v<10?'0'+v:''+v;}
function today(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
/* n 天后的日期（合同到期提醒示例数据 / 日期推算用） */
function dateAdd(days){var d=new Date();d.setDate(d.getDate()+(Number(days)||0));return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}

/* Excel 日期归一：兼容 日期序列号（46035）/ Date 对象 / 文本（2026-01-12、2026/1/12、2026年1月12日、20260113）；
   不是日期的内容（如「调账」）返回 ''，由调用方决定回退。所有 Excel 导入的日期字段都必须走这里，
   否则表格里写着 2026/1/13、导进来会变成 46035 这样的序列号 */
function xlDate(v){
  if(v===null||v===undefined||v==='')return '';
  if(typeof v==='object'&&v.getFullYear)return v.getFullYear()+'-'+p2(v.getMonth()+1)+'-'+p2(v.getDate());
  var s=String(v).trim();if(!s)return '';
  if(/^\d+(\.\d+)?$/.test(s)){
    var n=parseFloat(s),o=(window.XLSX&&XLSX.SSF&&XLSX.SSF.parse_date_code)?XLSX.SSF.parse_date_code(n):null;
    if(o&&n>=20000&&n<=80000)return o.y+'-'+p2(o.m)+'-'+p2(o.d);   /* Excel 日期序列号 */
    if(/^\d{8}$/.test(s))return s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8);  /* 20260113 */
    return '';
  }
  var m=s.replace(/[\/.年月]/g,'-').replace(/日/g,'').match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m)return m[1]+'-'+p2(m[2])+'-'+p2(m[3]);
  return '';

/* Excel 年月归一：2026年1月 / 2026-01 / 2026/1 → 'YYYY-MM'；表里只写「1月份」时用兜底年份补全 */
function xlYm(v,year){
  var s=String(v==null?'':v).trim().replace(/\s/g,'');if(!s)return '';
  var m=s.match(/^(\d{4})[-\/.年](\d{1,2})/);
  if(m)return m[1]+'-'+p2(m[2]);
  m=s.match(/^(\d{1,2})月份?$/);
  if(m&&year){var mo=parseInt(m[1],10);if(mo>=1&&mo<=12)return year+'-'+p2(mo);}
  return '';
}
/* 兼容旧调用：先按 Excel 日期归一，不像日期时保持原样（表单里手填的日期串） */
function normDate(s){return xlDate(s)||String(s==null?'':s).trim().replace(/[\/\.]/g,'-');}
/* 表格数字：容忍千分位、货币符号与「元」后缀 */
function xlNum(v){return parseFloat(String(v==null?'':v).replace(/[,，\s￥¥$元]/g,''))||0;}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
/* 输入防抖：搜索框每敲一个字都会重画整张表（订单 400+ 行时手机端明显卡），统一延迟 120ms 合并 */
function debounce(fn,ms){var t=0;return function(){var a=arguments,s=this;clearTimeout(t);t=setTimeout(function(){fn.apply(s,a);},ms||120);};}
/* Excel 解析库是异步加载的（首屏不再被 CDN 阻塞）：点导入时若还没到，等它到货再继续，不打断操作 */
function whenXLSX(fn,tries){
  if(window.XLSX)return fn();

  setTimeout(function(){whenXLSX(fn,(tries|0)+1);},200);

/* 只读索引缓存：产品 / 客户 / 库存 / 已发货 / 已回款，避免列表逐行全表扫描；
   数据每次变动（save）或页面每次重绘（render）时自动失效重建 */
var _IDX_VER=0,_idxBuilt=-1,_prodMap=null,_custMap=null,_stockMap=null,_shipMap=null,_paidMap=null,_paidRf=null,_orderMap=null,_paidCnt=null,_ordAgg=null,_ordByCust=null,_ordByAgent=null,_ordLines=null,_wrMap=null;
function _buildIdx(){
  if(_idxBuilt===_IDX_VER)return;
  _prodMap={};_custMap={};_stockMap={};_shipMap={};_paidMap={};_paidRf={};_orderMap={};_paidCnt={};_ordAgg={};_ordByCust={};_ordByAgent={};_ordLines={};_wrMap={};
  for(var i=0;i<db.products.length;i++)_prodMap[db.products[i].id]=db.products[i];
  for(var ci=0;ci<db.customers.length;ci++){var cu=db.customers[ci];if(cu&&cu.id&&!_custMap[cu.id])_custMap[cu.id]=cu;}
  for(var b=0;b<db.batches.length;b++){
    var bt=db.batches[b],bp=_prodMap[bt.pid],per=bp?prodPerBox(bp):(Number(bt.perBox)||1);
    _stockMap[bt.pid]=(_stockMap[bt.pid]||0)+(Number(bt.boxes)||0)*per+(Number(bt.units)||0);
  }
  for(var s=0;s<db.shipments.length;s++){
    var sh=db.shipments[s];
    _shipMap[sh.orderNo]=(_shipMap[sh.orderNo]||0)+(Number(sh.totalUnits)||0);
  }
  for(var y=0;y<db.payments.length;y++){
    var pm=db.payments[y],nos=payNos(pm),amt=Number(pm.amount)||0,rf=Number(pm.refund)||0;
    for(var n=0;n<nos.length;n++){_paidMap[nos[n]]=(_paidMap[nos[n]]||0)+amt;_paidRf[nos[n]]=(_paidRf[nos[n]]||0)+rf;_paidCnt[nos[n]]=(_paidCnt[nos[n]]||0)+1;}
  }
  for(var o2=0;o2<db.orders.length;o2++){var od=db.orders[o2];if(!_orderMap[od.no])_orderMap[od.no]=od;}
  /* 订单按「单号」聚合（一个单号可能多行产品），并按客户 / 代理商建倒排，供回款匹配与明细查表用 */
  for(var o3=0;o3<db.orders.length;o3++){
    var od3=db.orders[o3],no3=String(od3.no==null?'':od3.no);if(!no3)continue;
    (_ordLines[no3]||(_ordLines[no3]=[])).push(od3);   /* 单号 → 该单的全部产品行 */
    var a3=_ordAgg[no3];
    if(!a3){
      a3=_ordAgg[no3]={no:no3,cust:String(od3.custName==null?'':od3.custName).trim(),agent:String(od3.agentName==null?'':od3.agentName).trim(),
        date:od3.shipDate||'',amt:0,n:0,names:[]};
      if(a3.cust){if(!_ordByCust[a3.cust])_ordByCust[a3.cust]=[];_ordByCust[a3.cust].push(no3);}
      if(a3.agent){if(!_ordByAgent[a3.agent])_ordByAgent[a3.agent]=[];_ordByAgent[a3.agent].push(no3);}
    }
    a3.amt+=Number(od3.amount)||0;a3.n++;
    if(od3.prodLabel&&a3.names.indexOf(od3.prodLabel)<0)a3.names.push(od3.prodLabel);
  }
  /* 工作纪要：订单号 → 纪要记录（按订单号存一条，不随订单行编辑重建丢失） */
  for(var w1=0;w1<(db.wnotes||[]).length;w1++){var wn1=db.wnotes[w1];if(wn1&&wn1.no)_wrMap[String(wn1.no)]=wn1;}
  _idxBuilt=_IDX_VER;
}
/* 件装量解析：规格最后一组数为件装量，如 12*2*300 → 300盒/件 */
function parsePerBox(spec){
  var m=String(spec||'').match(/(\d+(?:\.\d+)?)/g);
  if(!m)return 0;
  var n=Math.floor(parseFloat(m[m.length-1]));
  return (n>=10&&n<=20000)?n:0;
}
/* 产品件装量：优先取规格末组数，其次取档案存储值，兜底40 */
function prodPerBox(p){
  if(!p)return 40;
  return parsePerBox(p.spec)||Number(p.perBox)||40;
}
function findProd(id){_buildIdx();return _prodMap[id]||null;}
function findCust(id){_buildIdx();return _custMap[id]||null;}
function stockUnits(pid){_buildIdx();return _stockMap[pid]||0;}
function stockText(pid){var p=findProd(pid);if(!p)return '0盒';var u=stockUnits(pid);var per=prodPerBox(p);return Math.floor(u/per)+'件'+u%per+'盒';}
/* 回款关联的发货单号列表（支持一笔回款对应多笔订单，单号间用逗号/空格分隔） */
function payNos(r){var s=String((r&&(r.shipNo||r.orderNo))||'');return s.split(/[,，、;；\s]+/).filter(function(x){return x;});}
function orderPaid(no){_buildIdx();return _paidMap[String(no)]||0;}
function orderPaidRefund(no){_buildIdx();return _paidRf[String(no)]||0;}
function orderPaidCnt(no){_buildIdx();return _paidCnt[String(no)]||0;}
/* 单号 → 该单的产品行（订单表里同一单号可能有多行产品）；查表用索引，避免逐行扫全表 */
function ordLines(no){_buildIdx();return _ordLines[String(no)]||[];}
function ordLine1(no){return ordLines(no)[0]||null;}
function orderShipped(no){_buildIdx();return _shipMap[no]||0;}
function orderNeed(o){var p=findProd(o.pid);return (Number(o.qtyBoxes)||0)*prodPerBox(p)+(Number(o.qtyUnits)||0);}
/* 订单状态：自动匹配回款明细——有匹配回款即已回款，无匹配即未回款（一笔订单可对应多笔回款，如预付款+尾款）
   回款金额为 0、全靠返款冲抵的，标「已回款（全返款）」 */
function orderStatus(o){
  var amt=orderPaid(o.no),cnt=orderPaidCnt(o.no);
  if(cnt){
    if(amt>0)return {t:'已回款 '+fmtN(amt)+' 元',c:'ok'};
    return orderPaidRefund(o.no)>0?{t:'已回款（全返款）',c:'ok'}:{t:'已回款',c:'ok'};
  }
  return {t:'未回款',c:'warn'};
}
function custCatTag(c){var map={'省总':'c1','大包商':'c2','零散客户':'c3'};return '<span class="tag '+(map[c]||'c1')+'">'+esc(c)+'</span>';}

/* ================= 工作纪要（销售订单）：拒收 / 卡盒 / 买赔 =================
   按「订单号」存一条记录（db.wnotes），编辑订单行重建不影响；删除整单时一并删除。
   列表纪要列可直接打勾✅，未完成的自动提示在首页「业务待办」。 */
function findWr(k){_buildIdx();return _wrMap[String(k)]||null;}
function wrText(w){
  if(!w)return '';
  var p=[];
  if(Number(w.rj)>0)p.push('拒'+fmtN(w.rj));
  if(Number(w.kb)>0)p.push('卡'+fmtN(w.kb));
  if(Number(w.mp)>0)p.push('赔'+fmtN(w.mp));
  return p.join(' ');
}
/* 订单列表「工作纪要」列：有小方格可直接打勾，完成后划线置灰 */
function wrCell(r){
  var w=findWr(r.no),t=wrText(w);
  if(!t)return '<span style="color:var(--sub)">—</span>';
  return '<label style="display:inline-flex;align-items:center;gap:5px;white-space:nowrap;cursor:pointer;margin:0">'
    +'<input type="checkbox" class="chkbox"'+(w.done?' checked':'')+' onchange="toggleWrDone(\''+r.no+'\',this)">'
    +(w.done?'<span style="text-decoration:line-through;color:var(--sub)">'+esc(t)+'</span>':'<span>'+esc(t)+'</span>')+'</label>';
}
/* 打勾/取消：k 可传订单号（列表）或纪要记录 id（首页待办） */
function toggleWrDone(k,el){
  var w=db.wnotes.filter(function(x){return x.id===k||String(x.no)===String(k);})[0];
  if(!w){if(el)el.checked=false;return;}
  w.done=!w.done;touch(w);save();render();
}
/* 编辑工作纪要（订单列表「纪要」按钮） */
function openWrForm(no){
  var o=ordLine1(no)||{};
  var w=findWr(no)||{};
  openForm('工作纪要 · 订单 '+no,[
    {key:'wrRj',label:'拒收（数量）',type:'number',ph:'拒收数量（盒），没有填 0'},
    {key:'wrKb',label:'卡盒（数量）',type:'number',ph:'卡盒数量（盒），没有填 0'},
    {key:'wrMp',label:'买赔（金额）',type:'number',ph:'买赔金额（元），没有填 0'},
    {key:'wrDone',label:'完成状态',type:'select',options:['未完成','已完成']}
  ],{wrRj:Number(w.rj)||0,wrKb:Number(w.kb)||0,wrMp:Number(w.mp)||0,wrDone:w.done?'已完成':'未完成'},
  function(v){saveWr(no,o.custName||'',v);});
}
function saveWr(no,custName,v){
  var rj=Number(v.wrRj)||0,kb=Number(v.wrKb)||0,mp=Number(v.wrMp)||0,done=v.wrDone==='已完成';
  var w=db.wnotes.filter(function(x){return String(x.no)===String(no);})[0];
  if(!w){
    if(!rj&&!kb&&!mp){closeModal();return;}
    w={id:uid(),no:String(no),custName:custName||'',rj:0,kb:0,mp:0,done:false};
    db.wnotes.push(w);
  }
  w.rj=rj;w.kb=kb;w.mp=mp;w.done=done;
  if(custName&&!w.custName)w.custName=custName;
  touch(w);save();closeModal();render();
}

/* ================= 核对打勾列（销售订单 / 回款明细） =================
   列表最左侧（序号前）一个小方格，核对完点一下即打勾✅；
   勾选结果写进该条记录的 chk 字段，随记录一起多设备云同步，不会因刷新丢失 */
var CHK_TABLE={order:'orders',pay:'payments'};
function chkColDef(){return {key:'chk',label:'核对',chk:true,fmt:function(r){return r.chk?'已核对':'未核对';}};}
function chkRec(mod,id){
  var t=CHK_TABLE[mod];if(!t)return null;
  for(var i=0;i<db[t].length;i++)if(db[t][i].id===id)return db[t][i];
  return null;
}
function chkCellHTML(mod,row){
  if(row&&row.chkHide)return '<td class="chk-th"></td>';  /* 同一笔记录拆多行时只在首行给勾选 */
  var on=!!row.chk;
  return '<td class="chk-th'+(on?' chk-on':'')+'"><input type="checkbox" class="chkbox"'+(on?' checked':'')+' onchange="toggleChk(\''+mod+'\',\''+row.id+'\',this)"></td>';
}
function toggleChk(mod,id,el){
  var rec=chkRec(mod,id);
  if(!rec){if(el)el.checked=false;return;}
  rec.chk=!!(el?el.checked:!rec.chk);
  touch(rec);save();
  if(el&&el.parentNode)el.parentNode.className='chk-th'+(rec.chk?' chk-on':'');
  chkHeadSync();
}
/* 表头方格：把当前筛选出来的记录一键全选 / 取消全选 */
function toggleChkAll(mod,el){
  var d=colFilterData[mod],t=CHK_TABLE[mod];
  if(!d||!t)return;
  var on=!!el.checked,hit={},n=0;
  smartFiltered(mod,d.cols,(d.rows||[]).slice()).forEach(function(r){if(r&&r.id)hit[r.id]=1;});
  for(var i=0;i<db[t].length;i++){var rec=db[t][i];if(hit[rec.id]&&!!rec.chk!==on){rec.chk=on;touch(rec);n++;}}
  if(n)save();
  var bs=document.querySelectorAll('.tbl-scroll td.chk-th input.chkbox');
  for(var b=0;b<bs.length;b++){bs[b].checked=on;bs[b].parentNode.className='chk-th'+(on?' chk-on':'');}
  chkHeadSync();
}
function chkHeadSync(){
  var hd=document.querySelector('.tbl-scroll th.chk-th input.chkbox');if(!hd)return;
  var bs=document.querySelectorAll('.tbl-scroll td.chk-th input.chkbox'),all=bs.length>0;
  for(var i=0;i<bs.length;i++)if(!bs[i].checked)all=false;
  hd.checked=all;
}

function sumCol(rows,key){var s=0;for(var i=0;i<rows.length;i++)s+=Number(rows[i][key])||0;return s;}

/* ================= 通用智能表格（自动序号 / 列筛选 / 合计行 / 排序辅助） ================= */
var PROD_CAT_ORDER={'自销':0,'OEM':1};
var colFilterState={},colFilterData={},_colFltEl=null;
/* 中文按拼音（首字母）排序：复用同一个 Collator（localeCompare 带 locale 参数每次都要新建校序器，排序时开销大） */
var _COL=null;
function pyCmp(a,b){
  a=String(a==null?'':a);b=String(b==null?'':b);
  if(_COL===null){try{_COL=new Intl.Collator('zh-Hans-CN-u-co-pinyin');}catch(e){_COL=false;}}
  if(_COL)return _COL.compare(a,b);
  return a<b?-1:(a>b?1:0);
}
/* 自然排序：数字段按数值大小（如规格 12*2*300 排在 180*60 之前），文字段按拼音 */
function natCmp(a,b){
  var ra=String(a==null?'':a).match(/\d+|\D+/g)||[],rb=String(b==null?'':b).match(/\d+|\D+/g)||[];
  for(var i=0;i<ra.length&&i<rb.length;i++){
    if(/^\d/.test(ra[i])&&/^\d/.test(rb[i])){
      var d=Number(ra[i])-Number(rb[i]);if(d)return d<0?-1:1;
    }else{var g=pyCmp(ra[i],rb[i]);if(g)return g;}
  }
  return ra.length-rb.length;
}
function dateDescCmp(a,b){return (a||'')>(b||'')?-1:((a||'')<(b||'')?1:0);}
/* 取列的显示值（去掉 HTML 标签，用于筛选匹配） */
function colVal(col,row){
  var v=col.fmt?col.fmt(row):row[col.key];
  return String(v==null?'':v).replace(/<[^>]*>/g,'');
}
function smartFiltered(mod,cols,rows){
  var st=colFilterState[mod]||{};
  for(var k in st){
    var fv=st[k];if(!fv)continue;
    var col=null;
    for(var i=0;i<cols.length;i++)if(cols[i].key===k)col=cols[i];
    if(!col)continue;
    rows=rows.filter(function(x){return colVal(col,x).indexOf(fv)>=0;});
  }
  return rows;
}
/* 智能表格：第一列自动序号；每列 ▾ 筛选；末行合计（列配 sum:true 或 sumFn） */
function cellHTML(col,row){return col.fmt?col.fmt(row):esc(row[col.key]==null?'':row[col.key]);}
/* 智能表格：第一列自动序号；每列 ▾ 筛选；末行合计（列配 sum:true 或 sumFn）
   grp 分组（同订单/同发货单/同代理商+客户）：同一单共用「一个序号」+「一个单号」，
   组内取值完全相同的列合并为一个单元格（rowspan），不再插分组表头行 */
function smartTableHTML(mod,cols,rows,actionsFn,redraw,grp){
  colFilterData[mod]={cols:cols,rows:rows||[],redraw:redraw||null};
  rows=smartFiltered(mod,cols,(rows||[]).slice());
  var st=colFilterState[mod]||{};
  if(!rows.length)return '<div class="empty">暂无数据</div>';
  var hasGrp=!!(grp&&grp.key);
  /* 单元格 HTML 缓存：判断竖向合并要逐列比对同组各行的值，直接算会把每个 fmt 跑两遍（大表翻倍） */
  var CC=[];
  function ccell(r,c){var row=CC[r]||(CC[r]=[]);if(row[c]===undefined)row[c]=cellHTML(cols[c],rows[r]);return row[c];}
  var rowG=[],gnum=[],gstart=[],gcnt=[],gsame=[],gn=0,gkey=null;
  if(hasGrp){
    /* 按行序切成连续块：同一单号的多行必然相邻，避免 rowspan 跨组错位 */
    for(var q=0;q<rows.length;q++){
      var kk=String(grp.key(rows[q])==null?'':grp.key(rows[q]));
      if(q===0||kk!==gkey){gkey=kk;gn++;gstart.push(q);gcnt.push(1);}else{gcnt[gn-1]++;}
      rowG[q]=gn-1;gnum[q]=gn;
    }
    for(var g=0;g<gn;g++){
      var s0=gstart[g],n0=gcnt[g],flags=[];
      for(var mc=0;mc<cols.length;mc++){
        var cd=cols[mc],same=n0>1&&!cd.chk&&!cd.noMerge,v0=ccell(s0,mc);   /* 核对列、noMerge 列逐行独立，不参与合并 */
        for(var mz=1;same&&mz<n0;mz++){if(ccell(s0+mz,mc)!==v0)same=false;}
        flags.push(same);
      }
      gsame.push(flags);
    }
  }
  var chkIdx=-1;
  for(var ci=0;ci<cols.length;ci++)if(cols[ci].chk)chkIdx=ci;
  var h='<div class="tbl-wrap"><div class="tbl-scroll"><table><thead><tr>';
  if(chkIdx>=0){
    var ckOn=st[cols[chkIdx].key]?' on':'';
    h+='<th class="chk-th" title="点表头可把当前筛选结果一键全选/取消"><input type="checkbox" class="chkbox" onchange="toggleChkAll(\''+mod+'\',this)"> <span class="flt'+ckOn+'" onclick="openColFilter(\''+mod+'\',\''+cols[chkIdx].key+'\',this)" title="筛选">▾</span></th>';
  }
  h+='<th style="width:44px">序号</th>';
  for(var i=0;i<cols.length;i++){
    if(i===chkIdx)continue;
    var on=st[cols[i].key]?' on':'';
    h+='<th>'+cols[i].label+' <span class="flt'+on+'" onclick="openColFilter(\''+mod+'\',\''+cols[i].key+'\',this)" title="筛选">▾</span></th>';
  }
  if(actionsFn)h+='<th style="width:130px">操作</th>';
  h+='</tr></thead><tbody>';
  for(var r=0;r<rows.length;r++){
    var gg=hasGrp?rowG[r]:null;
    var grouped=gg!=null&&gcnt[gg]>1;
    var first=grouped&&gstart[gg]===r;
    var last=grouped&&gstart[gg]+gcnt[gg]-1===r;
    /* 序号：同一单（同组）共用一个序号；按序号单双着色 → 整单同色、相邻单交替，便于观看 */
    var rn=hasGrp?gnum[r]:(r+1);
    var zebra=(rn%2===0);
    var cls=(zebra?'z2 ':'')+(grouped?'grp ':'')+(first?'grp-first ':'')+(last?'grp-last':'');
    cls=cls.replace(/\s+$/,'');
    h+='<tr'+(cls?' class="'+cls+'"':'')+'>';
    if(chkIdx>=0)h+=chkCellHTML(mod,rows[r]);
    if(grouped&&first)h+='<td class="mg" rowspan="'+gcnt[gg]+'">'+rn+'</td>';
    else if(!grouped)h+='<td>'+rn+'</td>';
    for(var c=0;c<cols.length;c++){
      var cc=cols[c];
      if(cc.chk)continue;
      if(grouped&&gsame[gg][c]){
        if(first)h+='<td class="mg" rowspan="'+gcnt[gg]+'">'+ccell(r,c)+'</td>';
      }else{
        h+='<td>'+ccell(r,c)+'</td>';
      }
    }
    if(actionsFn)h+='<td class="act">'+actionsFn(rows[r])+'</td>';
    h+='</tr>';
  }
  h+='</tbody><tfoot><tr>';
  if(chkIdx>=0)h+='<td class="chk-th"></td>';   /* 核对列占位，保证「合计」仍落在序号列 */
  h+='<td><b>合计</b></td>';
  var fcol=0;
  for(var c2=0;c2<cols.length;c2++){
    var cf=cols[c2];
    if(cf.chk)continue;
    if(cf.sum===true)h+='<td><b>'+fmtN(sumCol(rows,cf.key))+'</b></td>';
    else if(cf.sumFn)h+='<td><b>'+cf.sumFn(rows)+'</b></td>';
    else if(!fcol)h+='<td>共 '+rows.length+' 条</td>';
    else h+='<td></td>';
    fcol++;
  }
  if(actionsFn)h+='<td class="act"></td>';
  h+='</tr></tfoot></table></div></div>';
  return h;
}
/* 横向滚动条固定在工作台底部：竖向滑到任何位置都可见，自动跟随当前可见的宽表 */
var HBAR_T=null,HBAR_LOCK=false,HBAR_RAF=0;
function hbarLayout(sc){
  var bar=document.getElementById('hbar');if(!bar)return;
  var sb=document.querySelector('.sidebar');
  if(!sc||!sb){bar.style.left='0px';bar.style.right='0px';return;}
  var t=sc.getBoundingClientRect(),iw=window.innerWidth,ih=window.innerHeight;
  bar.style.left=Math.max(0,Math.round(t.left))+'px';
  bar.style.right=Math.max(0,Math.round(iw-t.right))+'px';
  /* 手机端：底部导航占了底部，横条压在导航之上 */
  bar.style.bottom=(sb.getBoundingClientRect().top>ih/2)?Math.max(0,Math.round(ih-sb.getBoundingClientRect().top))+'px':'0px';
}
function hbarUpdate(){
  var bar=document.getElementById('hbar');if(!bar)return;
  var list=document.querySelectorAll('.tbl-scroll');
  var ih=window.innerHeight,best=null,bestScore=0;
  for(var i=0;i<list.length;i++){
    var sc=list[i];
    if(sc.scrollWidth-sc.clientWidth<=2)continue;      /* 无横向溢出的表不参与 */
    var r=sc.getBoundingClientRect();
    var vis=Math.min(r.bottom,ih)-Math.max(r.top,0);
    if(vis<=0)continue;                                 /* 不在视口内的表不参与 */
    var score=vis+(sc===HBAR_T?20:0);                   /* 优先保持当前目标，避免跳动 */
    if(score>bestScore){bestScore=score;best=sc;}
  }
  HBAR_T=best;
  if(!best){bar.style.display='none';document.body.classList.remove('hbar-on');return;}
  hbarLayout(best);
  var inner=bar.firstElementChild;
  if(inner&&inner.style.width!==best.scrollWidth+'px')inner.style.width=best.scrollWidth+'px';
  bar.style.display='block';
  document.body.classList.add('hbar-on');
  if(Math.abs(bar.scrollLeft-best.scrollLeft)>1)bar.scrollLeft=best.scrollLeft;
}
function hbarSync(){if(HBAR_RAF)return;HBAR_RAF=requestAnimationFrame(function(){HBAR_RAF=0;hbarUpdate();});}
(function hbarBind(){
  var bar=document.getElementById('hbar');if(!bar)return;
  bar.addEventListener('scroll',function(){
    if(HBAR_LOCK||!HBAR_T)return;
    HBAR_LOCK=true;HBAR_T.scrollLeft=bar.scrollLeft;
    setTimeout(function(){HBAR_LOCK=false;},0);
  });
  window.addEventListener('scroll',hbarSync,true);   /* 捕获阶段：页面竖向滚动与表内横向滚动都能收到 */
  window.addEventListener('resize',hbarSync);
  /* 只盯内容区（表格重绘的地方），不再监听整棵文档树，减少每次 DOM 变动带来的回调开销 */
  var host=document.getElementById('content')||document.body;
  new MutationObserver(hbarSync).observe(host,{childList:true,subtree:true});
  hbarSync();
})();

function sortDateAgentCust(rows,dateKey,agFn,cuFn){
  rows.sort(function(a,b){
    var d=dateDescCmp(dateKey(a),dateKey(b));
    if(d)return d;
    var g=pyCmp(agFn(a),agFn(b));
    if(g)return g;
    return pyCmp(cuFn(a),cuFn(b));
  });
  return rows;
}

/* 产品明细比较：产品名称拼音 → 规格数字小到大 */
function prodNameSpecCmp(nameFn,specFn){
  return function(a,b){
    var c=pyCmp(nameFn(a),nameFn(b));
    if(c)return c;
    return natCmp(specFn(a),specFn(b));
  };
}
/* 组内细分排序：相邻且 keyFn 相等的行视为一组，仅组内重排（不打乱组间顺序与分组表头） */
function sortWithinGroups(rows,keyFn,cmp){
  for(var i=0;i<rows.length;){
    var j=i+1;
    while(j<rows.length&&keyFn(rows[j])===keyFn(rows[i]))j++;
    if(j-i>1){var seg=rows.slice(i,j).sort(cmp);for(var k=0;k<seg.length;k++)rows[i+k]=seg[k];}
    i=j;
  }
  return rows;
}

/* ================= 首页产品一览 ================= */
/* 库存=销售库存各批号合计；订单件数=产品订单中同代理商同产品同规格合计件数；挂网价格=自动取「产品档案」里的挂网价格（只读展示） */
function povKey(p){return (p.name||'')+'｜'+(p.spec||'')+'｜'+(p.cat||'')+'｜'+(p.agent||'');}
function prodOverviewHTML(){
  var stock={};
  for(var i=0;i<db.batches.length;i++){
    var b=db.batches[i],bp=findProd(b.pid);
    var per=prodPerBox(bp);
    stock[b.pid]=(stock[b.pid]||0)+(Number(b.boxes)||0)*per+(Number(b.units)||0);
  }
  var map={},keys=[];
  for(var j=0;j<db.products.length;j++){
    var p=db.products[j];
    var key=povKey(p);
    var o=map[key];
    if(!o){
      o={_key:key,name:p.name||'',spec:p.spec||'',cat:p.cat||'',agent:p.agent||'',
         basePrice:0,net:'',stock:0,pids:{},per:prodPerBox(p)};
      map[key]=o;keys.push(key);
    }
    o.stock+=stock[p.id]||0;
    o.pids[p.id]=1;
    if(!o.basePrice&&Number(p.basePrice))o.basePrice=Number(p.basePrice);
    /* 同产品同规格同代理商可能有多条档案，挂网价格取第一条已填写的值 */
    if(o.net===''&&p.netPrice!==undefined&&p.netPrice!==''&&p.netPrice!==null&&!isNaN(Number(p.netPrice)))o.net=Number(p.netPrice);
  }
  /* 产品订单合计（总件数）：一次索引分三档键——分类+名称+规格（自销按此匹配，自销订单无代理商）、
     分类+名称+规格+代理商（OEM 按此匹配），避免嵌套扫描 */
  var poByCat={},poByAgent={};
  for(var m=0;m<db.prodOrders.length;m++){
    var po=db.prodOrders[m],pcat=po.cat||'',pnm=po.name||'',psp=po.spec||'';
    var ck=pcat+'|'+pnm+'|'+psp,ak=pcat+'|'+pnm+'|'+psp+'|'+String(po.agent||'').trim();
    var c1=poByCat[ck]||(poByCat[ck]={orders:0,qty:0});
    c1.orders++;c1.qty+=Number(po.qty)||0;
    var c2=poByAgent[ak]||(poByAgent[ak]={orders:0,qty:0});
    c2.orders++;c2.qty+=Number(po.qty)||0;
  }
  for(var k=0;k<keys.length;k++){
    var it=map[keys[k]];
    var hit;
    if(it.cat==='OEM')hit=poByAgent['OEM|'+it.name+'|'+it.spec+'|'+String(it.agent).trim()]||(String(it.agent).trim()?'':poByCat['OEM|'+it.name+'|'+it.spec]);
    else hit=poByCat[(it.cat||'')+'|'+it.name+'|'+it.spec];
    it.orders=hit?hit.orders:0;it.qty=hit?hit.qty:0;
  }
  /* 自销产品：未填挂网价格的不上首页一览（OEM 不受影响） */
  var zx=[],oem=[];
  for(var k2=0;k2<keys.length;k2++){
    var it2=map[keys[k2]];
    if(it2.cat==='OEM')oem.push(it2);
    else if(Number(it2.net)>0)zx.push(it2);
  }
  /* 自销：产品名称拼音 → 规格数字小到大 */
  zx.sort(function(a,b){var c=pyCmp(a.name,b.name);if(c)return c;return natCmp(a.spec,b.spec);});
  /* OEM：代理商拼音（未关联的排最后）→ 同代理商内产品名称拼音 → 规格数字小到大 */
  oem.sort(function(a,b){
    var a1=(a.agent||'').trim(),b1=(b.agent||'').trim();
    if(!a1&&b1)return 1;

      +'<div class="yw-name">'+esc(row.p.name)+'<small>'+esc(row.p.spec||'')+'</small></div>'

      +'<div class="yw-val">'+fmtN(row.total)+' <small>件</small></div></div>';

/* OEM：点击 → 该代理商客户分布（同一客户的产品放在一起） */
function oemAgentDetail(agRaw,y){
  var cache=WAVE_CACHE['OEM'];if(!cache)return;
  var rows=[];
  for(var i=0;i<cache.rows.length;i++)if((cache.rows[i].agent||'')===(agRaw||''))rows.push(cache.rows[i]);
  if(!rows.length)return;
  var agName=agRaw||'（未关联代理商）';
  var g1='linear-gradient(90deg,var(--oem-1),var(--oem-2))';
  var pids={},per={},pmap={};
  for(var k=0;k<rows.length;k++){pids[rows[k].p.id]=1;per[rows[k].p.id]=prodPerBox(rows[k].p);pmap[rows[k].p.id]=rows[k].p;}
  /* 订单行映射：no|pid → 订单（取客户） */
  var omap={};
  for(var j=0;j<db.orders.length;j++){var o=db.orders[j];if(!omap[o.no+'|'+o.pid])omap[o.no+'|'+o.pid]=o;}
  var custs={},totJian=0,totAmt=0,totBox=0,ret=0,oseen={};
  function cGet(cn){if(!custs[cn])custs[cn]={jian:0,amt:0,prods:{}};return custs[cn];}
  /* 金额 / 订单数：按订单行统计（该代理商全部产品，同单多次发货不重复计金额） */
  for(var o2=0;o2<db.orders.length;o2++){
    var oo=db.orders[o2];
    if(!pids[oo.pid]||(oo.shipDate||'').slice(0,4)!==y)continue;
    var amt=Number(oo.amount)||0;
    totAmt+=amt;
    if(!oseen[oo.no])oseen[oo.no]=1;
    var cn=oo.custName||oo.agentName||'（未关联客户）';
    var cu=cGet(cn);cu.amt+=amt;
    if(!cu.prods[oo.pid])cu.prods[oo.pid]={jian:0,amt:0};
    cu.prods[oo.pid].amt+=amt;
  }
  var ocnt=0;for(var s0 in oseen)ocnt++;
  /* 件数：按发货统计（与图表口径一致） */
  for(var s=0;s<db.shipments.length;s++){
    var sh=db.shipments[s];
    if(!pids[sh.pid]||(sh.shipDate||'').slice(0,4)!==y)continue;
    var u=Number(sh.totalUnits)||0;
    var jian=Math.floor(u/(per[sh.pid]||1));
    totJian+=jian;totBox+=u;
    if(u<0)ret+=u;
    var od=omap[sh.orderNo+'|'+sh.pid]||{};
    var cn2=od.custName||od.agentName||'（未关联客户）';
    var cu2=cGet(cn2);cu2.jian+=jian;
    if(!cu2.prods[sh.pid])cu2.prods[sh.pid]={jian:0,amt:0};
    cu2.prods[sh.pid].jian+=jian;
  }
  /* 弹窗内容：概览 */
  var h='<div class="wd-grid">'
    +'<div><div class="k">代理商</div><div class="v" style="font-size:13px">'+esc(agName)+'</div></div>'
    +'<div><div class="k">'+y+' 年总销量</div><div class="v"><b>'+fmtN(totJian)+'</b> 件（'+fmtN(totBox)+' 盒）</div></div>'
    +'<div><div class="k">年度发货金额</div><div class="v">'+fmtN(totAmt)+' 元</div></div>'
    +'<div><div class="k">产品数</div><div class="v">'+rows.length+' 个</div></div>'
    +'<div><div class="k">涉及订单</div><div class="v">'+ocnt+' 笔</div></div>'
    +'<div><div class="k">退货冲回</div><div class="v" style="font-size:13px">'+(ret<0?fmtN(ret)+' 盒':'无')+'</div></div>'
    +'</div>';
  /* 客户分布：按客户总销量降序，同一客户的产品放在一起 */
  var cl=[];
  for(var cn3 in custs){var c2=custs[cn3];if(c2.jian!==0||c2.amt)cl.push({name:cn3,jian:c2.jian,amt:c2.amt,prods:c2.prods});}
  cl.sort(function(x,y2){return y2.jian-x.jian;});
  if(cl.length){
    var pcMax=1;
    for(var c4=0;c4<cl.length;c4++){
      for(var pk in cl[c4].prods)if(Math.abs(cl[c4].prods[pk].jian)>pcMax)pcMax=Math.abs(cl[c4].prods[pk].jian);
    }
    h+='<div class="wd-sec">客户分布<span class="sub">按客户总销量排序 · 同一客户的产品放在一起</span></div>';
    for(var c5=0;c5<cl.length&&c5<20;c5++){
      var cu3=cl[c5],pl=[];
      for(var pk2 in cu3.prods)pl.push({pid:pk2,jian:cu3.prods[pk2].jian,amt:cu3.prods[pk2].amt});
      pl.sort(function(x,y3){return y3.jian-x.jian;});
      h+='<div class="wd-ag-hd"><span class="an" title="'+esc(cu3.name)+'">'+esc(cu3.name)+'</span><span class="as">合计 <b>'+cu3.jian+'</b> 件 · '+fmtN(cu3.amt)+' 元 · '+pl.length+' 个产品</span></div>';
      for(var p9=0;p9<pl.length;p9++){
        var pp=pmap[pl[p9].pid]||{},lbl2=(pp.name||'')+' '+(pp.spec||'');
        h+='<div class="bar-row wd-sub"><span class="bl" title="'+esc(lbl2)+'">'+esc(lbl2)+'</span><span class="bt"><span class="bf" style="width:'+Math.max(0,Math.abs(pl[p9].jian)/pcMax*100)+'%;background:'+g1+';opacity:.55"></span></span><span class="bv">'+pl[p9].jian+' 件 · '+fmtN(pl[p9].amt)+' 元</span></div>';
      }
    }
    if(cl.length>20)h+='<div class="wd-tip">…仅显示销量前 20 个客户，共 '+cl.length+' 个</div>';

  openWaveModal(agName+'（'+y+' 年 OEM）',h);

/* 共用大弹窗（年度明细 / 资料管理都用它，只有一个「关闭」按钮）；打开时清掉资料面板的重绘回调 */

/* 点击产品 → 放大查看该产品年度明细（月度销量 / 客户分布 / 金额）；OEM 为代理商维度 */
function waveDetail(cat,idx){
  var c=WAVE_CACHE[cat];if(!c)return;
  var row=c.rows[idx];if(!row)return;
  if(cat==='OEM'){oemAgentDetail(row.agent,c.year);return;}
  var p=row.p,y=c.year,per=prodPerBox(p);
  /* 订单映射：orderNo+pid → 订单行（取客户） */
  var omap={};
  for(var i=0;i<db.orders.length;i++){var o=db.orders[i];if(!omap[o.no+'|'+o.pid])omap[o.no+'|'+o.pid]=o;}
  /* 金额 / 订单笔数：直接按该产品当年订单行统计（避免同单多次发货重复计金额） */
  var amt=0,ocnt=0,oseen={},agents={};
  function agGet(an){if(!agents[an])agents[an]={jian:0,amt:0,custs:{}};return agents[an];}
  function cuGet(ag,cn){if(!ag.custs[cn])ag.custs[cn]={jian:0,amt:0};return ag.custs[cn];}
  for(var o2=0;o2<db.orders.length;o2++){
    var oo=db.orders[o2];
    if(oo.pid!==p.id||(oo.shipDate||'').slice(0,4)!==y)continue;
    amt+=Number(oo.amount)||0;
    if(!oseen[oo.no]){oseen[oo.no]=1;ocnt++;}
    var oan=oo.agentName||'（未关联代理商）';
    var ocn=oo.custName||oo.agentName||'（未关联客户）';
    var ag1=agGet(oan);
    ag1.amt+=Number(oo.amount)||0;
    cuGet(ag1,ocn).amt+=Number(oo.amount)||0;
  }
  /* 该产品当年全部发货（与图表口径一致，用于月度/代理商客户件数） */
  var months=[],mMax=0,units=0,ret=0;
  for(var m=0;m<12;m++)months.push(0);
  for(var s=0;s<db.shipments.length;s++){
    var sh=db.shipments[s];
    if(sh.pid!==p.id||(sh.shipDate||'').slice(0,4)!==y)continue;
    var u=Number(sh.totalUnits)||0,mm=Number((sh.shipDate||'').slice(5,7))||0,jian=0;
    if(mm>=1&&mm<=12){jian=Math.floor(u/per);months[mm-1]+=jian;if(months[mm-1]>mMax)mMax=months[mm-1];}
    units+=u;
    if(u<0)ret+=u;
    var od=omap[sh.orderNo+'|'+p.id]||{};
    var san=od.agentName||'（未关联代理商）';
    var scn=od.custName||od.agentName||'（未关联客户）';
    var ag2=agGet(san);

/* 首页政策提醒：只提示"该管了"的政策，避免长期挂一堆不痛不痒的条目。
   触发条件（满足任一即提醒）：
   ① 累计达标政策：累计发货 / 阶段性返点净回款 达到目标的 POLICY_REMIND_PCT%（默认 80%）
   ② 结束日期前 POLICY_REMIND_DAYS 天内（默认 10 天）
   其余有效期内但未到条件的政策不打扰，只在页脚提示还剩多少条 */
var POLICY_REMIND_PCT=80;    /* 达到目标的这个百分比即提醒 */
var POLICY_REMIND_DAYS=10;   /* 结束日期前多少天提醒 */
/* 距政策结束还有几天：无结束日期返回 null，已结束返回负数 */
function policyEndDays(r){
  var w=policyWindow(r);
  if(!w.e)return null;
  var a=Date.parse(w.e+'T00:00:00'),b=Date.parse(today()+'T00:00:00');
  if(isNaN(a)||isNaN(b))return null;
  return Math.round((a-b)/86400000);
}
/* 返回该政策的提醒信息（不需提醒返回 null）：{r, qty:'…', days:'…'} */
function policyRemind(r){
  var t=today(),qtyTxt='',daysTxt='';
  if(policyStage(r)){
    var s=policyStageStat(r);
    if(s.status!=='未开始'&&s.status!=='进行中')return null;
    if(s.target>0&&s.pct>=POLICY_REMIND_PCT)qtyTxt='净回款 '+fmtN(s.net)+' / 目标 '+fmtN(s.target)+' 元（'+s.pct+'%）';
  }else{
    if(!policyActive(r,t))return null;
    if(policyExeMode(r)==='累计达标'){
      var q=policyCumQty(r),tg=Number(r.targetQty)||0;
      if(tg>0&&q/tg*100>=POLICY_REMIND_PCT)qtyTxt='累计发货 '+fmtN(q)+' / 目标 '+fmtN(tg)+' 盒（'+Math.round(q/tg*100)+'%）';
    }
  }
  var d=policyEndDays(r);
  if(d!==null&&d>=0&&d<=POLICY_REMIND_DAYS)daysTxt=(d===0?'今天到期':('距结束还有 '+d+' 天'));
  if(!qtyTxt&&!daysTxt)return null;
  return {r:r,qty:qtyTxt,days:daysTxt};
}
function policyAlertHTML(){
  var t=today(),hits=[],act=0;
  (db.prodPolicies||[]).forEach(function(r){
    var live=policyStage(r)?(['未开始','进行中'].indexOf(policyStageStat(r).status)>=0):policyActive(r,t);
    if(!live)return;
    act++;
    var rm=policyRemind(r);
    if(rm)hits.push(rm);
  });
  if(!hits.length)return '';
  var order={};hits.forEach(function(x){order[x.r.id]=x;});
  var list=policySort(hits.map(function(x){return x.r;}));
  var h='<div class="todo-list">';
  list.forEach(function(r){
    var rm=order[r.id]||{},w=policyWindow(r);
    h+='<div class="todo-item"><span class="todo-txt" style="cursor:pointer" onclick="cur=\'pay\';viewState.pay=\'policy\';render()" title="点击查看产品政策"><span class="tag c1">政策</span> '
      +esc((r.custName||r.agent)+' · '+r.prodName+' · '+policyText(r))
      +(rm.qty?('　<span style="color:var(--sub)">'+esc(rm.qty)+'</span>'):'')

      +(w.e?('　<span style="color:var(--sub)">'+esc(w.s||'')+' ~ '+esc(w.e)+'</span>'):'')+'</span></div>';
  });
  h+='</div>';
  if(act>hits.length)h+='<div class="hint" style="margin-top:8px">其余 '+(act-hits.length)+' 条政策在有效期内，累计未达 '+POLICY_REMIND_PCT+'%、距今结束超过 '+POLICY_REMIND_DAYS+' 天，暂不提醒（点上方任一条可查看全部政策）</div>';

function isDemoCust(r){return !!(r&&(r.demo||(DEMO_PHONE[r.phone]&&DEMO_COMPANY[r.company])));}
function isDemoProd(r){return !!(r&&(r.demo||(String(r.custName||'').indexOf('示例客户')===0&&(r.brand==='XX制药'||r.brand==='YY药业'))));}
function isDemoTodo(r){return !!(r&&(r.demo||DEMO_TODO[r.text]));}
function demoCount(){
  var n=0,c=0;
  ['customers','products','batches','orders','shipments','payments','prodOrders','develop','logs','todos'].forEach(function(k){
    (db[k]||[]).forEach(function(r){if(r&&r.demo)n++;});
  });
  (db.customers||[]).forEach(function(r){if(isDemoCust(r)&&!r.demo)c++;});
  (db.products||[]).forEach(function(r){if(isDemoProd(r)&&!r.demo)c++;});
  (db.todos||[]).forEach(function(r){if(isDemoTodo(r)&&!r.demo)c++;});
  return n+c;
}
/* 清除示例数据：删除全部示例记录并打删除标记（所有设备同步删除），真实数据不受影响 */
function clearDemoData(){
  var total=demoCount();
  if(!total){alert('当前没有发现示例数据。');return;}
  if(!confirm('将清除 '+total+' 条示例数据（客户/产品/库存/订单/发货/回款/待办等）。\n\n你自己的真实数据不会受影响；清除结果会同步到所有设备，且不可恢复。\n\n确定清除吗？'))return;
  var demoProdIds={},ids=[];
  (db.products||[]).forEach(function(p){if(isDemoProd(p))demoProdIds[p.id]=1;});
  function keep(arr,pred){
    var out=[];
    (arr||[]).forEach(function(r){
      if(r&&pred(r)){ids.push(r.id);}else{out.push(r);}
    });
    return out;
  }
  db.customers=keep(db.customers,isDemoCust);
  db.products=keep(db.products,isDemoProd);
  db.todos   =keep(db.todos,isDemoTodo);
  db.batches =keep(db.batches,function(r){return r&&((r.demo)||demoProdIds[r.pid]);});
  db.orders  =keep(db.orders,function(r){return r&&((r.demo)||demoProdIds[r.pid]);});
  db.shipments=keep(db.shipments,function(r){return r&&((r.demo)||demoProdIds[r.pid]);});
  db.docs    =keep(db.docs,function(r){return r&&((r.demo)||demoProdIds[r.refId]);});
  /* 其余表按 demo 标记清理 */
  ['payments','prodOrders','develop','logs'].forEach(function(k){
    db[k]=keep(db[k],function(r){return !!(r&&r.demo);});
  });
  markDel(ids);
  if(db.demoPayTarget){delete db.demoPayTarget;if(Number(db.payTarget)===2310000){db.payTarget=0;db.payTargetT=Date.now();}}
  save();render();
  alert('已清除 '+ids.length+' 条示例数据，并同步删除到所有设备。');
}

/* 导入 Excel（支持模板 .xlsx 与导出的 .xls） */
function importCustExcel(input){
  var f=input.files&&input.files[0];if(!f)return;
  if(!window.XLSX){whenXLSX(function(){importCustExcel(input);});return;}
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var wb=XLSX.read(new Uint8Array(rd.result),{type:'array'});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var json=XLSX.utils.sheet_to_json(ws,{header:1});
      var headRow=-1,headMap={};
      for(var i=0;i<json.length;i++){
        var row=json[i];if(!row||!row.length)continue;
        if(row.join(',').indexOf('客户分类')>=0||row.join(',').indexOf('客户名称')>=0){headRow=i;break;}
      }
      if(headRow<0){alert('未识别到表头，请先点击"模板"下载模板按格式填写');return;}
      var map={'客户分类':'cat','代理商':'agent','客户名称':'company','收货人':'contact','联系电话':'phone','收货地址':'addr','配送要求':'delivery','邮寄收件人':'mailContact','邮寄电话':'mailPhone','邮寄地址':'mailAddr','备注':'note'};
      var head=json[headRow];
      for(var j=0;j<head.length;j++){
        var hc=String(head[j]==null?'':head[j]).trim();
        if(map[hc])headMap[j]=map[hc];
      }
      var added=0,skip=0,skipMsg=[];
      for(var k=headRow+1;k<json.length;k++){
        var rr=json[k];if(!rr)continue;
        var rec={id:uid(),created:today()},any=false;
        for(var c in headMap){
          rec[headMap[c]]=String(rr[c]==null?'':rr[c]).trim();
          if(rec[headMap[c]])any=true;
        }
        if(!any)continue;
        if(isTplExample(rec)){skip++;if(typeof skipMsg!=='undefined')skipMsg.push('模板示例行（'+String(rec.name||rec.custName||rec.company||rec.prodName||rec.agent||rec.agentName||'')+'…）已自动跳过');continue;}
        if(rec.cat&&rec.cat!=='省总'&&rec.cat!=='大包商'&&rec.cat!=='零散客户'){skip++;continue;}
        if(!rec.company){skip++;continue;}
        rec.cat=rec.cat||'零散客户';
        db.customers.push(rec);added++;
      }
      save();
      if(input)input.value='';
      alert(added?('成功导入 '+added+' 条客户'+(skip?('，跳过 '+skip+' 条：\n'+skipMsg.join('\n')):'')):('未导入数据，请检查格式'+(skip?('（跳过 '+skip+' 条：\n'+skipMsg.join('\n')):'')));
      render();
    }catch(e){console.log('导入失败',e);alert('导入失败：'+e.message);}
  };
  rd.readAsArrayBuffer(f);
}

/* 库存排序：产品分类（自销→OEM）→ 产品名称（拼音首字母）→ 规格（数字小→大）→ 批号（数字小→大）
   OEM 段额外先按 代理商 → 客户名称（未关联代理商的排该段最后） */
function stockSort(rows){
  return rows.slice().sort(function(a,b){
    var pa=findProd(a.pid)||{},pb=findProd(b.pid)||{};
    var c=prodCatIdx(pa.cat)-prodCatIdx(pb.cat);if(c)return c;
    if(pa.cat==='OEM'){
      var aa=String(pa.agent||'').trim(),ab=String(pb.agent||'').trim();
      if(!aa&&ab)return 1;
      if(!ab&&aa)return -1;
      c=pyCmp(aa,ab);if(c)return c;
      c=pyCmp(pa.custName,pb.custName);if(c)return c;
    }
    c=pyCmp(pa.name,pb.name);if(c)return c;
    c=natCmp(pa.spec,pb.spec);if(c)return c;
    return natCmp(a.batchNo,b.batchNo);
  });
}
function filterStock(){
  var q=(document.getElementById('stockSearch')||{}).value||'';
  if(!q)return db.batches.slice();
  return db.batches.filter(function(b){
    var p=findProd(b.pid)||{};
    return ((p.name||'')+(p.spec||'')+(b.batchNo||'')+(p.agent||'')+(p.brand||'')+(p.cat||'')).indexOf(q)>=0;
  });
}
/* 数量换算：总盒数/件装量 → x件y盒 */
function stockQtyText(b){
  var p=findProd(b.pid);
  var per=p?prodPerBox(p):(Number(b.perBox)||1);
  var t=(Number(b.boxes)||0)*per+(Number(b.units)||0);
  return Math.floor(t/per)+'件'+(t%per)+'盒';
}

/* 数量换算：总盒数/件装量 → 整数件 + 剩余盒 */
function stockCalcQty(){
  var pidSel=formEl('pid');

  if(!qtyEl)return;
  var hintEl=qtyEl.parentNode?qtyEl.parentNode.querySelector('.hint'):null;
  var p=pidSel?findProd(pidSel.value):null;
  if(!hintEl)return;
  if(!p){hintEl.textContent='';return;}
  var per=prodPerBox(p);
  var t=Math.floor(Number(qtyEl.value)||0);
  if(t>0)hintEl.textContent='= '+Math.floor(t/per)+'件'+(t%per)+'盒';
  else hintEl.textContent='';
}

/* 库存导入 Excel（支持模板 .xlsx 与导出的 .xls） */
function importStockExcel(input){
  var f=input.files&&input.files[0];if(!f)return;
  if(!window.XLSX){whenXLSX(function(){importStockExcel(input);});return;}
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var wb=XLSX.read(new Uint8Array(rd.result),{type:'array'});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var json=XLSX.utils.sheet_to_json(ws,{header:1});
      var headRow=-1,headMap={};
      for(var i=0;i<json.length;i++){
        var row=json[i];if(!row||!row.length)continue;
        if(row.join(',').indexOf('产品名称')>=0||row.join(',').indexOf('批号')>=0){headRow=i;break;}
      }
      if(headRow<0){alert('未识别到表头，请先点击"模板"下载模板按格式填写');return;}
      var map={'产品分类':'cat','产品名称':'name','规格':'spec','批号':'batchNo','数量':'qty','有效期至':'expire','代理商':'agent','商标':'brand'};
      var head=json[headRow];
      for(var j=0;j<head.length;j++){
        var hc=String(head[j]==null?'':head[j]).trim();
        if(map[hc])headMap[j]=map[hc];
      }
      var added=0,skip=0,skipMsg=[];
      for(var k=headRow+1;k<json.length;k++){
        var rr=json[k];if(!rr)continue;
        var rec={},any=false;
        for(var c in headMap){
          var v=String(rr[c]==null?'':rr[c]).trim();
          rec[headMap[c]]=v;
          if(v)any=true;
        }
        if(!any)continue;
        if(isTplExample(rec)){skip++;if(typeof skipMsg!=='undefined')skipMsg.push('模板示例行（'+String(rec.name||rec.custName||rec.company||rec.prodName||rec.agent||rec.agentName||'')+'…）已自动跳过');continue;}
        if(rec.cat!=='自销'&&rec.cat!=='OEM'){skip++;skipMsg.push('第'+(k+1)+'行：产品分类需为 自销 或 OEM');continue;}
        if(!rec.name){skip++;skipMsg.push('第'+(k+1)+'行：产品名称缺失');continue;}
        if(!rec.batchNo){skip++;skipMsg.push('第'+(k+1)+'行：批号缺失');continue;}
        rec.expire=xlDate(rec.expire)||rec.expire;   /* 有效期列若是 Excel 日期，先归一成 2026-05-11 再入库 */
        if(!rec.expire){skip++;skipMsg.push('第'+(k+1)+'行：有效期至缺失');continue;}
        // 数量支持"3件100盒"、"1000盒"、"1000"三种写法
        var m=String(rec.qty||'').match(/^(\d+)\s*件\s*(\d+)?\s*盒?$/);
        var t=0;
        if(m){
          var p0=findProdByNameCat(rec.name,rec.cat);
          var per=p0?prodPerBox(p0):1;
          t=(parseInt(m[1],10)||0)*per+(parseInt(m[2]||'0',10)||0);
        }else{
          var m2=String(rec.qty||'').match(/^(\d+)\s*盒?$/);
          if(m2)t=parseInt(m2[1],10)||0;
        }
        if(!(t>0)){skip++;skipMsg.push('第'+(k+1)+'行：数量无法识别（如 3件100盒 或 1000）');continue;}
        // 匹配产品档案：同分类+同名称（规格有值时优先精确匹配）
        var p=findProdByNameCat(rec.name,rec.cat,rec.spec);
        if(!p){skip++;skipMsg.push('第'+(k+1)+'行：产品档案中未找到「'+rec.cat+'」分类下名称为「'+rec.name+'」的产品，请先在产品档案中新增');continue;}
        var per2=prodPerBox(p);
        var boxes=Math.floor(t/per2),units=t%per2;
        db.batches.push({id:uid(),pid:p.id,perBox:per2,batchNo:rec.batchNo,expire:rec.expire,
          boxes:boxes,units:units,inBoxes:boxes,inUnits:units,inDate:today(),note:''});
        added++;
      }
      save();
      if(input)input.value='';
      alert(added?('成功导入 '+added+' 条库存'+(skip?('，跳过 '+skip+' 条：\n'+skipMsg.slice(0,5).join('\n')):'')):('未导入数据。\n'+(skipMsg.length?skipMsg.slice(0,5).join('\n'):'请检查表格内容')));
      render();
    }catch(e){console.log('导入失败',e);alert('导入失败：'+e.message);}
  };
  rd.readAsArrayBuffer(f);
}
/* 按分类+名称(+规格)匹配产品档案 */
function findProdByNameCat(name,cat,spec){
  var list=db.products.filter(function(p){return p.cat===cat&&p.name===name;});
  if(spec&&list.length>1){
    var exact=list.filter(function(p){return p.spec===spec;});
    if(exact.length)return exact[0];
  }
  return list[0]||null;
}

function openOrderForm(id){
  var r=id?db.orders.filter(function(x){return x.id===id;})[0]:null;
  var rows=r?ordLines(r.no):[]; /* 同订单号的多行产品 */
  if(!rows.length&&r)rows=[r];
  var cc=r?(findCust(r.agentId)||db.customers.filter(function(x){return x.company===r.agentName;})[0]||null):null;
  OF={id:id||'',oldNo:r?(r.no||''):'',cat:cc?(cc.cat||''):'',agent:cc?(cc.agent||''):'',
      custName:r?(r.custName||''):'',shipDate:r?(r.shipDate||today()):today(),
      payMethod:r?(r.payMethod||'现款'):'现款',note:r?(r.note||''):'',
      polId:r?(r.polId||''):'',polText:r?(r.polText||''):'',items:[]};
  rows.forEach(function(o){
    var p=findProd(o.pid)||{};
    OF.items.push({pid:o.pid||'',prodCat:(p.cat==='OEM'||p.cat==='自销')?p.cat:'',batchNo:o.batchNo||'',
      qty:(Number(o.qtyBoxes)||0)*prodPerBox(p)+(Number(o.qtyUnits)||0),
      basePrice:Number(o.basePrice)||'',supplyPrice:Number(o.supplyPrice)||'',
      invoicePrice:Number(o.invoicePrice)||(Number(p.invoicePrice)||''),
      amount:Number(o.amount)||'',amountManual:!!o.gift,tax:Number(o.tax)||'',taxManual:false,
      refund:Number(o.refund)||'',refundManual:false,
      rebateOn:!!o.rebateOn,rebatePer:Number(o.rebatePer)||'',rebate:Number(o.rebate)||'',gift:!!o.gift});
  });
  if(!OF.items.length)OF.items.push(orderNewItem());
  document.getElementById('mTitle').textContent=id?'编辑订单':'新增销售订单';
  mFields=[];mPhotoVals={};
  mSave=function(){saveOrderForm();};
  document.getElementById('mask').classList.add('show');
  renderOrderForm();
}
function renderOrderForm(){
  var h='';
  h+='<div class="fitem"><label>订单号 <b>*</b></label><input data-k="no" value="'+esc(OF.oldNo)+'" placeholder="手动输入订单号"></div>';
  h+='<div class="fitem"><label>客户分类 <b>*</b></label><select data-k="cat" onchange="orderCatSel(this)"><option value="">请选择</option>';
  var cs=['省总','大包商','零散客户'];
  for(var i=0;i<cs.length;i++)h+='<option value="'+cs[i]+'"'+(OF.cat===cs[i]?' selected':'')+'>'+cs[i]+'</option>';
  h+='</select></div>';
  h+='<div class="fitem"><label>代理商 <b>*</b></label><select data-k="agent" onchange="orderAgentSel(this)">'+orderAgentOptsHTML(OF.cat,OF.agent)+'</select></div>';
  var cl=orderCustList(OF.cat,OF.agent);
  h+='<div class="fitem"><label>客户名称 <b>*</b></label><input data-k="custName" list="dl_custName" value="'+esc(OF.custName)+'" placeholder="从列表选择或手动输入下游客户" oninput="orderPolRefresh()"><datalist id="dl_custName">';
  for(var d=0;d<cl.length;d++)h+='<option value="'+esc(cl[d])+'">';
  h+='</datalist></div>';
  h+='<div class="fitem"><label>发货日期 <b>*</b></label><input type="date" data-k="shipDate" value="'+esc(OF.shipDate)+'" onchange="orderPolRefresh()"></div>';
  h+='<div class="fgroup">产品明细</div>';
  h+='<div id="ofItems"></div>';
  h+='<div class="fitem full"><button type="button" class="btn sm" onclick="orderAddItem()">＋ 添加产品</button></div>';
  h+='<div class="fitem"><label>付款方式</label><select data-k="payMethod">';
  var pm=['现款','预付','账期','承兑'];
  for(var m=0;m<pm.length;m++)h+='<option value="'+pm[m]+'"'+(OF.payMethod===pm[m]?' selected':'')+'>'+pm[m]+'</option>';
  h+='</select></div>';
  h+='<div class="fitem"><label>订单政策</label><select data-k="polId" onchange="orderPolSel(this)">'+orderPolOptsHTML(OF.polId||(OF.polText?'__custom__':''))+'</select></div>';
  h+='<div class="fitem full"><label>政策说明（一次性政策在此手动填写）</label><input data-k="polText" value="'+esc(OF.polText||'')+'" placeholder="选择政策自动带入；一次性政策可直接手动填写"></div>';
  h+='<div class="fitem full"><label>订单备注</label><textarea data-k="note">'+esc(OF.note)+'</textarea></div>';
  document.getElementById('mBody').innerHTML=h;
  orderRenderItems();
}
function saveOrderForm(){
  var no=(formVal('no')||'').trim();
  if(!no){alert('请填写订单号（手动输入）');return;}
  var cat=formVal('cat'),agent=formVal('agent'),custName=formVal('custName'),shipDate=formVal('shipDate');
  if(!cat){alert('请选择客户分类');return;}
  if(!agent){alert('请选择代理商');return;}
  if(!custName){alert('请填写客户名称');return;}
  if(!shipDate){alert('请选择发货日期');return;}
  var items=[];
  for(var i=0;i<OF.items.length;i++){
    var it=OF.items[i];if(!it.pid)continue;
    if(!(Number(it.qty)>0)){alert('请为每个已选产品填写数量（盒）');return;}
    items.push(it);
  }
  if(!items.length){alert('请至少选择一个产品并填写数量');return;}
  var dup=db.orders.filter(function(x){return x.no===no&&x.no!==OF.oldNo;});
  if(dup.length&&!confirm('订单号 '+no+' 已存在 '+dup.length+' 条产品行，将并入同一订单号下。确定继续？'))return;
  if(OF.oldNo&&orderShipped(OF.oldNo)>0&&!confirm('该订单已有发货记录，修改数量/价格会影响对账数据，确定保存？'))return;
  var histOrder=normDate(shipDate)<STOCK_CUTOFF;   /* 历史补录订单（分界日前）不做库存校验、不扣库存 */
  if(!histOrder)for(var j=0;j<items.length;j++){
    var it2=items[j],avail=stockUnits(it2.pid);
    if(Number(it2.qty)>avail&&!confirm('产品「'+((findProd(it2.pid)||{}).name||'')+'」库存不足！需要 '+it2.qty+' 盒，当前库存 '+avail+' 盒。仍要保存？（可后续发货时处理）'))return;
  }
  var cust=db.customers.filter(function(x){return x.company===custName;})[0]
    ||db.customers.filter(function(x){return x.cat===cat&&x.agent===agent;})[0]||null;
  var payMethod=formVal('payMethod'),note=formVal('note');
  var polId=formVal('polId')||'',polText=(formVal('polText')||'').trim();
  if(polId==='__custom__')polId='';   /* 手动填写的一次性政策只留文字说明 */
  if(OF.oldNo){markDel(db.orders.filter(function(x){return x.no===OF.oldNo;}).map(function(x){return x.id;}));db.orders=db.orders.filter(function(x){return x.no!==OF.oldNo;});}
  /* 订单号改了：工作纪要跟着改挂到新订单号，避免变成孤儿记录 */
  if(OF.oldNo&&OF.oldNo!==no)db.wnotes.forEach(function(w){if(String(w.no)===String(OF.oldNo)){w.no=no;touch(w);}});
  items.forEach(function(it){
    var p=findProd(it.pid);
    db.orders.push({id:uid(),no:no,cat:cat,agentId:cust?cust.id:'',agentName:agent||custName,custName:custName,
      shipDate:shipDate,pid:it.pid,prodLabel:prodLabel(p),batchNo:it.batchNo||'',qtyBoxes:0,qtyUnits:Number(it.qty)||0,
      basePrice:Number(it.basePrice)||0,supplyPrice:Number(it.supplyPrice)||0,invoicePrice:Number(it.invoicePrice)||0,
      amount:Number(it.amount)||0,rebate:Number(it.rebate)||0,rebateOn:!!it.rebateOn,rebatePer:Number(it.rebatePer)||0,
      tax:Number(it.tax)||0,refund:Number(it.refund)||0,gift:it.gift?1:0,payMethod:payMethod,note:note,
      polId:polId,polText:polText});
  });
  save();closeModal();render();
}
/* ---- 订单政策：发货日期在政策有效期内、客户/代理商匹配的政策自动列入下拉；
        没有现成政策的一次性政策，选「手动填写一次性政策」直接写说明 ---- */
function orderPolList(agent,custName,shipDate){
  return (db.prodPolicies||[]).filter(function(r){
    if(!policyActive(r,shipDate||today()))return false;
    var pc=String(r.custName||'').trim(),pa=String(r.agent||'').trim();
    if(pc&&pc!==String(custName||'').trim())return false;
    if(!pc&&pa&&pa!==String(agent||'').trim())return false;
    return true;
  });
}
function orderPolOptsHTML(keep){
  var list=orderPolList(formVal('agent'),formVal('custName'),formVal('shipDate'));
  var h='<option value="">无</option>';
  list.forEach(function(r){
    var w=policyWindow(r);
    h+='<option value="'+r.id+'"'+(keep===r.id?' selected':'')+'>'
      +esc(r.prodName+' · '+policyText(r)+(w.s?('（'+w.s+'~'+(w.e||'')+'）'):'')+' · '+policyExeMode(r))+'</option>';
  });
  h+='<option value="__custom__"'+(keep==='__custom__'?' selected':'')+'>手动填写一次性政策</option>';
  return h;
}
/* 选政策自动带出政策说明；选「手动填写」清空说明框方便输入 */
function orderPolSel(sel){
  var v=sel?sel.value:'',el=formEl('polText');
  if(!el)return;
  if(v&&v!=='__custom__'){
    var r=db.prodPolicies.filter(function(x){return x.id===v;})[0];
    if(r){var w=policyWindow(r);el.value=r.prodName+' '+policyText(r)+(w.s?('（'+w.s+'~'+(w.e||'')+'）'):'')+' · '+policyExeMode(r);}
  }else if(v==='__custom__'){el.value='';try{el.focus();}catch(e){}}
}
/* 客户 / 代理商 / 发货日期变化后重建政策下拉（保留已选项） */
function orderPolRefresh(){
  var sel=formEl('polId');if(!sel)return;
  var keep=formVal('polId')||((formVal('polText')||'').trim()?'__custom__':'');
  sel.innerHTML=orderPolOptsHTML(keep);
}
/* 订单表单：客户分类 → 代理商 → 客户名称 三级联动（数据来自客户档案，选项按首字母排序） */
function orderAgentOpts(cat,keep){
  var s=[];
  db.customers.forEach(function(c){if(c.cat===cat&&c.agent&&s.indexOf(c.agent)<0)s.push(c.agent);});
  if(!s.length){ // 该分类下客户档案未登记代理商时，退回显示该分类的客户名称
    db.customers.forEach(function(c){if(c.cat===cat&&s.indexOf(c.company)<0)s.push(c.company);});
  }
  s=pySortArr(s);
  if(keep&&s.indexOf(keep)<0)s.unshift(keep);
  return s;
}
function orderAgentOptsHTML(cat,keep){
  var opts=orderAgentOpts(cat,keep),h='<option value="">请选择</option>';
  for(var i=0;i<opts.length;i++)h+='<option value="'+esc(opts[i])+'"'+(keep===opts[i]?' selected':'')+'>'+esc(opts[i])+'</option>';
  return h;
}
function orderCustList(cat,agent){
  var same=db.customers.filter(function(c){return c.cat===cat;});
  if(agent){var f=same.filter(function(c){return c.agent===agent;});if(f.length)same=f;}
  return pySortArr(same.map(function(c){return c.company;}));
}
function orderCatSel(sel){
  var cat=sel?sel.value:'';
  var ael=document.querySelector('[data-k="agent"]');
  if(ael)ael.innerHTML=orderAgentOptsHTML(cat,'');
  orderFillCust(cat,'');
  orderRefreshItemProds();
  orderPolRefresh();
}
function orderAgentSel(sel){
  var cel=document.querySelector('[data-k="cat"]');
  OF.agent=sel?sel.value:'';
  orderFillCust(cel?cel.value:'',sel?sel.value:'');
  orderRefreshItemProds();
  orderPolRefresh();
}
function orderFillCust(cat,agent){
  var list=orderCustList(cat,agent);
  var dl=document.getElementById('dl_custName');
  if(dl)dl.innerHTML=list.map(function(x){return '<option value="'+esc(x)+'">';}).join('');
  var el=document.querySelector('[data-k="custName"]');
  if(el&&list.length){
    if(list.indexOf(el.value)<0)el.value=(list.length===1?list[0]:'');
  }
}
/* ---- 产品明细项（可添加多个产品） ---- */
function orderRenderItems(){
  var box=document.getElementById('ofItems');if(!box)return;
  var h='';
  for(var i=0;i<OF.items.length;i++)h+=orderItemHTML(i);
  box.innerHTML=h;
  for(var j=0;j<OF.items.length;j++)orderShowStock(j);
}
/* 下单产品下拉数据源：按分类过滤；OEM 再按该订单的代理商过滤（按产品名称首字排序） */
function orderProdsFor(it){
  var all=db.products.filter(function(p){return !it.prodCat||p.cat===it.prodCat;});
  var res={list:all,agent:'',filtered:false,fallback:false};
  if(it.prodCat==='OEM'){
    var agEl=document.querySelector('[data-k="agent"]');
    var ag=String((agEl?agEl.value:'')||OF.agent||'').trim();res.agent=ag;
    if(ag){
      var m=all.filter(function(p){return String(p.agent||'').trim()===ag;});
      if(!m.length)m=all.filter(function(p){return String(p.agent||'').trim().indexOf(ag)>=0;});
      if(m.length){res.list=m;res.filtered=true;}else{res.fallback=true;}
    }
  }
  res.list=res.list.slice().sort(function(a,b){return pyCmp((a.name||'')+(a.spec||''),(b.name||'')+(b.spec||''));});
  return res;
}
function orderProdOptsHTML(it,src){
  var h='<option value="">选择产品</option>',found=false;
  for(var j=0;j<src.list.length;j++){var p=src.list[j];if(it.pid===p.id)found=true;
    h+='<option value="'+esc(p.id)+'"'+(it.pid===p.id?' selected':'')+'>'+esc(p.name+(p.spec?('　'+p.spec):''))+'</option>';}
  if(it.pid&&!found){var cp=findProd(it.pid);
    if(cp)h+='<option value="'+esc(cp.id)+'" selected>'+esc(cp.name+(cp.spec?('　'+cp.spec):''))+'（不在当前筛选内）</option>';}
  return h;
}
/* 代理商变化后只重建产品下拉，不重绘整行（避免输入框失焦） */
function orderRefreshItemProds(){
  if(!OF||!OF.items)return;
  for(var i=0;i<OF.items.length;i++){
    var it=OF.items[i];
    var sel=document.querySelector('.pay-item[data-i="'+i+'"] [data-f="prod"]');
    if(!sel)continue;
    sel.innerHTML=orderProdOptsHTML(it,orderProdsFor(it));
  }
}

    +'<div class="fitem"><label>数量（盒）<b>*</b></label><input type="number" step="any" data-f="qty" value="'+esc(it.qty||'')+'" oninput="orderItemCalc('+i+')"><div class="hint" data-f="stockHint"></div></div>'
    +'<div class="fitem"><label>底价（元/盒）</label><input type="number" step="any" data-f="basePrice" value="'+esc(it.basePrice||'')+'" oninput="orderItemCalc('+i+')"></div>'
    +'<div class="fitem"><label>供货价（元/盒）</label><input type="number" step="any" data-f="supplyPrice" value="'+esc(it.supplyPrice||'')+'" oninput="orderItemCalc('+i+')"></div>'
    +'<div class="fitem"><label>开票价（元/盒）</label><input type="number" step="any" data-f="invoicePrice" value="'+esc(it.invoicePrice||'')+'" oninput="orderItemCalc('+i+')"></div>'
    +'<div class="fitem"><label>金额</label><input data-f="amount" value="'+esc(it.amount||'')+'"'+(it.gift?' oninput="orderItemAmtInput('+i+')"':' readonly')+'></div>';
  if(!it.gift){
    h+='<div class="fitem"><label>税金（元）</label><input type="number" step="any" data-f="tax" value="'+esc(it.tax||'')+'" oninput="orderItemTaxInput('+i+')"></div>'
      +'<div class="fitem"><label>返款金额（元）</label><input type="number" step="any" data-f="refund" value="'+esc(it.refund||'')+'" oninput="orderItemRefundInput('+i+')"></div>'
      +'<div class="fitem full"><label>返利</label><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">'
      +'<label style="display:flex;gap:6px;align-items:center;font-weight:400"><input type="checkbox" style="width:16px;height:16px" onchange="orderItemRebate('+i+',this)"'+(it.rebateOn?' checked':'')+'>勾选计算返利</label>'
      +'<span data-f="rebatePerBox" style="display:'+(it.rebateOn?'inline-flex':'none')+';gap:6px;align-items:center">每盒返利 <input type="number" step="any" data-f="rebatePer" style="width:90px" value="'+esc(it.rebatePer||'')+'" oninput="orderItemCalc('+i+')"></span>'
      +'<span style="display:inline-flex;gap:6px;align-items:center">返利金额 <input type="number" step="any" data-f="rebate" style="width:110px" value="'+esc(it.rebate||'')+'" readonly></span>'
      +(OF.items.length>1?'<button type="button" class="btn sm dgr" onclick="orderDelItem('+i+')">删除</button>':'')
      +'</div></div>';
  }else{
    h+='<div class="fitem full"><div style="display:flex;justify-content:flex-end">'
