/* 导入 Excel */
function importProdoExcel(input){
  var f=input.files&&input.files[0];if(!f)return;
  if(!window.XLSX){whenXLSX(function(){importProdoExcel(input);});return;}
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var wb=XLSX.read(new Uint8Array(rd.result),{type:'array'});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var json=XLSX.utils.sheet_to_json(ws,{header:1,raw:false});
      var headRow=-1,headMap={};
      for(var i=0;i<json.length;i++){
        var row=json[i];if(!row||!row.length)continue;
        if(row.join(',').indexOf('产品分类')>=0||row.join(',').indexOf('订单日期')>=0){headRow=i;break;}
      }
      if(headRow<0){alert('未识别到表头，请先点击"模板"下载模板按格式填写');return;}
      var map={'客户分类':'custCat','代理商':'agent','客户名称':'custName','订单日期':'date','产品分类':'cat','产品名称':'name','规格':'spec','订单数量':'qty','订单数量（件）':'qty','订单数量(件)':'qty','订单金额':'amount','预付款金额':'prepaid','订单进展':'status','工序':'process','出货时间':'shipDate'};
      var head=json[headRow];
      for(var j=0;j<head.length;j++){
        var hc=String(head[j]==null?'':head[j]).trim();
        if(map[hc])headMap[j]=map[hc];
      }
      var added=0,skip=0,skipMsg=[];
      for(var k=headRow+1;k<json.length;k++){
        var rr=json[k];if(!rr)continue;
        var rec={id:uid(),no:newProdoNo()},any=false;
        for(var c in headMap){
          rec[headMap[c]]=String(rr[c]==null?'':rr[c]).trim();
          if(rec[headMap[c]])any=true;
        }
        if(!any)continue;
        if(isTplExample(rec)){skip++;if(typeof skipMsg!=='undefined')skipMsg.push('模板示例行（'+String(rec.name||rec.custName||rec.company||rec.prodName||rec.agent||rec.agentName||'')+'…）已自动跳过');continue;}
        rec.cat=(rec.cat==='oem'||rec.cat==='Oem')?'OEM':rec.cat;
        rec.qty=parseFloat(rec.qty)||0;
        rec.amount=parseFloat(rec.amount)||0;
        rec.prepaid=parseFloat(rec.prepaid)||0;
        rec.date=normDate(rec.date);
        rec.shipDate=normDate(rec.shipDate);
        if(rec.cat!=='自销'&&rec.cat!=='OEM'){skip++;skipMsg.push('第'+(k+1)+'行：产品分类需为 自销 或 OEM');continue;}
        if(!rec.date||!/^\d{4}-\d{2}-\d{2}$/.test(rec.date)){skip++;skipMsg.push('第'+(k+1)+'行：订单日期缺失或格式不对');continue;}
        if(!rec.name){skip++;skipMsg.push('第'+(k+1)+'行：产品名称缺失');continue;}
        if(!rec.spec){skip++;skipMsg.push('第'+(k+1)+'行：规格缺失');continue;}
        if(!(rec.qty>0)){skip++;skipMsg.push('第'+(k+1)+'行：订单数量需大于0');continue;}
        if(PRODO_STATUS.indexOf(rec.status)<0)rec.status='未投产';
        if(rec.status!=='已投产')rec.process='';
        if(!rec.shipDate&&rec.status==='已出货')rec.shipDate=today();
        if(rec.cat==='自销'){rec.agent='';rec.custName='';rec.amount=0;rec.prepaid=0;}
        if(rec.cat==='OEM'&&!(rec.amount>0)){skip++;skipMsg.push('第'+(k+1)+'行：OEM订单需填写订单金额');continue;}
        db.prodOrders.push(rec);added++;
      }
      save();
      if(input)input.value='';
      alert(added?('成功导入 '+added+' 条订单'+(skip?('，跳过 '+skip+' 条：\n'+skipMsg.slice(0,5).join('\n')):'')):('未导入数据。\n'+(skipMsg.length?skipMsg.slice(0,5).join('\n'):'请检查表格内容')));
      render();
    }catch(e){console.log('导入失败',e);alert('导入失败：'+e.message);}
  };
  rd.readAsArrayBuffer(f);
}

/* 导入新品开发 Excel */
function importDevExcel(input){
  var f=input.files&&input.files[0];if(!f)return;
  if(!window.XLSX){whenXLSX(function(){importDevExcel(input);});return;}
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var wb=XLSX.read(new Uint8Array(rd.result),{type:'array'});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var json=XLSX.utils.sheet_to_json(ws,{header:1,raw:false});
      var headRow=-1,headMap={};
      for(var i=0;i<json.length;i++){
        var row=json[i];if(!row||!row.length)continue;
        if(row.join(',').indexOf('产品名称')>=0||row.join(',').indexOf('预选规格')>=0){headRow=i;break;}
      }
      if(headRow<0){alert('未识别到表头，请先点击"模板"下载模板按格式填写');return;}
      var map={'客户分类':'cat','代理商':'agent','客户名称':'custName','产品分类':'prodCat','产品名称':'name','预选规格':'preSpec','报价':'quote','包装设计':'packDesign','包材工艺':'packCraft','打样':'sample','合同':'contract','包材是否到货':'packArrived','申请样盒':'sampleBox','产品资料':'prodData','备注':'note'};
      var head=json[headRow];
      for(var j=0;j<head.length;j++){
        var hc=String(head[j]==null?'':head[j]).trim();
        if(map[hc])headMap[j]=map[hc];
      }
      function normStage(v){v=String(v||'').trim();return DEV_STAGES.indexOf(v)>=0?v:'未开始';}
      var added=0,skip=0,skipMsg=[];
      for(var k=headRow+1;k<json.length;k++){
        var rr=json[k];if(!rr)continue;
        var rec={id:uid(),done:false},any=false;
        for(var c in headMap){
          var v=String(rr[c]==null?'':rr[c]).trim();
          rec[headMap[c]]=v;if(v)any=true;
        }
        if(!any)continue;
        if(isTplExample(rec)){skip++;if(typeof skipMsg!=='undefined')skipMsg.push('模板示例行（'+String(rec.name||rec.custName||rec.company||rec.prodName||rec.agent||rec.agentName||'')+'…）已自动跳过');continue;}
        if(rec.cat!=='省总'&&rec.cat!=='大包商'&&rec.cat!=='零散客户'){skip++;skipMsg.push('第'+(k+1)+'行：客户分类需为 省总/大包商/零散客户');continue;}
        if(!rec.custName){skip++;skipMsg.push('第'+(k+1)+'行：客户名称缺失');continue;}
        if(!rec.name){skip++;skipMsg.push('第'+(k+1)+'行：产品名称缺失');continue;}
        rec.quote=parseFloat(rec.quote)||0;
        rec.date=normDate(rec.date)||today();
        rec.packDesign=normStage(rec.packDesign);rec.packCraft=normStage(rec.packCraft);
        rec.sample=normStage(rec.sample);rec.contract=normStage(rec.contract);
        rec.sampleBox=normStage(rec.sampleBox);rec.prodData=normStage(rec.prodData);
        rec.packArrived=(rec.packArrived==='是')?'是':'否';
        db.develop.push(rec);added++;
      }
      save();
      if(input)input.value='';
      alert(added?('成功导入 '+added+' 条新品项目'+(skip?('，跳过 '+skip+' 条：\n'+skipMsg.slice(0,5).join('\n')):'')):('未导入数据。\n'+(skipMsg.length?skipMsg.slice(0,5).join('\n'):'请检查表格内容')));
      render();
    }catch(e){console.log('导入失败',e);alert('导入失败：'+e.message);}
  };
  rd.readAsArrayBuffer(f);
}

function clearAllData(){
  if(!confirm('确定清空全部数据？此操作不可恢复（云端数据也会被覆盖为空）。建议先备份！'))return;
  var oldDel=db.del||{},gone=[];
  DB_TABLES.forEach(function(k){(db[k]||[]).forEach(function(r){if(r&&r.id)gone.push(r.id);});});
  db=ensureStruct({customers:[],products:[],batches:[],orders:[],shipments:[],payments:[],logs:[],prodOrders:[],develop:[],prodPolicies:[],seq:1});
  db.del=oldDel;markDel(gone);
  save();render();
}
/* 仅清空销售与库存台账，保留基础档案（客户/产品/生产订单/新品开发/工作记录/待办） */
function clearSalesStockData(){
  var n=db.orders.length+db.shipments.length+db.payments.length+db.batches.length+(db.wnotes||[]).length;
  if(!n){alert('当前没有销售与库存数据，无需清理。');return;}
  var msg='确定清空以下销售与库存数据？共 '+n+' 条，此操作不可恢复（云端数据也会被覆盖）：\n\n'
    +'· 销售订单 '+db.orders.length+' 条\n'
    +'· 物流发货 '+db.shipments.length+' 条\n'
    +'· 回款明细 '+db.payments.length+' 条\n'
    +'· 库存批次 '+db.batches.length+' 条\n'
    +'· 工作纪要 '+(db.wnotes||[]).length+' 条\n\n'
    +'将保留：客户档案、产品档案、产品政策、生产订单、新品开发、工作记录、待办。\n建议先到「数据备份」导出一份留底！';
  if(!confirm(msg))return;
  var gone=[];
  ['orders','shipments','payments','batches','wnotes'].forEach(function(k){(db[k]||[]).forEach(function(r){if(r&&r.id)gone.push(r.id);});});
  markDel(gone);
  db.orders=[];db.shipments=[];db.payments=[];db.batches=[];db.wnotes=[];
  WAVE_CACHE={};
  save();render();
  alert('已清空销售与库存数据。\n\n接下来：\n1. 到「销售库存」录入现有实际库存（批次）；\n2. 从 9 月 1 日起正常记录订单、发货与回款。');
}
