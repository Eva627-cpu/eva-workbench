function orderItemCatSel(i,sel){
  var it=OF.items[i];if(!it)return;
  if(it.pid)orderGiftDrop(it.pid);
  it.prodCat=sel.value;it.pid='';it.batchNo='';
  orderRenderItems();
}
/* 批号下拉选项：来自该产品当前有库存的批次（近效期在前），编辑时保留原批号 */
function orderBatchOpts(pid,keep){
  var p=findProd(pid),per=prodPerBox(p);
  var bs=db.batches.filter(function(b){return b.pid===pid;})
    .filter(function(b){return (Number(b.boxes)||0)*per+(Number(b.units)||0)>0;});
  bs.sort(function(a,b){if(a.expire<b.expire)return -1;if(a.expire>b.expire)return 1;return String(a.batchNo||'')<String(b.batchNo||'')?-1:1;});
  var h='<option value="">选择批号</option>',found=false;
  for(var i=0;i<bs.length;i++){var b=bs[i],u=(Number(b.boxes)||0)*per+(Number(b.units)||0);
    if(keep&&keep===b.batchNo)found=true;
    h+='<option value="'+esc(b.batchNo)+'"'+(keep===b.batchNo?' selected':'')+'>'
      +esc(b.batchNo+'（库存'+u+'盒，效期'+(b.expire||'—')+'）')+'</option>';}
  if(keep&&!found)h='<option value="'+esc(keep)+'" selected>'+esc(keep+'（当前无库存）')+'</option>'+h;
  return h;
}
function orderItemBatchSel(i,sel){var it=OF.items[i];if(!it)return;it.batchNo=sel?sel.value:'';}
function orderItemSel(i,sel){
  var it=OF.items[i];if(!it)return;
  it.pid=sel.value;
  it.batchNo='';
  var p=findProd(sel.value);
  if(p){
    it.basePrice=p.basePrice||'';it.supplyPrice=p.supplyPrice||'';it.invoicePrice=p.invoicePrice||'';
    itSet(i,'basePrice',it.basePrice||'');itSet(i,'supplyPrice',it.supplyPrice||'');itSet(i,'invoicePrice',it.invoicePrice||'');
  }
  var bSel=document.querySelector('.pay-item[data-i="'+i+'"] [data-f="batchNo"]');
  if(bSel)bSel.innerHTML=orderBatchOpts(it.pid,it.batchNo);
  orderShowStock(i);
  orderItemCalc(i);
}
function orderShowStock(i){
  var it=OF.items[i];if(!it)return;
  var hintEl=document.querySelector('.pay-item[data-i="'+i+'"] [data-f="stockHint"]');
  if(hintEl)hintEl.textContent=it.pid?('当前库存：'+stockText(it.pid)):'';
}
function orderItemCalc(i){
  var it=OF.items[i];if(!it)return;
  it.qty=parseFloat(itF(i,'qty'))||0;
  it.basePrice=parseFloat(itF(i,'basePrice'))||0;
  it.supplyPrice=parseFloat(itF(i,'supplyPrice'))||0;
  it.invoicePrice=parseFloat(itF(i,'invoicePrice'))||0;
  if(it.gift){
    if(!it.amountManual)it.amount=0;
    it.tax=0;it.refund=0;it.rebate=0;
    itSet(i,'amount',it.amount||0);
    orderShowStock(i);
    return;
  }
  it.amount=r2(it.invoicePrice*it.qty);
  if(!it.taxManual)it.tax=payTaxCalc(it.invoicePrice,it.supplyPrice,it.qty);
  if(!it.refundManual)it.refund=r2((it.invoicePrice-it.supplyPrice)*it.qty-it.tax);
  it.rebatePer=parseFloat(itF(i,'rebatePer'))||0;
  it.rebate=it.rebateOn?r2(it.rebatePer*it.qty):0;

/* ====== 产品政策联动：数量达到赠货政策时自动加赠品行（金额 0 元，可手动修改） ====== */
function policyMatchFor(pid,agent,custName,date){
  var p=findProd(pid);if(!p)return null;
  var name=String(p.name||'').trim(),spec=String(p.spec||'').trim();
  agent=String(agent||'').trim();custName=String(custName||'').trim();
  var best=null,rank=-1;
  (db.prodPolicies||[]).forEach(function(pol){
    if(!policyActive(pol,date||today()))return;   /* 只匹配政策有效期内的（下单日不在有效期内不享受） */
    if(String(pol.prodName||'').trim()!==name)return;
    var ps=String(pol.spec||'').trim();
    if(ps&&ps!==spec)return;
    var pc=String(pol.custName||'').trim(),pa=String(pol.agent||'').trim(),r=-1;
    if(pc){
      if(pc!==custName&&custName.indexOf(pc)<0&&pc.indexOf(custName)<0)return;
      r=2;
    }else if(!pa){r=0;}
    else if(pa===agent||agent.indexOf(pa)>=0||pa.indexOf(agent)>=0){r=1;}
    else{return;}
    if(r>rank){rank=r;best=pol;}
  });
  return best;
}
function orderGiftIdx(pid){
  for(var i=0;i<OF.items.length;i++){if(OF.items[i].gift&&OF.items[i].pid===pid)return i;}
  return -1;
}
function orderGiftDrop(pid){
  for(var i=OF.items.length-1;i>=0;i--){if(OF.items[i].gift&&OF.items[i].pid===pid)OF.items.splice(i,1);}
}
var _giftT=null,_giftI=-1;
function orderGiftSoon(i){
  _giftI=i;
  if(_giftT)clearTimeout(_giftT);
  _giftT=setTimeout(function(){_giftT=null;var k=_giftI;if(k>=0&&OF.items[k]&&!OF.items[k].gift)orderGiftCheck(k);},600);
}
function orderGiftCheck(i){
  var it=OF.items[i];if(!it||!it.pid||it.gift)return;
  var pol=policyMatchFor(it.pid,formVal('agent'),formVal('custName'),formVal('shipDate'));
  if(!pol||policyType(pol)!=='赠货')return;
  var b=Number(pol.giftBuy)||0,g=Number(pol.giftGet)||0,qty=Number(it.qty)||0;
  if(!b||!g)return;
  var giftQty=qty>=b?Math.floor(qty/b)*g:0;
  var gi=orderGiftIdx(it.pid);
  if(gi>=0){
    var git=OF.items[gi];
    if(giftQty>0&&Number(git.qty)!==giftQty){git.qty=giftQty;itSet(gi,'qty',giftQty);}
    return;
  }
  if(giftQty<=0)return;
  OF.giftAsked=OF.giftAsked||{};
  if(OF.giftAsked[it.pid]===giftQty)return;
  var p=findProd(it.pid)||{};
  if(!confirm('「'+(p.name||'')+'」符合赠货政策：买 '+b+' 赠 '+g+'，赠品 '+giftQty+' 件，金额 0 元（可手动修改）。\n自动添加赠品？'))return;
  OF.giftAsked[it.pid]=giftQty;
  var gift=orderNewItem();
  gift.pid=it.pid;gift.prodCat=it.prodCat;gift.batchNo=it.batchNo;gift.qty=giftQty;
  gift.basePrice=it.basePrice;gift.supplyPrice=it.supplyPrice;gift.invoicePrice=it.invoicePrice;
  gift.amount=0;gift.gift=true;
  OF.items.splice(i+1,0,gift);
  orderRenderItems();
}

function orderItemTaxInput(i){

function orderDelItem(i){
  var it=OF.items[i];if(!it)return;
  var rm=[i];
  if(!it.gift)for(var k=OF.items.length-1;k>=0;k--){if(OF.items[k].gift&&OF.items[k].pid===it.pid)rm.push(k);}

function delOrder(id){  var o=db.orders.filter(function(x){return x.id===id;})[0];if(!o)return;
  var others=db.orders.filter(function(x){return x.no===o.no&&x.id!==id;}).length;
  var sh=db.shipments.filter(function(s){return s.orderNo===o.no;}).length;

  var wn=db.wnotes.filter(function(x){return String(x.no)===String(o.no);}).length;
  var msg=others>0?('该订单号下还有 '+others+' 条其他产品行，本次仅删除这一行「'+(o.prodLabel||'')+'」。确定？')
    :('删除订单 '+o.no+' 将同时删除其 '+sh+' 条发货、'+py+' 条回款记录'+(wn?('、'+wn+' 条工作纪要'):'')+'（库存不受影响）。确定？');
  if(!confirm(msg))return;
  var gone=[id];

    gone=gone.concat(db.shipments.filter(function(x){return x.orderNo===o.no;}).map(function(x){return x.id;}))
               .concat(db.payments.filter(function(x){return x.orderNo===o.no||x.shipNo===o.no;}).map(function(x){return x.id;}))
               .concat(db.wnotes.filter(function(x){return String(x.no)===String(o.no);}).map(function(x){return x.id;}));
  }
  markDel(gone);
  db.orders=db.orders.filter(function(x){return x.id!==id;});
  if(!others){
    db.shipments=db.shipments.filter(function(x){return x.orderNo!==o.no;});
    db.payments=db.payments.filter(function(x){return x.orderNo!==o.no&&x.shipNo!==o.no;});
    db.wnotes=db.wnotes.filter(function(x){return String(x.no)!==String(o.no);});

/* 销售订单导入 Excel */
function importOrderExcel(input){
  var f=input.files&&input.files[0];if(!f)return;
  if(!window.XLSX){whenXLSX(function(){importOrderExcel(input);});return;}
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var wb=XLSX.read(new Uint8Array(rd.result),{type:'array'});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var json=XLSX.utils.sheet_to_json(ws,{header:1});
      var headRow=-1,headMap={};
      for(var i=0;i<json.length;i++){
        var row=json[i];if(!row||!row.length)continue;
        if(row.join(',').indexOf('代理商')>=0||row.join(',').indexOf('产品名称')>=0){headRow=i;break;}
      }
      if(headRow<0){alert('未识别到表头，请先点击"模板"下载模板按格式填写');return;}
      var map={'发货单号':'orderNo','代理商':'agentName','客户名称':'custName','发货日期':'shipDate','产品分类':'pcat','产品名称':'name','规格':'spec','批号':'batchNo',
        '数量（件）':'qtyBoxes','数量（盒）':'qtyUnits','底价':'basePrice','供货价':'supplyPrice','开票价':'invoicePrice','总金额':'amount','金额':'amount',
        '返利':'rebate','税金':'tax','返款':'refund','付款方式':'payMethod','备注':'note'};
      var head=json[headRow];
      for(var j=0;j<head.length;j++){
        var hc=String(head[j]==null?'':head[j]).trim();
        if(map[hc])headMap[j]=map[hc];
      }
      var NUM=['qtyBoxes','qtyUnits','basePrice','supplyPrice','invoicePrice','amount','rebate','tax','refund'];
      var added=0,healed=0,skip=0,histN=0,skipMsg=[],shortMsg={};
      for(var k=headRow+1;k<json.length;k++){
        var rr=json[k];if(!rr)continue;
        var rec={},any=false;
        for(var c in headMap){
          var v=String(rr[c]==null?'':rr[c]).trim();
          rec[headMap[c]]=v;
          if(v)any=true;
        }
        if(!any)continue;
        if(isTplExample(rec)){skip++;if(typeof skipMsg!=='undefined')skipMsg.push('模板示例行（'+String(rec.name||rec.custName||rec.company||rec.prodName||rec.agent||rec.agentName||'')+'…）已自动跳过');continue;}
        for(var n=0;n<NUM.length;n++){var kk=NUM[n];rec[kk]=parseFloat(rec[kk])||0;}
        if(!rec.agentName){skip++;skipMsg.push('第'+(k+1)+'行：代理商缺失');continue;}
        if(!rec.name){skip++;skipMsg.push('第'+(k+1)+'行：产品名称缺失');continue;}
        rec.shipDate=xlDate(rec.shipDate)||rec.shipDate;   /* 发货日期若是 Excel 日期序列号，先归一 */
        if(!rec.shipDate){skip++;skipMsg.push('第'+(k+1)+'行：发货日期缺失');continue;}
        var pl=db.products.filter(function(x){return x.name===rec.name&&(!rec.spec||x.spec===rec.spec);});
        if(rec.pcat){var byCat=pl.filter(function(x){return x.cat===rec.pcat;});if(byCat.length)pl=byCat;}
        var p=pl[0];
        if(!p){skip++;skipMsg.push('第'+(k+1)+'行：产品档案中未找到「'+rec.name+(rec.spec?' '+rec.spec:'')+'」，请先在产品档案中新增');continue;}
        var per=prodPerBox(p);
        var need=(Number(rec.qtyBoxes)||0)*per+(Number(rec.qtyUnits)||0);
        /* 数量为负 = 退货入库（自动恢复库存），为正 = 发货出库 */
        if(!need){skip++;skipMsg.push('第'+(k+1)+'行：数量（盒）缺失');continue;}
        if(!rec.amount)rec.amount=Math.round(need*((Number(rec.invoicePrice)>0?Number(rec.invoicePrice):Number(rec.supplyPrice))||0)*100)/100;
        if(!rec.invoicePrice&&rec.amount&&need)rec.invoicePrice=r2(rec.amount/need);
        var cust=db.customers.filter(function(x){return x.company===rec.agentName;})[0]
          ||db.customers.filter(function(x){return x.agent===rec.agentName;})[0]
          ||null;
        var no=String(rec.orderNo||'').trim()||newOrderNo();
        var dup=db.orders.filter(function(x){return x.no===no&&x.pid===p.id&&x.batchNo===(rec.batchNo||'')&&x.qtyUnits===(Number(rec.qtyUnits)||0);})[0];
        if(dup){
          /* 已导入过：若该明细尚未生成物流明细，自动补生成并扣减/恢复库存（用于旧版模板导入后的补齐） */
          var sh=db.shipments.filter(function(x){return x.orderNo===dup.no&&x.pid===dup.pid&&x.batchNo===(rec.batchNo||'')&&Number(x.totalUnits)===need;})[0];
          if(!sh){var shrt=autoShipImported(dup.no,p,rec.batchNo,need,rec.shipDate);if(shrt>0)shortMsg[prodLabel(p)]=1;healed++;if(normDate(rec.shipDate)<STOCK_CUTOFF)histN++;}
          else skip++;
          continue;
        }
        db.orders.push({id:uid(),no:no,agentId:cust?cust.id:'',agentName:rec.agentName,custName:rec.custName||rec.agentName,cat:cust?cust.cat:'',
          shipDate:rec.shipDate,pid:p.id,prodLabel:prodLabel(p),batchNo:rec.batchNo||'',qtyBoxes:Number(rec.qtyBoxes)||0,qtyUnits:Number(rec.qtyUnits)||0,
          basePrice:Number(rec.basePrice)||0,supplyPrice:Number(rec.supplyPrice)||0,invoicePrice:Number(rec.invoicePrice)||0,amount:Number(rec.amount)||0,
          rebate:Number(rec.rebate)||0,tax:Number(rec.tax)||0,refund:Number(rec.refund)||0,
          payMethod:rec.payMethod||'现款',note:rec.note||''});
        var shrt2=autoShipImported(no,p,rec.batchNo,need,rec.shipDate);
        if(shrt2>0)shortMsg[prodLabel(p)]=1;
        if(normDate(rec.shipDate)<STOCK_CUTOFF)histN++;
        added++;
      }
      save();
      if(input)input.value='';
      var msg='';
      if(added)msg+='成功导入 '+added+' 条销售订单，已同步生成物流明细并扣减/恢复库存';
      if(healed)msg+=(msg?'\n':'')+'检测到 '+healed+' 条订单此前已导入但无物流明细，已自动补生成并扣减/恢复库存';
      if(histN)msg+=(msg?'\n':'')+'其中 '+histN+' 条发货日期早于 '+STOCK_CUTOFF+'，属历史补录：只生成物流明细，不扣减/恢复库存';
      if(skip)msg+=(msg?'\n':'')+'跳过 '+skip+' 条（重复或数据缺失）'+(skipMsg.length?('\n'+skipMsg.slice(0,5).join('\n')):'');
      var sk=Object.keys(shortMsg);
      if(sk.length)msg+='\n注意：以下产品库存不足，未能全额扣减：'+sk.join('、');
      if(!msg)msg='未导入数据。\n'+(skipMsg.length?skipMsg.slice(0,5).join('\n'):'请检查表格内容');
      alert(msg);
      render();
    }catch(e){console.log('导入失败',e);alert('导入失败：'+e.message);}
  };
  rd.readAsArrayBuffer(f);
}

    :{orderNo:preOrderNo||'',shipDate:today()};
  if(vals.orderNo){var _o=db.orders.filter(function(x){return x.no===vals.orderNo;})[0];if(_o)vals.prodLabel=_o.prodLabel;}
  openForm(id?'编辑发货':'新增发货（发货后自动扣减库存）',fields,vals,function(v){
    var o=db.orders.filter(function(x){return x.no===v.orderNo;})[0];
    if(!o){alert('未找到对应订单');return;}
    var per=prodPerBox(findProd(o.pid));
    var need=(Number(v.qtyBoxes)||0)*per+(Number(v.qtyUnits)||0);
    if(need<=0){alert('发货数量不能为0');return;}
    var hist=normDate(v.shipDate)<STOCK_CUTOFF;   /* 发货日期早于分界日：只记录发货，不扣库存 */
    var res={log:[],shortage:0};
    if(!hist){
      res=deductStock(o.pid,need);
      if(res.shortage>0){
        if(!confirm('库存不足！需发 '+need+' 盒，当前库存仅 '+(need-res.shortage)+' 盒。仍要按库存量发货？'))return;
        need=need-res.shortage;

    }
    if(id){
      var old=db.shipments.filter(function(x){return x.id===id;})[0];
      // 还原旧发货的库存
      restoreStock(old.deductLog||[]);
      markDel(id);
      db.shipments=db.shipments.filter(function(x){return x.id!==id;});
    }
    if(!hist)applyDeduct(res.log);
    var rec={id:uid(),orderNo:v.orderNo,shipDate:v.shipDate,pid:o.pid,prodLabel:o.prodLabel,
      qtyBoxes:v.qtyBoxes,qtyUnits:v.qtyUnits,totalUnits:(Number(v.qtyBoxes)||0)*per+(Number(v.qtyUnits)||0),
      logistics:v.logistics,tracking:v.tracking,photo:v.photo,deductLog:hist?[]:res.log};
    db.shipments.push(rec);
    save();closeModal();render();
    if(hist)alert('发货日期早于 '+STOCK_CUTOFF+'，属历史补录：只生成发货记录，不扣减库存。');
  });
}

/* 批次件装量：跟随产品档案规格解析 */
function batchPer(b){var p=findProd(b.pid);return p?prodPerBox(p):(Number(b.perBox)||1);}
/* 按效期先出（FIFO）扣减库存 */
function deductStock(pid,units){
  var log=[],need=units;
  var bs=db.batches.filter(function(b){return b.pid===pid;}).sort(function(a,b){return a.expire<b.expire?-1:(a.expire>b.expire?1:(a.batchNo<b.batchNo?-1:1));});
  for(var i=0;i<bs.length&&need>0;i++){
    var b=bs[i],per=batchPer(b),have=b.boxes*per+b.units;
    if(have<=0)continue;
    var take=Math.min(have,need);
    log.push({bid:b.id,units:take,pid:b.pid,batchNo:b.batchNo||'',expire:b.expire||''});
    need-=take;
  }
  return {log:log,shortage:need};
}
function applyDeduct(log){
  for(var i=0;i<log.length;i++){
    var b=db.batches.filter(function(x){return x.id===log[i].bid;})[0];if(!b)continue;
    var per=batchPer(b),t=log[i].units;
    var newTotal=Math.max(0,b.boxes*per+b.units-t);
    b.boxes=Math.floor(newTotal/per);
    b.units=newTotal%per;
    touch(b);
  }
}
function restoreStock(log){
  for(var i=0;i<log.length;i++){
    var b=db.batches.filter(function(x){return x.id===log[i].bid;})[0];
    /* 清0批次可能已被自动清除：按日志中的批号信息重建，确保冲回不丢库存 */
    if(!b&&log[i].pid){
      b={id:uid(),pid:log[i].pid,batchNo:log[i].batchNo||'',boxes:0,units:0,expire:log[i].expire||''};
      db.batches.push(b);
    }
    if(!b)continue;
    var per=batchPer(b),t=log[i].units;
    var newTotal=b.boxes*per+b.units+t;
    b.boxes=Math.floor(newTotal/per);
    b.units=newTotal%per;
    touch(b);
  }
}
/* 按批号优先扣减库存：先扣指定批号，不足部分按效期先出（FIFO）兜底 */
function deductStockBatch(pid,batchNo,units){
  var bs=db.batches.filter(function(b){return b.pid===pid;}).sort(function(a,b){return a.expire<b.expire?-1:(a.expire>b.expire?1:(a.batchNo<b.batchNo?-1:1));});
  if(batchNo){
    bs=bs.slice().sort(function(a,b){
      var am=a.batchNo===batchNo?0:1,bm=b.batchNo===batchNo?0:1;
      if(am!==bm)return am-bm;
      return a.expire<b.expire?-1:(a.expire>b.expire?1:0);
    });
  }
  var log=[],need=units;
  for(var i=0;i<bs.length&&need>0;i++){
    var b=bs[i],per=batchPer(b),have=b.boxes*per+b.units;
    if(have<=0)continue;
    var take=Math.min(have,need);
    log.push({bid:b.id,units:take,pid:b.pid,batchNo:b.batchNo||'',expire:b.expire||''});
    need-=take;
  }
  return {log:log,shortage:need};
}
/* 退货入库：恢复到指定批号（批次不存在则新建），返回可回滚日志（删除物流记录时会自动冲回） */
function restoreStockBatch(pid,batchNo,units){
  var b=db.batches.filter(function(x){return x.pid===pid&&x.batchNo===(batchNo||'');})[0];
  if(!b){
    b={id:uid(),pid:pid,batchNo:batchNo||'',boxes:0,units:0,expire:''};
    db.batches.push(b);
  }
  var per=batchPer(b),t=b.boxes*per+b.units+units;
  b.boxes=Math.floor(t/per);
  b.units=t%per;
  touch(b);
  return [{bid:b.id,units:-units,pid:b.pid,batchNo:b.batchNo||'',expire:b.expire||''}];
}
/* 库存扣减分界：发货日期早于此日的销售订单属历史补录，只生成物流明细、不动当前库存 */
var STOCK_CUTOFF='2026-09-28';
/* 导入订单后自动生成物流明细：数量为正=发货出库（扣库存），为负=退货入库（恢复库存）；
   发货日期早于 STOCK_CUTOFF 的历史订单只生成物流明细，不扣减/恢复库存 */
function autoShipImported(no,p,batchNo,need,shipDate){
  var per=prodPerBox(p),dl=[],short=0;
  var hist=normDate(shipDate)<STOCK_CUTOFF;
  if(!hist){
    if(need>0){
      var res=deductStockBatch(p.id,batchNo,need);
      applyDeduct(res.log);dl=res.log;short=res.shortage;
    }else{
      dl=restoreStockBatch(p.id,batchNo,-need);
    }
  }
  db.shipments.push({id:uid(),orderNo:no,shipDate:shipDate,pid:p.id,prodLabel:prodLabel(p),batchNo:batchNo||'',
    qtyBoxes:need>0?Math.floor(need/per):0,qtyUnits:need>0?(need%per):need,totalUnits:need,
    logistics:need>0?'':'退货入库',tracking:'',photo:'',deductLog:dl});
  return short;
}

function importShipExcel(input){
  var f=input.files&&input.files[0];if(!f)return;
  if(!window.XLSX){whenXLSX(function(){importShipExcel(input);});return;}
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var wb=XLSX.read(new Uint8Array(rd.result),{type:'array'});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var json=XLSX.utils.sheet_to_json(ws,{header:1,raw:false});
      var headRow=-1,headMap={};
      for(var i=0;i<json.length;i++){
        var row=json[i];if(!row||!row.length)continue;
        if(row.join(',').indexOf('发货单号')>=0||row.join(',').indexOf('物流单号')>=0){headRow=i;break;}
      }
      if(headRow<0){alert('未识别到表头，请先点击"模板"下载模板按格式填写');return;}
      var map={'发货单号':'orderNo','发货日期':'shipDate','数量（件）':'qtyBoxes','数量(件)':'qtyBoxes','物流公司':'logistics','物流单号':'tracking'};
      var head=json[headRow];
      for(var j=0;j<head.length;j++){
        var hc=String(head[j]==null?'':head[j]).trim();
        if(map[hc])headMap[j]=map[hc];
      }
      var added=0,skip=0,skipMsg=[],histN=0;
      for(var k=headRow+1;k<json.length;k++){
        var rr=json[k];if(!rr)continue;
        var rec={};var any=false;
        for(var c in headMap){
          var v=String(rr[c]==null?'':rr[c]).trim();
          rec[headMap[c]]=v;if(v)any=true;
        }
        if(!any)continue;
        if(isTplExample(rec)){skip++;if(typeof skipMsg!=='undefined')skipMsg.push('模板示例行（'+String(rec.name||rec.custName||rec.company||rec.prodName||rec.agent||rec.agentName||'')+'…）已自动跳过');continue;}
        if(!rec.orderNo){skip++;skipMsg.push('第'+(k+1)+'行：发货单号缺失');continue;}
        var o=db.orders.filter(function(x){return x.no===rec.orderNo;})[0];
        if(!o){skip++;skipMsg.push('第'+(k+1)+'行：销售订单中不存在发货单号「'+rec.orderNo+'」，物流记录需关联销售订单');continue;}
        var existed=db.shipments.filter(function(s){return s.orderNo===rec.orderNo;})[0];
        if(existed){ // 已有记录：只更新物流信息
          if(rec.shipDate)existed.shipDate=normDate(rec.shipDate);
          if(rec.logistics)existed.logistics=rec.logistics;
          if(rec.tracking)existed.tracking=rec.tracking;
          added++;continue;
        }
        var per=prodPerBox(findProd(o.pid));
        var boxes=parseFloat(rec.qtyBoxes)||0;
        if(!(boxes>0)){skip++;skipMsg.push('第'+(k+1)+'行：数量（件）缺失');continue;}
        var need=boxes*per;
        var hist=normDate(rec.shipDate)<STOCK_CUTOFF;   /* 历史补录：只生成物流记录，不扣库存 */
        var log=[];
        if(!hist){
          var res=deductStock(o.pid,need);
          if(res.shortage>0){
            skip++;skipMsg.push('第'+(k+1)+'行：库存不足（需 '+need+' 盒），请先入库');continue;
          }
          applyDeduct(res.log);log=res.log;
        }else histN++;
        db.shipments.push({id:uid(),orderNo:o.no,shipDate:normDate(rec.shipDate)||today(),pid:o.pid,prodLabel:o.prodLabel,
          qtyBoxes:boxes,qtyUnits:0,totalUnits:need,logistics:rec.logistics||'',tracking:rec.tracking||'',photo:'',deductLog:log});
        added++;
      }
      save();
      if(input)input.value='';
      alert(added?('成功导入/更新 '+added+' 条物流记录'+(histN?('，其中 '+histN+' 条发货日期早于 '+STOCK_CUTOFF+' 属历史补录，不扣库存'):'')+(skip?('，跳过 '+skip+' 条：\n'+skipMsg.slice(0,5).join('\n')):'')):('未导入数据。\n'+(skipMsg.length?skipMsg.slice(0,5).join('\n'):'请检查表格内容')));
      render();
    }catch(e){console.log('导入失败',e);alert('导入失败：'+e.message);}
  };
  rd.readAsArrayBuffer(f);
}

/* ================= 销售订单 ↔ 回款明细 自动/手动匹配 =================
   业务规律：现款现货多为「前一天回款、第二天发货」（发货日 = 回款日 + 1），也有隔几天、
   或者先发货后回款的。因此只自动挂「能完全确定」的，其余留待手动匹配：
     ① 同客户、同代理商（某端为空则不比对），发货日在 [回款日 −15 天, 回款日 +6 天] 内；
     ② 窗口内只有一张订单 → 直接匹配；多张时若金额唯一相符 → 匹配；
        金额都与订单不符但有且仅有一张卡在 ±1 天内、次候选 ≥4 天（现款现货特征明显）→ 匹配但标「待核对」；
     ③ 金额与订单不一致的仍会挂上，但标为「待核对」，方便人工复核；
     ④ 手动匹配、手动解除过的回款带 matchLock，自动匹配不再改动它。
   匹配结果写进回款的 shipNo（与手工填单号同一字段），所以订单侧「已回款」状态、
   回款侧的「产品名称/规格」「发货状态」都会即时联动。 */
var MATCH_BACK=15,MATCH_FWD=6;
/* 日期串 → 天序号（可相减）；非法返回 null */
function dtNum(s){
  var m=String(s==null?'':s).match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(!m)return null;
  return Date.UTC(Number(m[1]),Number(m[2])-1,Number(m[3]))/86400000;
}
/* 该回款的候选订单（同客户 + 日期窗口 + 同代理商），按日期接近程度排序；
   anyDate=true 时不限日期窗口（手动匹配的兜底：列出该客户的全部订单） */
function payOrderCands(p,relax,anyDate){
  var cust=String((p&&p.custName)||'').trim(),agent=String((p&&p.agentName)||'').trim(),d=dtNum(p&&p.payDate);
  if(!cust)return [];
  if(!anyDate&&d==null)return [];
  _buildIdx();
  var list=_ordByCust[cust]||[],out=[];
  for(var i=0;i<list.length;i++){
    var a=_ordAgg[list[i]];if(!a)continue;
    var od=dtNum(a.date);
    var diff=(od==null||d==null)?null:(od-d);
    if(!anyDate){if(od==null)continue;if(diff<-MATCH_BACK||diff>MATCH_FWD)continue;}
    if(!relax&&agent&&a.agent&&a.agent!==agent)continue;
    out.push({no:a.no,diff:diff,date:a.date,amt:a.amt,agent:a.agent,cust:a.cust,names:a.names});
  }
  out.sort(function(x,y){
    var ax=x.diff==null?99999:Math.abs(x.diff),ay=y.diff==null?99999:Math.abs(y.diff);
    if(ax!==ay)return ax-ay;
    return String(x.no)<String(y.no)?-1:1;
  });
  return out;
}
/* 手动匹配兜底：同代理商、日期相近的订单（不限客户） */
function agentOrderCands(p){
  var agent=String((p&&p.agentName)||'').trim(),d=dtNum(p&&p.payDate);
  if(!agent)return [];
  _buildIdx();
  var list=_ordByAgent[agent]||[],out=[];
  for(var i=0;i<list.length;i++){
    var a=_ordAgg[list[i]];if(!a)continue;
    var od=dtNum(a.date),diff=(od==null||d==null)?null:(od-d);
    if(d!=null&&(diff<-MATCH_BACK||diff>MATCH_FWD))continue;
    out.push({no:a.no,diff:diff,date:a.date,amt:a.amt,agent:a.agent,cust:a.cust,names:a.names});
  }
  out.sort(function(x,y){
    var ax=x.diff==null?99999:Math.abs(x.diff),ay=y.diff==null?99999:Math.abs(y.diff);
    return ax-ay;
  });
  return out;
}
/* 未匹配回款池：手动匹配（订单 → 回款）用；cust=='' 表示不限客户 */
function unpaidPayPool(cust,agent,d){
  var out=[];
  for(var i=0;i<db.payments.length;i++){
    var p=db.payments[i];
    if(payNos(p).length)continue;
    if(cust&&String(p.custName||'').trim()!==cust)continue;
    if(!cust&&agent&&String(p.agentName||'').trim()&&String(p.agentName||'').trim()!==agent)continue;
    var pd=dtNum(p.payDate),diff=(pd==null||d==null)?null:(d-pd);
    out.push({p:p,diff:diff});
  }
  return out;
}
/* 回款金额与订单金额是否相符：true 相符 / false 不符 / null 订单没填金额（无从判断）
   口径：回款额 = 订单额；或 回款额 + 返利 = 订单额；或 回款额 + 返利 + 返款 = 订单额 */
function payAmtOk(p,c){
  var amt=Number(p&&p.amount)||0,a=Number(c&&c.amt)||0;
  if(!(a>0))return null;
  if(Math.abs(a-amt)<=0.01)return true;
  var rb=(Number(p&&p.rebate)||0)+(Number(p&&p.refund)||0);
  if(rb&&(Math.abs(a-(amt+Number(p.rebate||0)))<=0.01||Math.abs(a-(amt+rb))<=0.01))return true;
  return false;
}
function payAmtTag(ok){
  return ok===true?'<span class="tag ok">金额相符</span>':(ok===false?'<span class="tag warn">金额不符</span>':'<span class="tag pend">订单未填金额</span>');
}
/* 单条回款能否自动匹配：返回 null（没把握）/ {no:null,level:'multi'}（像一笔款付多张单，交人工）/ {no,level}
   level: exact 完全匹配 / near 现款现货特征 / soft 金额有差异（部分回款） */
function autoMatchOne(p){
  if(p.matchLock||payNos(p).length)return null;
  var cands=payOrderCands(p);if(!cands.length)return null;
  var amt=Number(p.amount)||0,equal=[],i;
  for(i=0;i<cands.length;i++)if(payAmtOk(p,cands[i])===true)equal.push(cands[i]);
  if(equal.length===1)return {no:equal[0].no,level:'exact'};   /* 多张候选里金额唯一相符 */
  if(equal.length>1)return null;                               /* 多张金额都一样 → 不确定 */
  if(cands.length===1){
    var a=cands[0],ok=payAmtOk(p,a);
    if(ok!==false)return {no:a.no,level:'exact'};              /* 金额相符，或订单没填金额（无从比较）*/
    if(amt<=a.amt*1.2)return {no:a.no,level:'soft'};           /* 部分回款 / 相差不大 → 挂上待核对 */
    return {no:null,level:'multi'};                            /* 金额远超单张订单：可能一票多单，交人工 */
  }
  var c0=cands[0];
  if(Math.abs(c0.diff)<=1&&Math.abs(cands[1].diff)>=4){
    var ok0=payAmtOk(p,c0);
    if(ok0!==false||amt<=(Number(c0.amt)||0)*1.2)return {no:c0.no,level:'near'};
  }
  return null;                                                 /* 其余交人工 */
}
/* 落匹配：回款侧写订单号，订单侧状态/产品信息即时联动 */
function applyMatch(p,no,by,level){
  p.shipNo=String(no==null?'':no);
  p.type='ship';
  p.matchBy=by||'auto';
  p.matchLevel=level||'exact';
  p.matchLock=true;
  return touch(p);
}
function unlinkMatch(p){
  p.shipNo='';p.type='prepay';p.matchBy='';p.matchLevel='';p.matchLock=true;
  return touch(p);
}
/* 批量自动匹配（只处理尚未挂单号的回款） */
function autoMatchPays(silent){
  var n=0,soft=0,multi=0;
  for(var i=0;i<db.payments.length;i++){
    var p=db.payments[i],r=autoMatchOne(p);
    if(!r)continue;
    if(!r.no){multi++;continue;}
    applyMatch(p,r.no,'auto',r.level);
    n++;if(r.level!=='exact')soft++;
  }
  if(n)save();
  if(!silent){
    var msg=n?('自动匹配完成：'+n+' 条回款已关联到对应订单'+(soft?('，其中 '+soft+' 条金额与订单有差异（部分回款），已标为「待核对」'):'')):'没有可自动匹配的回款。';
    if(multi)msg+='\n\n另有 '+multi+' 条回款金额明显超过单张订单，可能是一笔款对应多张订单，请在回款明细里点「匹配」手动勾选。';
    msg+='\n\n没把握确定的一律没动：可在回款明细的「订单匹配」列按「待匹配」筛选后逐条点「匹配」。';
    alert(msg);
  }
  return {n:n,soft:soft,multi:multi};
}

function mpOrderPool(p){
  var q=String(MP.q||'').trim(),d=dtNum(p.payDate);

    }

function mpPayPool(a){

  if(q){
    var res=[];
    for(var i=0;i<all.length;i++){

/* ---- 记录访问器（兼容新旧数据结构） ---- */
function payType(r){if(r.type==='ship'||r.type==='prepay')return r.type;var ns=payNos(r);for(var i=0;i<ns.length;i++){if(orderShipped(ns[i])>0)return 'ship';}return 'prepay';}
function payYm(r){return r.ym||((r.payDate||'').slice(0,7));}
function payShipNo(r){return r.shipNo||r.orderNo||'';}
/* 全返款：本笔回款金额为 0，货款全部靠返款冲抵 */
function payAllRefund(r){return !!r&&!(Number(r.amount)>0)&&(Number(r.refund)>0);}
function payItems(r){
  var t=payType(r);
  if(t==='prepay'){
    if(r.items&&r.items.length)return r.items.map(function(x){
      /* 赠品价默认 0：旧记录里跟着主行抄下来的价格不再展示（小计>0 说明是手改过的，保留） */
      if(x&&x.gift&&!(Number(x.subtotal)>0)){var c={};for(var k in x)c[k]=x[k];c.basePrice=0;c.supplyPrice=0;c.invoicePrice=0;return c;}
      return x;
    });
    return (r.name||r.spec)?[{name:r.name,spec:r.spec,qty:r.qty,supplyPrice:r.supplyPrice,invoicePrice:r.invoicePrice}]:[];
  }
  var nos=payNos(r),out=[];
  for(var i=0;i<nos.length;i++){
    var o=ordLine1(nos[i]);
    if(o){var p=findProd(o.pid)||{};var per=prodPerBox(p);var q=(Number(o.qtyBoxes)||0)*per+(Number(o.qtyUnits)||0);
      out.push({name:p.name||o.prodLabel,spec:p.spec||'',qty:q,supplyPrice:o.supplyPrice,invoicePrice:(Number(o.invoicePrice)>0?o.invoicePrice:(Number(p.invoicePrice)>0?p.invoicePrice:o.supplyPrice))});}
  }
  if(!out.length&&r.name)return [{name:r.name,spec:r.spec,qty:r.qty,supplyPrice:r.supplyPrice,invoicePrice:r.invoicePrice}];
  return out;
}

/* 兑款合计：同一笔回款会拆成多行产品（实际行 + 赠品行），金额类字段按回款去重后求和，避免重复计数 */
function sumByPay(rs,key){
  var seen={},s=0;
  for(var i=0;i<rs.length;i++){
    var k=rs[i].id;if(seen[k])continue;seen[k]=1;
    s+=Number(rs[i][key])||0;
  }
  return s;
}

/* 明细行：一笔回款里有几个产品就拆几行（赠品单独一行、价格默认 0），同笔回款的行保持相邻便于合并 */
function payOutRows(rows){
  var out=[];
  for(var i=0;i<rows.length;i++){
    var r=rows[i],its=payItems(r);
    if(!its.length)its=[{}];
    var shipType=(payType(r)==='ship');
    for(var j=0;j<its.length;j++){
      var it=its[j]||{};
      var iv=Number(it.invoicePrice)||0,sp=Number(it.supplyPrice)||0,q=Number(it.qty)||0;
      var sub=Number(it.subtotal)||0;
      if(!sub&&iv&&q)sub=r2(iv*q);
      out.push({id:r.id,seq:i+1,chk:!!r.chk,chkHide:j>0,
        ym:payYm(r).replace('-','/'),shipNo:payShipNo(r),payDate:r.payDate||'',
        matchBy:r.matchBy||'',matchLevel:r.matchLevel||'',
        cat:r.cat||'',agentName:r.agentName||'',custName:r.custName||'',
        name:it.name||r.name||'',spec:it.spec||'',gift:!!it.gift,
        qty:q,supplyPrice:sp,invoicePrice:iv,subtotal:sub,
        amount:Number(r.amount)||0,rebate:Number(r.rebate)||0,refund:Number(r.refund)||0,
        invoice:r.invoice,shipStatus:(shipType?'已发货':'未发货')});
    }
  }
  return out;
}

function r2(n){return Math.round((Number(n)||0)*100)/100;}
function setV(k,v){var el=document.querySelector('[data-k="'+k+'"]');if(el)el.value=v;}
/* 税金：开票价高于供货价部分，50%以内（含）×数量×18%，超出50%部分×数量×21% */
function payTaxCalc(inv,sup,qty){
  var i=Number(inv)||0,s=Number(sup)||0,q=Number(qty)||0;
  var mk=i-s;if(mk<=0||q<=0)return 0;
  var cap=s*0.5;
  var low=Math.min(mk,cap),high=Math.max(0,mk-cap);
  return r2(low*q*0.18+high*q*0.21);
}

function payOrderPick(){

  _buildIdx();
  var list=[];
  for(var no in _ordAgg){
    var a=_ordAgg[no];
    if(ag&&a.agent!==ag)continue;
    if(cn&&a.cust!==cn)continue;
    list.push(a);
  }
  list.sort(function(a,b){return natCmp(a.no,b.no);});
  if(q)list=list.filter(function(x){return (x.no+x.agent+x.cust+x.names.join('')).indexOf(q)>=0;});
  if(list.length>60)list=list.slice(0,60);
  var h='';

      +'<span class="mono">'+esc(r0.no)+'</span>　'+esc(r0.cust)+'　'+esc(r0.names.join('、'))+'</label>';

function payShipFill(){
  var box=document.getElementById('payShipInfo');if(!box)return;
  if(!PF.shipNos.length){box.className='hint';box.textContent='';PF.qty=0;return;}
  var rows=[],qty=0,sub=0,rf=0,tax=0,first=null;
  for(var i=0;i<PF.shipNos.length;i++){
    /* 同一订单号可能对应多行产品，全部计入 */
    var lines=ordLines(PF.shipNos[i]);
    for(var j=0;j<lines.length;j++){
      var o=lines[j];
      if(!first)first=o;
      var p=findProd(o.pid)||{};
      var per=prodPerBox(p);
      var q=(Number(o.qtyBoxes)||0)*per+(Number(o.qtyUnits)||0);
      var ip=(Number(o.invoicePrice)>0?Number(o.invoicePrice):(Number(p.invoicePrice)>0?Number(p.invoicePrice):Number(o.supplyPrice)||0));
      var sp=Number(o.supplyPrice)||0;
      var st=r2(ip*q),rb=r2((ip-sp)*q),tx=payTaxCalc(ip,sp,q);
      qty+=q;sub+=st;rf+=rb;tax+=tx;
      rows.push('<tr><td>'+esc(p.name||o.prodLabel)+'</td><td>'+esc(p.spec||'')+'</td><td>'+q+'</td><td>'+fmtN(o.basePrice)+'</td><td>'+fmtN(sp)+'</td><td>'+fmtN(ip)+'</td><td>'+fmtN(st)+'</td><td>'+fmtN(rb)+'</td></tr>');
    }
  }
  if(first){
    var cc=findCust(first.agentId);
    setV('cat',(cc&&cc.cat)||'');setV('agentName',first.agentName||'');setV('custName',first.custName||'');
    payCustChg();
  }
  PF.qty=qty;PF.subtotal=r2(sub);PF.refundBase=r2(rf);
  if(!PF.taxManual)PF.tax=r2(tax);
  setV('tax',PF.tax||'');
  box.className='';
  box.innerHTML='<table class="pay-info"><tr><th>产品名称</th><th>规格</th><th>数量（盒）</th><th>底价</th><th>供货价</th><th>开票价</th><th>小计</th><th>返款</th></tr>'
    +rows.join('')+'</table>';
  payShipCalc();
  if(!PF.amountManual){PF.amount=PF.subtotal||0;setV('amount',PF.subtotal||'');}
}

function payShipCalc(){
  var perEl=document.querySelector('[data-k="rebatePer"]');
  var rp=perEl?parseFloat(perEl.value)||0:0;
  PF.rebate=r2(rp*(Number(PF.qty)||0));
  var rb=document.querySelector('[data-k="rebate"]');if(rb)rb.value=PF.rebate||'';
  var taxEl=document.querySelector('[data-k="tax"]');
  var tax=taxEl?parseFloat(taxEl.value)||0:0;

/* 产品下拉数据源：先按分类过滤；OEM 再按表单中已填代理商过滤；代理商无匹配时退回该分类全部并提示 */
function payProdsFor(it){
  var all=it.cat?db.products.filter(function(p){return p.cat===it.cat;}):[];
  var res={list:all,agent:'',filtered:false,fallback:false};
  if(it.cat==='OEM'){
    var agEl=document.querySelector('[data-k="agentName"]');
    var ag=String((agEl?agEl.value:'')||PF.agentName||'').trim();res.agent=ag;
    if(ag){
      var m=all.filter(function(p){return String(p.agent||'').trim()===ag;});
      if(!m.length)m=all.filter(function(p){return String(p.agent||'').trim().indexOf(ag)>=0;});
      if(m.length){res.list=m;res.filtered=true;}else{res.fallback=true;}
    }
  }
  res.list=res.list.slice().sort(function(a,b){return pyCmp((a.name||'')+(a.spec||''),(b.name||'')+(b.spec||''));});
  return res;
}
function payProdLabel(p){return esc(p.name+(p.spec?('　'+p.spec):''));}
function payProdOptsHTML(it,src){
  var ph=!it.cat?'请先选择产品分类':(src.list.length?'选择产品':'无可选产品');
  var h='<option value="">'+ph+'</option>',found=false;
  for(var j=0;j<src.list.length;j++){var p=src.list[j];if(it.pid===p.id)found=true;
    h+='<option value="'+esc(p.id)+'"'+(it.pid===p.id?' selected':'')+'>'+payProdLabel(p)+'</option>';}
  if(it.pid&&!found){var cp=findProd(it.pid);
    if(cp)h+='<option value="'+esc(cp.id)+'" selected>'+payProdLabel(cp)+'（不在当前筛选内）</option>';}

}

    +'<span data-f="rebatePerBox" style="display:'+(it.rebateOn?'inline-flex':'none')+';gap:6px;align-items:center">每盒返利 <input type="number" step="any" data-f="rebatePer" style="width:90px" value="'+esc(it.rebatePer||'')+'" oninput="payItemCalc('+i+')"></span>'
    +'<span style="display:inline-flex;gap:6px;align-items:center">返利金额 <input type="number" step="any" data-f="rebate" style="width:110px" value="'+esc(it.rebate||'')+'" readonly></span>'

function payItemSel(i,sel){
  var it=PF.items[i];if(!it)return;
  if(sel.value!==it.pid)it.subtotalManual=false; /* 换产品后小计回到自动 */
  var oldPid=it.pid;
  it.pid=sel.value;
  if(oldPid&&oldPid!==it.pid)payGiftDrop(oldPid);
  var p=findProd(sel.value);
  if(p){
    if(!it.cat&&(p.cat==='自销'||p.cat==='OEM'))it.cat=p.cat;
    it.name=p.name;it.spec=p.spec||'';it.basePrice=p.basePrice;it.supplyPrice=p.supplyPrice;it.invoicePrice=p.invoicePrice||'';
    itSet(i,'spec',it.spec);itSet(i,'basePrice',it.basePrice||'');itSet(i,'supplyPrice',it.supplyPrice||'');itSet(i,'invoicePrice',it.invoicePrice||'');
  }
  payPolApply(i);   /* 有匹配政策时价格按政策带出 */
  payItemCalc(i);
  payGiftCheck(i);  /* 赠货政策自动加赠品行 */
}
/* 产品分类切换：切换后清空已选产品与价格，产品下拉只列该分类 */
function payItemCatSel(i,sel){
  var it=PF.items[i];if(!it)return;
  var v=sel?sel.value:'';
  if(v!==it.cat){
    if(it.pid)payGiftDrop(it.pid);
    it.cat=v;it.pid='';it.name='';it.spec='';it.basePrice='';it.supplyPrice='';it.invoicePrice='';it.subtotal='';it.subtotalManual=false;it.refund='';it.rebate='';it.polId='';it.polText='';
  }
  payRenderItems();payPreTotals();
}
function payItemCalc(i){
  var it=PF.items[i];if(!it)return;
  it.qty=parseFloat(itF(i,'qty'))||0;
  it.invoicePrice=parseFloat(itF(i,'invoicePrice'))||0;
  it.supplyPrice=parseFloat(itF(i,'supplyPrice'))||0;
  if(it.gift){
    /* 赠品价默认 0，手改开票价/供货价后按手改值算；小计也可手动改 */
    if(it.subtotalManual)it.subtotal=r2(parseFloat(itF(i,'subtotal'))||0);
    else it.subtotal=r2(it.invoicePrice*it.qty);
    it.refund=r2((it.invoicePrice-it.supplyPrice)*it.qty);
    it.rebate=0;
    itSet(i,'subtotal',it.subtotal||0);itSet(i,'refund',it.refund||0);itSet(i,'rebate',0);
    payPreTotals();return;
  }
  if(it.subtotalManual){it.subtotal=r2(parseFloat(itF(i,'subtotal'))||0);}
  else{it.subtotal=r2(it.invoicePrice*it.qty);}
  it.refund=r2((it.invoicePrice-it.supplyPrice)*it.qty);
  it.rebatePer=parseFloat(itF(i,'rebatePer'))||0;
  it.rebate=it.rebateOn?r2(it.rebatePer*it.qty):0;
  itSet(i,'subtotal',it.subtotal||'');itSet(i,'refund',it.refund||'');itSet(i,'rebate',it.rebate||'');
  payPreTotals();
  payGiftSoon(i);
}
/* 小计手动修改：手改后不再被自动值覆盖；清空输入框恢复自动（开票价×数量） */
function payItemSubInput(i,el){
  var it=PF.items[i];if(!it)return;
  var v=parseFloat(el.value);
  if(isNaN(v)){it.subtotalManual=false;payItemCalc(i);return;}
  it.subtotalManual=true;it.subtotal=r2(v);
  payPreTotals();
}
function payItemRebate(i,chk){
  var it=PF.items[i];if(!it)return;
  it.rebateOn=chk.checked;
  itShow(i,'rebatePerBox',chk.checked);
  payItemCalc(i);
}
function payDelItem(i){
  var it=PF.items[i];var pid=it?it.pid:'';var wasGift=it?!!it.gift:false;
  PF.items.splice(i,1);
  if(pid&&!wasGift){for(var k=PF.items.length-1;k>=0;k--){if(PF.items[k].gift&&PF.items[k].pid===pid)PF.items.splice(k,1);}}
  payRenderItems();payPreTotals();
}
/* ====== 回款（预付款）产品明细 × 产品政策联动：价格按政策带出 + 赠货自动加赠品行 ====== */
/* 按政策带出价格（回款日期落在政策有效期内且客户/代理商匹配时生效） */
function payPolApply(i){
  var it=PF.items[i];if(!it||!it.pid||it.gift)return;
  var pol=policyMatchFor(it.pid,PF.agentName,PF.custName,PF.payDate||today());
  it.polId=pol?pol.id:'';it.polText=pol?policyText(pol):'';
  if(!pol)return;
  var bp=Number(pol.basePrice)||0,sp=Number(pol.supplyPrice)||0,ip=Number(pol.invoicePrice)||0;
  if(bp){it.basePrice=bp;itSet(i,'basePrice',bp);}
  if(sp){it.supplyPrice=sp;itSet(i,'supplyPrice',sp);}
  if(ip){it.invoicePrice=ip;itSet(i,'invoicePrice',ip);}
}
function payGiftIdx(pid){
  for(var i=0;i<PF.items.length;i++){if(PF.items[i].gift&&PF.items[i].pid===pid)return i;}
  return -1;
}
function payGiftDrop(pid){
  var ch=false;
  for(var i=PF.items.length-1;i>=0;i--){if(PF.items[i].gift&&PF.items[i].pid===pid){PF.items.splice(i,1);ch=true;}}
  if(ch)payRenderItems();
}
/* 赠品政策检查（防抖 600ms：连续敲数量时不逐次弹窗） */
var payGiftSoon=debounce(function(i){
  if(PF&&PF.items&&PF.items[i]&&!PF.items[i].gift)payGiftCheck(i);
},600);
function payGiftCheck(i){
  var it=PF.items[i];if(!it||!it.pid||it.gift)return;
  var pol=policyMatchFor(it.pid,PF.agentName,PF.custName,PF.payDate||today());
  if(!pol||policyType(pol)!=='赠货')return;
  var b=Number(pol.giftBuy)||0,g=Number(pol.giftGet)||0,qty=Number(it.qty)||0;
  if(!b||!g)return;
  var gq=qty>=b?Math.floor(qty/b)*g:0;
  var gi=payGiftIdx(it.pid);
  if(gi>=0){
    var gt=PF.items[gi];
    if(gq>0&&Number(gt.qty)!==gq){gt.qty=gq;itSet(gi,'qty',gq);payPreTotals();}
    return;
  }
  if(gq<=0)return;
  PF.giftAsked=PF.giftAsked||{};PF.giftDeclined=PF.giftDeclined||{};
  if(PF.giftDeclined[it.pid]===gq)return;
  if(PF.giftAsked[it.pid]===gq)return;
  var p=findProd(it.pid)||{};
  if(!confirm('「'+(p.name||'')+'」符合赠货政策：买 '+b+' 赠 '+g+'，赠品 '+gq+' 件，金额 0 元（可手动修改）。\n自动添加赠品？')){PF.giftDeclined[it.pid]=gq;return;}
  PF.giftAsked[it.pid]=gq;
  PF.items.splice(i+1,0,{cat:it.cat,pid:it.pid,name:it.name,spec:it.spec,qty:gq,basePrice:0,supplyPrice:0,
    invoicePrice:0,subtotal:0,subtotalManual:false,refund:0,rebateOn:false,rebatePer:'',rebate:0,gift:true});
  payRenderItems();
}
/* 客户/代理商/回款日期变化后（防抖）：按政策刷新各产品行价格与赠品 */
var payPolSoon=debounce(function(){payPolRefreshAll();},500);
function payPolRefreshAll(){
  if(!PF||PF.type!=='prepay'||!PF.items)return;
  var pd=document.querySelector('[data-k="payDate"]');
  if(pd&&pd.value)PF.payDate=pd.value;
  for(var i=0;i<PF.items.length;i++){
    var it=PF.items[i];
    if(!it||!it.pid||it.gift)continue;
    payPolApply(i);payItemCalc(i);
  }
}
function payAddItem(){
  PF.items.push({cat:'',pid:'',name:'',spec:'',qty:'',basePrice:'',supplyPrice:'',invoicePrice:'',subtotal:'',subtotalManual:false,refund:'',rebateOn:false,rebatePer:'',rebate:''});
  payRenderItems();
}
function payPreTotals(){
  var tax=0,rf=0,amt=0;
  for(var i=0;i<PF.items.length;i++){
    var it=PF.items[i];if(!it.pid)continue;
    if(!it.gift)tax+=payTaxCalc(it.invoicePrice,it.supplyPrice,it.qty);  /* 赠品不计税，但小计/返款照常计入 */
    rf+=Number(it.refund)||0;
    amt+=Number(it.subtotal)||0;
  }
  tax=r2(tax);rf=r2(rf);amt=r2(amt);
  if(!PF.amountManual){PF.amount=amt;setV('amount',amt||'');}
  if(!PF.taxManual)PF.tax=tax;
  if(!PF.refundManual)PF.refund=r2(rf-(Number(PF.tax)||0));   /* 手改过的返款金额保持不动 */
  setV('tax',PF.tax||'');setV('refund',PF.refund||'');
}
/* 返款金额标签上的「手动」标记：手改后亮起，清空输入框恢复自动计算 */
function payRefundTagHTML(){
  return '<span id="payRefundTag" class="tag c2" style="margin-left:6px;display:'+(PF.refundManual?'inline':'none')+'">手动</span>';
}
function payRefundTagSync(){
  var b=document.getElementById('payRefundTag');if(b)b.style.display=PF.refundManual?'inline':'none';
}
/* 返款金额手动修改：手改后不再被产品明细/税金自动覆盖；清空输入框恢复自动 */
function payRefundInput(el){
  var v=parseFloat(el.value);
  if(el.value===''){PF.refundManual=false;if(PF.type==='ship')payShipCalc();else payPreTotals();payRefundTagSync();return;}
  if(isNaN(v)){PF.refundManual=false;return;}
  PF.refundManual=true;PF.refund=r2(v);
  payRefundTagSync();
}
/* 税金/回款金额手动修改：手改后不再自动覆盖；清空输入框则恢复自动计算 */
function payTaxInput(el){
  var v=parseFloat(el.value);
  if(isNaN(v)){PF.taxManual=false;payPreTotals();return;}
  PF.taxManual=true;PF.tax=r2(v);
  if(PF.refundManual)return;   /* 返款手改过就不跟随税金 */
  var rf=0;
  for(var i=0;i<PF.items.length;i++){var it=PF.items[i];if(it.pid)rf+=Number(it.refund)||0;}
  PF.refund=r2(rf-PF.tax);
  setV('refund',PF.refund||'');
}
function payAmountInput(el){
  var v=parseFloat(el.value);
  if(isNaN(v)){
    PF.amountManual=false;
    if(PF.type==='ship'){if(PF.subtotal)setV('amount',PF.subtotal);}
    else payPreTotals();
    return;
  }
  PF.amountManual=true;PF.amount=r2(v);
}
function savePayForm(id){
  var ymV=formVal('ym')||payYmFallbackVal();

  if(!formVal('payDate')){alert('请选择回款日期');return;}

  if(!formVal('agentName')){alert('请填写代理商');return;}
  if(!formVal('custName')){alert('请填写客户名称');return;}

  var amount=parseFloat(formVal('amount')),rfNow=parseFloat(formVal('refund'))||0;
  if(!(amount>=0)){alert('请填写回款金额（本笔全部为返款时填 0）');return;}
  amount=r2(amount);
  if(!amount&&!rfNow&&!confirm('回款金额与返款金额都是 0，确定保存这条回款吗？'))return;
  var rec={id:id||uid(),type:PF.type,ym:ymV,payDate:formVal('payDate'),cat:formVal('cat'),agentName:formVal('agentName'),custName:formVal('custName'),
    amount:amount,tax:parseFloat(formVal('tax'))||0,taxManual:!!PF.taxManual,refundManual:!!PF.refundManual,note:formVal('note'),invoice:formVal('invoice')};
  if(PF.type==='ship'){
    if(!PF.shipNos||!PF.shipNos.length){alert('请勾选发货单号');return;}
    var rp=parseFloat(formVal('rebatePer'))||0;
    rec.shipNo=PF.shipNos.join(',');
    if(PF.shipNos.length===1){
      var so=ordLine1(PF.shipNos[0]);
      if(so){var spp=findProd(so.pid)||{};rec.name=spp.name||so.prodLabel;rec.spec=spp.spec||'';}
      else{rec.name=PF.name||'';rec.spec=PF.spec||'';}
    }else{rec.name='';rec.spec='';}
    rec.qty=Number(PF.qty)||0;
    rec.basePrice=Number(PF.basePrice)||0;rec.supplyPrice=Number(PF.supplyPrice)||0;rec.invoicePrice=Number(PF.invoicePrice)||0;
    rec.subtotal=Number(PF.subtotal)||0;
    rec.rebateOn=!!PF.rebateOn;rec.rebatePer=rp;rec.rebate=r2(rp*(Number(PF.qty)||0));
    rec.refund=PF.refundManual?(parseFloat(formVal('refund'))||0):r2((Number(PF.refundBase)||0)-(parseFloat(formVal('tax'))||0));
  }else{
    rec.shipNo='';rec.items=[];rec.rebate=0;
    for(var i=0;i<PF.items.length;i++){
      var it=PF.items[i];if(!it.pid)continue;
      rec.items.push({cat:it.cat||'',pid:it.pid,name:it.name,spec:it.spec,qty:Number(it.qty)||0,basePrice:Number(it.basePrice)||0,

function importPayExcel(input){
  var f=input.files&&input.files[0];if(!f)return;
  if(!window.XLSX){whenXLSX(function(){importPayExcel(input);});return;}
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var wb=XLSX.read(new Uint8Array(rd.result),{type:'array'});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var json=XLSX.utils.sheet_to_json(ws,{header:1});

      /* 表头行识别：一行里能对上 ≥3 个回款字段、且包含金额或日期列，就算表头（兼容各种台账叫法，不要求固定字面） */
      for(var i=0;i<json.length;i++){
        var row=json[i];if(!row||!row.length)continue;

        for(var j2=0;j2<row.length;j2++){

          var f2=PAY_HEAD_MAP[hc2];
          if(f2&&!tk[f2]){m2[j2]=f2;tk[f2]=1;hit++;}

      var lines=[],yc={},skip=0,skipMsg=[];
      for(var k=headRow+1;k<json.length;k++){
        var rr=json[k];if(!rr)continue;
        var cell={},str={},any=false;
        for(var c in headMap){
          var cv=rr[c];cell[headMap[c]]=cv;
          var v=String(cv==null?'':cv).trim();str[headMap[c]]=v;if(v)any=true;
        }
        if(!any)continue;
        if(isTplExample(str)){skip++;skipMsg.push('第'+(k+1)+'行：模板示例行已自动跳过');continue;}
        var pd=xlDate(cell.payDate);

      var years=Object.keys(yc).sort(function(a,b){return yc[b]-yc[a];});

      var cmap={};

      function custOf(name){
        var n=String(name||'').trim();if(!n)return null;
        if(cmap[n])return cmap[n];

        return cmap[k2]||null;
      }
      /* 已存在的回款指纹：重复导入同一张表时自动跳过，不会产生重复记录。
         注意：只和「导入前已存在」的记录比对——同一张表里本来就可能有两条一模一样的回款（如两次各 580 元），
         那种情况必须都保留，不能当成重复。 */
      var seen={};
      db.payments.forEach(function(r){seen[payKey(r)]=1;});
      var added=0;
      for(var t=0;t<lines.length;t++){
        var L=lines[t],st=L.str,amt=r2(xlNum(L.cell.amount)),rfd=r2(xlNum(L.cell.refund));
        /* 回款金额可以是 0（整笔靠返款冲抵）；金额与返款都为 0 才视为空行跳过 */
        if(!amt&&!rfd){skip++;skipMsg.push('第'+L.ln+'行：回款金额与返款金额都为 0');continue;}
        var year=L.date?L.date.slice(0,4):dftYear;
        var ymV=xlYm(L.cell.ym,year)||(L.date?L.date.slice(0,7):'');
        if(!ymV){skip++;skipMsg.push('第'+L.ln+'行：回款日期与回款年/月都缺失');continue;}
        var nos=String(st.shipNo||'').split(/[,，、;；\s]+/).filter(function(x){return x;});
        var anySh=(st.shipStatus==='已发货');
        for(var q=0;q<nos.length;q++){if(orderShipped(nos[q])>0){anySh=true;break;}}
        var type=(nos.length&&anySh)?'ship':'prepay';
        var cust=custOf(st.custName);
        var note=st.note||'';
        if(!L.date)note=(note?note+'；':'')+'原表未填回款日期，按回款年月「'+ymV+'」归集';
        var out={id:uid(),type:type,ym:ymV,shipNo:(type==='ship'?st.shipNo:''),payDate:L.date,
          cat:st.cat||(cust?cust.cat:''),agentName:st.agentName||'',custName:st.custName||'',
          amount:amt,rebate:r2(xlNum(L.cell.rebate)),refund:rfd,refundManual:!!rfd,tax:0,
          invoice:(st.invoice==='是'||st.invoice==='✓'||st.invoice==='☑')?'是':'否',note:note,chk:false};
        if(type==='ship'){
          out.name=st.name||'';out.spec=st.spec||'';
          out.supplyPrice=r2(xlNum(L.cell.supplyPrice));out.invoicePrice=r2(xlNum(L.cell.invoicePrice));
        }else{
          out.items=st.name?[{pid:'',name:st.name,spec:st.spec||'',qty:0,basePrice:0,supplyPrice:r2(xlNum(L.cell.supplyPrice)),invoicePrice:r2(xlNum(L.cell.invoicePrice)),subtotal:0,refund:0,rebateOn:false,rebatePer:0,rebate:0}]:[];
        }
        var fk=payKey(out);
        if(seen[fk]){skip++;skipMsg.push('第'+L.ln+'行：已存在相同回款记录，自动跳过');continue;}
        db.payments.push(out);added++;
      }
      save();
      var am=autoMatchPays(true);   /* 导入后立即把「完全确定」的回款关联到对应订单 */
      if(input)input.value='';
      var msg=added?('成功导入 '+added+' 条回款记录'):'';
      if(am.n)msg+=(msg?'\n':'')+'已自动匹配 '+am.n+' 条回款到对应订单'+(am.soft?('（其中 '+am.soft+' 条金额与订单有差异，标为「待核对」）'):'');
      if(am.multi)msg+=(msg?'\n':'')+'另有 '+am.multi+' 条金额明显超过单张订单，请点「匹配」手动关联';
      if(skip)msg+=(msg?'\n':'')+'跳过 '+skip+' 条：\n'+skipMsg.slice(0,5).join('\n')+(skipMsg.length>5?'\n…': '');
      alert(msg||'未导入数据。\n'+(skipMsg.length?skipMsg.slice(0,5).join('\n'):'请检查表格内容'));
      render();
    }catch(e){console.log('导入失败',e);alert('导入失败：'+e.message);}
  };
  rd.readAsArrayBuffer(f);
}

/* ================= 产品政策（回款明细模块 · 内页） =================
   政策两种形式：
   · 赠货（买N赠M）：发货时 N 件带金额、M 件赠品金额为 0（赠品单价可手动改）；
     开票价按 N+M 件全额开票，供货价中 M 件为 0，多余部分扣税金后返款给客户。
   · 返点：按该产品（开票）总金额的一定比例返给客户。 */
var POLICY_TYPES=['赠货','返点','阶段性返点'];
function policyType(r){
  var t=r?r.policyType:'';
  return (t==='返点'||t==='阶段性返点')?t:'赠货';
}
function policyStage(r){return policyType(r)==='阶段性返点';}
function policyProdCatTag(c){return c?'<span class="tag '+(c==='自销'?'c1':'c2')+'">'+esc(c)+'</span>':'—';}
/* 政策文字描述 */
function policyText(r){
  var t=policyType(r);
  if(t==='返点')return '返点 '+(Number(r.rebateRate)||0)+'%';
  if(t==='阶段性返点')return (r.startDate||'—')+' ~ '+(r.endDate||'—')+' · 完成 '+(Number(r.doneRate)||0)+'% / 未完成 '+(Number(r.undoneRate)||0)+'%';
  return '买 '+(Number(r.giftBuy)||0)+' 赠 '+(Number(r.giftGet)||0);
}
/* 政策有效期：阶段性返点用结算区间（startDate/endDate），赠货/返点用生效区间（effStart/effEnd）。
   有效期内的销售订单该品种享受对应政策；两个日期都没填视为长期有效 */
function policyWindow(r){
  if(policyStage(r))return {s:r.startDate||'',e:r.endDate||''};
  return {s:r.effStart||'',e:r.effEnd||''};
}
function policyActive(r,t){
  t=t||today();var w=policyWindow(r);
  if(w.s&&t<w.s)return false;
  if(w.e&&t>w.e)return false;
  return true;
}
/* 兑现方式：一次性发货（单次下单即享受）/ 累计达标（政策期内累计发货达到目标后享受） */
function policyExeMode(r){return policyStage(r)?'':(r.exeMode==='累计达标'?'累计达标':'一次性发货');}
/* 累计发货统计：政策有效期内、该客户（无客户名按代理商）该产品的订单件数合计（盒） */
function policyCumQty(r){
  var w=policyWindow(r),pn=String(r.prodName||'').trim(),s=0;
  db.orders.forEach(function(o){
    var d=o.shipDate||'';if(w.s&&d<w.s)return;if(w.e&&d>w.e)return;
    if(!policyStageHit(r,o))return;
    if(pn&&String(o.prodLabel||'').indexOf(pn)<0)return;
    s+=Number(o.qtyUnits)||0;
  });
  return s;
}
/* 返款参考（单个政策循环）：
   赠货 = 开票价×(买+赠) − 供货价×买
   返点 = 开票价 × 返点比例（单件）
   阶段性返点 = 区间净回款 × 适用比例（见 policyStageStat） */
function policyRefund(r){
  var inv=Number(r.invoicePrice)||0;
  var t=policyType(r);
  if(t==='阶段性返点')return policyStageStat(r).pay;
  if(t==='返点')return inv*((Number(r.rebateRate)||0)/100);
  var b=Number(r.giftBuy)||0,g=Number(r.giftGet)||0;
  if(!(b+g))return 0;
  return inv*(b+g)-(Number(r.supplyPrice)||0)*b;
}
/* ================= 阶段性返点：区间回款自动结算 =================
   结算口径：统计区间内该客户（无客户名时按代理商）的回款，
   毛回款 = Σ回款金额；净回款 = 毛回款 − Σ返利 − Σ返款（返利、返款要从总回款里扣掉）；
   完成判定 = 净回款 ≥ 目标金额 且 返点要求达标；
   返点金额 = 净回款 × （完成 → 完成比例；未完成 → 未完成比例）。 */
function policyStageHit(r,p){
  var cn=String(r.custName||'').trim(),pcn=String(p.custName||'').trim();
  var ag=String(r.agent||'').trim(),pag=String(p.agentName||'').trim();
  if(cn&&pcn)return cn===pcn;      /* 两端都有客户名 → 按客户名比 */
  if(ag&&pag)return ag===pag;      /* 客户名缺失 → 退到代理商比 */
  return false;
}
function policyStageRows(r){
  var s=r.startDate||'',e=r.endDate||'';
  var only=(r.scopeProd==='仅本产品'),pn=String(r.prodName||'').trim();
  var out=[];
  for(var i=0;i<db.payments.length;i++){
    var p=db.payments[i],d=p.payDate||'';
    if(!d)continue;
    if(s&&d<s)continue;
    if(e&&d>e)continue;
    if(!policyStageHit(r,p))continue;
    if(only&&pn){
      var its=payItems(p),hit=false;
      for(var j=0;j<its.length;j++){if(String(its[j].name||'').trim()===pn){hit=true;break;}}
      if(!hit)continue;
    }
    out.push(p);
  }
  out.sort(function(a,b){return (a.payDate||'')<(b.payDate||'')?-1:((a.payDate||'')>(b.payDate||'')?1:0);});
  return out;
}
function policyStageStat(r){
  var rows=policyStageRows(r),gross=0,reb=0,ref=0;
  for(var i=0;i<rows.length;i++){
    gross+=Number(rows[i].amount)||0;
    reb+=Number(rows[i].rebate)||0;
    ref+=Number(rows[i].refund)||0;
  }
  var net=r2(gross-reb-ref);
  var target=Number(r.targetAmount)||0;
  var pct=target>0?Math.round(net/target*1000)/10:0;
  var hasReq=!!String(r.reqText||'').trim();
  var reqState=r.reqPass||'未确认';
  var reqOk=hasReq?(reqState==='达标'):(reqState!=='未达标');
  var amtOk=target>0?(net>=target):true;
  var done=amtOk&&reqOk;
  var t=today(),st;
  if(r.startDate&&t<r.startDate)st='未开始';
  else if(r.endDate&&t>r.endDate)st=done?'已完成':'未完成';
  else st=done?'已完成':'进行中';
  var rate=done?(Number(r.doneRate)||0):(Number(r.undoneRate)||0);
  return {rows:rows,gross:r2(gross),rebate:r2(reb),refund:r2(ref),net:net,target:target,pct:pct,
    reqState:reqState,reqOk:reqOk,amtOk:amtOk,done:done,status:st,rate:rate,pay:r2(net*rate/100)};
}
function policyStageTag(st){
  var c=(st==='已完成')?'ok':((st==='未完成')?'warn':((st==='进行中')?'c2':'pend'));
  return '<span class="tag '+c+'">'+esc(st)+'</span>';
}
/* 排序：客户分类（省总>大包商>零散客户）→ 代理商 → 客户名称（代理商通用政策排最前）→ 产品名称 → 规格 */
function policySort(rows){
  rows.sort(function(a,b){
    var c=custCatIdx(a.cat)-custCatIdx(b.cat);if(c)return c;
    var g=pyCmp(a.agent||'',b.agent||'');if(g)return g;
    var ae=a.custName?'1':'0',be=b.custName?'1':'0';
    if(ae!==be)return ae<be?-1:1;
    var n=pyCmp(a.custName||'',b.custName||'');if(n)return n;
    var pn=pyCmp(a.prodName||'',b.prodName||'');if(pn)return pn;
    return natCmp(a.spec||'',b.spec||'');
  });
  return rows;
}

/* 产品名称 / 规格候选：按产品分类过滤
   —— 自销 → 调出自销产品；OEM → 该客户名下的 OEM 产品，其次该代理商的，都没有才退回该分类全部（并提示） */
function policyProdScope(cat,agent,cust){
  agent=agent?String(agent).trim():'';
  cust=cust?String(cust).trim():'';
  var all=db.products.filter(function(p){return !cat||String(p.cat||'')===cat;});
  if(cat!=='OEM'||(!agent&&!cust))return {list:all,msg:''};
  if(cust){
    var mc=all.filter(function(p){return String(p.custName||'').trim()===cust;});
    if(mc.length)return {list:mc,msg:''};
  }
  if(agent){
    var ma=all.filter(function(p){return String(p.agent||'').trim()===agent;});
    if(!ma.length)ma=all.filter(function(p){return String(p.agent||'').trim().indexOf(agent)>=0;});
    if(ma.length)return {list:ma,msg:''};
  }
  return {list:all,msg:(cust||agent)?'该客户 / 代理商名下暂无 OEM 产品，已临时列出全部 OEM 产品（可到产品档案补填归属）':''};
}
function policyProds(cat,agent,cust){return policyProdScope(cat,agent,cust).list;}
function policyProdOpts(cat,agent,cust,keep){
  var seen={},out=[];
  policyProds(cat,agent,cust).forEach(function(p){var v=p.name;if(!v||seen[v])return;seen[v]=1;out.push(v);});
  out.sort(pyCmp);
  if(keep&&out.indexOf(keep)<0)out.unshift(keep);
  return out;
}
function policySpecOpts(cat,agent,cust,name,keep){
  var seen={},out=[];
  policyProds(cat,agent,cust).forEach(function(p){
    if(name&&p.name!==name)return;
    var v=p.spec;if(!v||seen[v])return;seen[v]=1;out.push(v);
  });
  out.sort(natCmp);
  if(keep&&out.indexOf(keep)<0)out.unshift(keep);
  return out;
}
function policyOptsHTML(list,keep){
  var h='<option value="">请选择</option>';
  for(var i=0;i<list.length;i++)h+='<option value="'+esc(list[i])+'"'+(keep===list[i]?' selected':'')+'>'+esc(list[i])+'</option>';
  return h;
}

function importPolicyExcel(input){
  var f=input.files&&input.files[0];if(!f)return;
  input.value='';
  if(!window.XLSX){whenXLSX(function(){importPolicyExcel(input);});return;}
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var wb=XLSX.read(new Uint8Array(rd.result),{type:'array'});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var json=XLSX.utils.sheet_to_json(ws,{header:1,raw:false});
      var headRow=-1;
      for(var i=0;i<json.length;i++){
        var row=json[i];if(!row||!row.length)continue;
        if(row.join(',').indexOf('代理商')>=0&&row.join(',').indexOf('产品名称')>=0){headRow=i;break;}
      }
      if(headRow<0){alert('未识别到表头，请先点击"模板"下载模板按格式填写');return;}
      var map={'客户分类':'cat','代理商':'agent','客户名称':'custName','产品分类':'prodCat','产品名称':'prodName',
        '产品规格':'spec','底价':'basePrice','供货价':'supplyPrice','开票价':'invoicePrice','政策类型':'policyType',
        '兑现方式':'exeMode','生效开始':'effStart','生效结束':'effEnd','累计目标(盒)':'targetQty',
        '赠货·买':'giftBuy','赠货·赠':'giftGet','返点比例(%)':'rebateRate',
        '区间开始':'startDate','区间结束':'endDate','回款目标(元)':'targetAmount','统计范围':'scopeProd',
        '返点要求':'reqText','要求状态':'reqPass','完成比例(%)':'doneRate','未完成比例(%)':'undoneRate','备注':'note'};
      var head=json[headRow],headMap={};
      for(var j=0;j<head.length;j++){
        var hc=String(head[j]==null?'':head[j]).trim();
        if(map[hc])headMap[j]=map[hc];
      }
      var numKeys={basePrice:1,supplyPrice:1,invoicePrice:1,giftBuy:1,giftGet:1,rebateRate:1,targetAmount:1,doneRate:1,undoneRate:1,targetQty:1};
      var dateKeys={startDate:1,endDate:1,effStart:1,effEnd:1};
      var added=0,skip=0,skipMsg=[];
      for(var k=headRow+1;k<json.length;k++){
        var rr=json[k];if(!rr)continue;
        var rec={id:uid(),created:today()},any=false;
        for(var c in headMap){
          var key=headMap[c],v=String(rr[c]==null?'':rr[c]).trim();
          if(!v&&!any)continue;
          if(numKeys[key])rec[key]=xlNum(v);
          else if(dateKeys[key])rec[key]=normDate(v);
          else rec[key]=v;
          if(v)any=true;
        }
        if(!any)continue;
        if(isTplExample(rec)){skip++;if(typeof skipMsg!=='undefined')skipMsg.push('模板示例行（'+String(rec.name||rec.custName||rec.company||rec.prodName||rec.agent||rec.agentName||'')+'…）已自动跳过');continue;}
        if(!rec.agent||!rec.prodName){skip++;skipMsg.push('第'+(k+1)+'行：代理商或产品名称缺失');continue;}
        if(rec.cat&&CAT_ORDER[rec.cat]===undefined)rec.cat='';
        if(rec.prodCat!=='自销'&&rec.prodCat!=='OEM')rec.prodCat='';
        if(POLICY_TYPES.indexOf(rec.policyType)<0)rec.policyType='赠货';
        rec.custName=rec.custName||'';
        rec.scopeProd=(rec.scopeProd==='仅本产品')?'仅本产品':'客户全部产品';
        if(['达标','未达标','未确认'].indexOf(rec.reqPass)<0)rec.reqPass='未确认';
        if(rec.policyType==='阶段性返点'){
          rec.giftBuy=0;rec.giftGet=0;rec.rebateRate=0;rec.exeMode='';rec.targetQty=0;rec.effStart='';rec.effEnd='';
          if(!rec.startDate||!rec.endDate){skip++;skipMsg.push('第'+(k+1)+'行：阶段性返点缺少结算区间');continue;}
          if(!(rec.targetAmount>0)){skip++;skipMsg.push('第'+(k+1)+'行：阶段性返点缺少区间回款目标');continue;}
          if(!(rec.doneRate>0)){skip++;skipMsg.push('第'+(k+1)+'行：阶段性返点缺少完成比例');continue;}
        }else{
          rec.startDate='';rec.endDate='';rec.targetAmount=0;rec.scopeProd='';rec.reqText='';rec.reqPass='';rec.doneRate=0;rec.undoneRate=0;
          rec.exeMode=(rec.exeMode==='累计达标')?'累计达标':'一次性发货';
          if(rec.exeMode==='累计达标')rec.targetQty=xlNum(rec.targetQty)||0;else rec.targetQty=0;
          if(rec.policyType==='返点'){rec.giftBuy=0;rec.giftGet=0;if(!(rec.rebateRate>0))rec.rebateRate=0;}
          else if(!(rec.giftBuy>0||rec.giftGet>0)){rec.giftBuy=10;rec.giftGet=1;}
        }
        db.prodPolicies.push(touch(rec));
        added++;
      }
      save();
      var msg='导入完成：新增 '+added+' 条产品政策'+(skip?('，跳过 '+skip+' 条：\n'+skipMsg.slice(0,6).join('\n')+(skipMsg.length>6?'\n…':'')):'');
      alert(msg);
      render();
    }catch(e){console.log('导入失败',e);alert('导入失败：'+e.message);}
  };
  rd.readAsArrayBuffer(f);
}

      if(headRow<0){alert('未识别到表头，请先点击"模板"下载模板按格式填写');return;}
      var map={'日期':'date','客户分类':'cat','代理商':'agent','客户名称':'custName','事项':'item','纪要':'content','预计完成时间':'planDate'};
      var head=json[headRow];
      for(var j=0;j<head.length;j++){
        var hc=String(head[j]==null?'':head[j]).trim();
        if(map[hc])headMap[j]=map[hc];
      }
      var added=0,skip=0,skipMsg=[];
      for(var k=headRow+1;k<json.length;k++){
        var rr=json[k];if(!rr)continue;
        var rec={id:uid(),created:today(),done:false},any=false;
        for(var c in headMap){
          var v=String(rr[c]==null?'':rr[c]).trim();
          rec[headMap[c]]=v;if(v)any=true;
        }
        if(!any)continue;
        if(isTplExample(rec)){skip++;if(typeof skipMsg!=='undefined')skipMsg.push('模板示例行（'+String(rec.name||rec.custName||rec.company||rec.prodName||rec.agent||rec.agentName||'')+'…）已自动跳过');continue;}
        if(!rec.date||!/^\d{4}-\d{2}-\d{2}$/.test(rec.date=normDate(rec.date))){skip++;skipMsg.push('第'+(k+1)+'行：日期缺失或格式不对');continue;}
        if(!rec.custName){skip++;skipMsg.push('第'+(k+1)+'行：客户名称缺失');continue;}
        if(!rec.content){skip++;skipMsg.push('第'+(k+1)+'行：纪要缺失');continue;}
        if(LOG_ITEMS.indexOf(rec.item)<0)rec.item='其他';
        rec.planDate=normDate(rec.planDate);
        db.logs.push(rec);added++;
      }
      save();
      if(input)input.value='';
      alert(added?('成功导入 '+added+' 条工作记录'+(skip?('，跳过 '+skip+' 条：\n'+skipMsg.slice(0,5).join('\n')):'')):('未导入数据。\n'+(skipMsg.length?skipMsg.slice(0,5).join('\n'):'请检查表格内容')));
      render();
    }catch(e){console.log('导入失败',e);alert('导入失败：'+e.message);}
  };
  rd.readAsArrayBuffer(f);
}

/* ================= 资料库：电子版资料云端存储（多设备共用同一空间） ================= */
/* 所有上传的电子版资料（销售合同 / 产品资料 / 企业首营资料）统一存放在一个专用密钥 Gist 里。
   设备 A 上传 → 文件进云端 Gist、资料记录随台账数据（workbench.json）同步 → 设备 B 打开即可下载/预览。
   支持两类形态：① 整套压缩包（zip/rar/7z）② 每个文件的具体内容图片（自动压缩但保持文字清晰）。 */
var DOC_GIST_ID='0f34279c325ede0ebae898f643dc4a1f';
var DOC_API='https://api.github.com/gists/'+DOC_GIST_ID;
var DOC_RAW='https://gist.githubusercontent.com/Eva627-cpu/'+DOC_GIST_ID+'/raw/';
var DOC_MAX_MB=30;      // 单个文件大小上限（GitHub 通道实测稳定支持 25MB+）
var DOC_IMG_MAX=2200;   // 资料图片最长边（证书/合同文字需清晰可读，不用台账照片的 900px）
var DOC_KINDS={contract:'销售合同',material:'产品资料',first:'企业首营资料'};
var DOC_FIRST_CATS=['营业执照','药品生产许可证','GMP证书','质量体系文件','产品注册批件','检验报告','授权委托书','开票资料','其他'];
var DOC_UP={scope:'',kind:'',refId:''};
var _docPanel={redraw:null};

function docKindName(k){return DOC_KINDS[k]||k||'资料';}
function docSizeText(n){
  n=Number(n)||0;
  if(n<1024)return n+' B';
  if(n<1048576)return (n/1024).toFixed(1)+' KB';
  return (n/1048576).toFixed(2)+' MB';
}
/* 上传形态：整体压缩包 / 内容图片 / 其他电子版文件 */
function docForm(name,type){
  var ext=String(name||'').split('.').pop().toLowerCase();
  if(['zip','rar','7z','tar','gz'].indexOf(ext)>=0)return 'zip';
  if(/^image\//.test(type||'')||['jpg','jpeg','png','gif','webp','heic','bmp'].indexOf(ext)>=0)return 'img';
  return 'file';
}
function docFormName(f){return f==='zip'?'整体压缩包':(f==='img'?'内容图片':'电子版文件');}
function docIcon(d){
  if(d.form==='img')return '🖼️';
  if(d.form==='zip')return '🗜️';
  var ext=String(d.name||'').split('.').pop().toLowerCase();
  if(ext==='pdf')return '📕';
  if(['doc','docx','wps'].indexOf(ext)>=0)return '📘';
  if(['xls','xlsx'].indexOf(ext)>=0)return '📗';
  if(['ppt','pptx'].indexOf(ext)>=0)return '📙';
  return '📄';
}
function docRawUrl(f){return DOC_RAW+encodeURIComponent(f);}
/* 云端文件名：纯 ASCII + 唯一，原文件名只作显示用（中文/特殊字符不会影响云端） */
function docGistName(name){
  var ext=String(name||'').split('.').pop().toLowerCase();
  if(!/^[a-z0-9]{1,8}$/.test(ext))ext='bin';
  return 'd'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)+'.'+ext;
}
/* ---- 查询 ---- */
function docsOf(scope,refId,kind){
  var out=[];
  for(var i=0;i<(db.docs||[]).length;i++){
    var d=db.docs[i];
    if(scope&&d.scope!==scope)continue;
    if(refId!==undefined&&refId!==null&&String(d.refId||'')!==String(refId))continue;
    if(kind&&d.kind!==kind)continue;
    out.push(d);
  }
  return out;
}
function docCount(scope,refId,kind){return docsOf(scope,refId,kind).length;}
function findDoc(id){for(var i=0;i<(db.docs||[]).length;i++)if(db.docs[i].id===id)return db.docs[i];return null;}
/* ---- 云端文件读写 ---- */
function docPatchGist(files,cb){
  var body=JSON.stringify({files:files}),tries=0;
  (function go(){
    tries++;
    fetch(DOC_API,{method:'PATCH',headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+getToken(),'Content-Type':'application/json'},body:body})
      .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
      .then(function(d){cb(null,d);})
      .catch(function(e){if(tries<3)setTimeout(go,1500);else cb(e);});
  })();
}
/* base64 字符串对应的真实字节数（用于登记实际上传体积，图片压缩后才准确） */
function b64Bytes(b64){
  var s=String(b64||''),n=s.length;
  if(!n)return 0;
  var pad=0;
  if(s.charAt(n-1)==='=')pad++;
  if(s.charAt(n-2)==='=')pad++;
  return Math.round(n/4*3-pad);
}
/* 图片：等比缩放后转 JPEG（白底，避免透明 PNG 变黑）；其他文件原样转 base64。
   回调：b64 编码内容、bytes 实际文件字节数、mime 实际存储类型（图片压缩后统一为 image/jpeg） */
function docEncodeFile(file,form,cb){
  var rd=new FileReader();
  rd.onerror=function(){cb(null,0,'');};
  if(form!=='img'){
    rd.onload=function(){
      var s=String(rd.result||''),i=s.indexOf(','),b=i>=0?s.slice(i+1):'';
      cb(b,b64Bytes(b),file.type||docMimeFromName(file.name));
    };
    rd.readAsDataURL(file);return;
  }
  rd.onload=function(){
    var img=new Image();
    img.onerror=function(){cb(null,0,'');};
    img.onload=function(){
      var w=img.width,h=img.height;
      if(w>DOC_IMG_MAX||h>DOC_IMG_MAX){var r=Math.min(DOC_IMG_MAX/w,DOC_IMG_MAX/h);w=Math.round(w*r);h=Math.round(h*r);}
      var cv=document.createElement('canvas');cv.width=w;cv.height=h;
      var g=cv.getContext('2d');
      g.fillStyle='#fff';g.fillRect(0,0,w,h);g.drawImage(img,0,0,w,h);
      var out=cv.toDataURL('image/jpeg',0.88);
      var b=out.slice(out.indexOf(',')+1),mime='image/jpeg';
      /* 压缩后若反而更大（原本就是小图），退回原文件，避免越压越大 */
      if(b64Bytes(b)>=file.size){
        var s=String(rd.result||''),i=s.indexOf(',');
        b=i>=0?s.slice(i+1):'';mime=file.type||docMimeFromName(file.name);
      }
      cb(b,b64Bytes(b),mime);
    };
    img.src=rd.result;
  };
  rd.readAsDataURL(file);
}
/* 按扩展名推断 MIME（下载/预览时给浏览器正确类型） */
function docMimeFromName(name){
  var e=String(name||'').split('.').pop().toLowerCase();
  var m={pdf:'application/pdf',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',
    zip:'application/zip',rar:'application/vnd.rar','7z':'application/x-7z-compressed',
    doc:'application/msword',docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
    xls:'application/vnd.ms-excel',xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
    ppt:'application/vnd.ms-powerpoint',pptx:'application/vnd.openxmlformats-officedocument.presentationml.presentation',
    txt:'text/plain'};
  return m[e]||'application/octet-stream';
}
/* 云端存的是 base64 文本（Gist 只接受文本），下载/预览时在前端还原成真实文件字节。
   结果按云端文件名缓存，同一文件只解码一次；另一台设备同样走这条链路，无需本地文件 */
var _docObjCache={};
function docBlobUrl(d,cb){
  var key=d.gistFile||d.id;
  if(_docObjCache[key]){cb(_docObjCache[key]);return;}
  fetch(d.rawUrl||docRawUrl(d.gistFile))
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text();})
    .then(function(t){
      t=t.replace(/\s+$/,'');
      var bin=atob(t),n=bin.length,u8=new Uint8Array(n),i;
      for(i=0;i<n;i++)u8[i]=bin.charCodeAt(i);
      var url=URL.createObjectURL(new Blob([u8],{type:d.stored||d.type||docMimeFromName(d.name)}));
      _docObjCache[key]=url;
      cb(url);
    })
    .catch(function(){cb(null);});
}
/* 选择文件：只负责给隐藏 input 设好类型过滤，真正的上传在 docUpload 里做 */
function docPick(scope,kind,refId,form){
  DOC_UP={scope:scope,kind:kind,refId:refId||''};
  var inp=document.getElementById('docFileInput');
  if(!inp)return;
  inp.accept=form==='img'?'image/*':(form==='zip'?'.zip,.rar,.7z,.tar,.gz':'');
  inp.value='';
  inp.click();
}
/* 页面初始化时绑定隐藏的文件选择框（避免各处 onClick 传参转义问题） */
function initDocInput(){
  var inp=document.getElementById('docFileInput');
  if(inp)inp.onchange=function(){docUpload(inp);};
}
/* 上传：逐个文件写入云端（互不影响，单个失败不拖累其他），全部成功后落库并同步到其他设备 */
function docUpload(input){
  var files=input.files;
  if(!files||!files.length){input.value='';return;}
  if(!getToken()){input.value='';alert('尚未配置同步 Token，无法上传资料。\n\n请到「设置」→「修改 Token」粘贴后重试。');return;}
  var meta=DOC_UP||{},arr=[],i;
  for(i=0;i<files.length;i++)arr.push(files[i]);
  var list=db.docs||(db.docs=[]);
  var done=0,okc=0,fail=[];
  var p=findProd(meta.refId);
  var refLabel=(meta.scope==='prod'&&p)?prodLabel(p):'';
  var catSel=document.getElementById('docFirstCat');
  var cat=(meta.scope==='first')?(catSel?catSel.value:''):'';
  /* 上传进度写到「当前正在操作的那一块」：弹窗打开时写在弹窗里，否则写在资料库页面里
     （页面上与弹窗里各有一个进度条，用同一个 id 会写错位置） */
  function setProg(t){
    var mk=document.getElementById('wdMask');
    var scope=(mk&&mk.classList.contains('show'))?document.getElementById('wdBody'):document.getElementById('content');
    var el=scope?scope.querySelector('.doc-prog'):null;
    if(!el)el=document.querySelector('.doc-prog');
    if(el)el.textContent=t;
  }
  setProg('正在上传 0/'+arr.length+' …');
  (function next(){
    if(done>=arr.length){finish();return;}
    var f=arr[done];
    if(f.size>DOC_MAX_MB*1024*1024){fail.push(f.name+'（'+docSizeText(f.size)+'，超过 '+DOC_MAX_MB+'MB 上限）');done++;setProg('正在上传 '+done+'/'+arr.length+' …');next();return;}
    var form=docForm(f.name,f.type);
    docEncodeFile(f,form,function(b64,bytes,mime){
      if(!b64){fail.push(f.name+'（文件读取失败）');done++;setProg('正在上传 '+done+'/'+arr.length+' …');next();return;}
      var gname=docGistName(f.name),body={};
      body[gname]={content:b64};
      docPatchGist(body,function(err){
        if(err){fail.push(f.name+'（上传失败：'+(err&&err.message||'网络异常')+'）');}
        else{
          var rec={id:uid(),scope:meta.scope||'',kind:meta.kind||'',refId:meta.refId||'',refLabel:refLabel,
                   cat:cat,form:form,name:f.name,gistFile:gname,rawUrl:docRawUrl(gname),
                   size:bytes||f.size,origSize:f.size,type:f.type||'',stored:mime||'',created:today()};
          touch(rec);list.push(rec);okc++;
        }
        done++;setProg('正在上传 '+done+'/'+arr.length+' …');next();
      });
    });
  })();
  function finish(){
    if(okc)save();
    setProg('');
    input.value='';
    if(okc&&_docPanel.redraw)redrawDocPanel();
    else if(okc)render();
    if(fail.length)alert('资料上传完成\n\n成功 '+okc+' 个'+(okc?'（已自动同步到其他设备）':'')+'\n失败 '+fail.length+' 个：\n'+fail.join('\n'));
    else if(okc)alert('资料上传成功：'+okc+' 个文件已存入云端，其他设备可立即下载查看。');
  }
}
/* 打开 / 下载 / 删除：云端是 base64 文本，先还原成真实文件再用 blob 打开或保存 */
function docCanPreview(d){
  if(d.form==='img')return true;
  return /\.pdf$/i.test(String(d.name||''));
}
function docPreviewLabel(d){return d.form==='img'?'查看':(docCanPreview(d)?'预览':'打开');}
function docPreview(d){
  if(!docCanPreview(d)){docDownload(d);return;}
  if(d.form==='img'){
    docBlobUrl(d,function(u){
      if(u)showBig(u);
      else alert('资料读取失败，请检查网络后重试。');
    });
    return;
  }
  /* PDF：先同步开窗避免被浏览器拦截，解码完成后再把 blob 地址填进去 */
  var w=window.open('','_blank');
  docBlobUrl(d,function(u){
    if(u&&w)w.location.href=u;
    else{if(w)w.close();docDownload(d);}
  });
}
function docDownload(d){
  var name=d.name||'资料';
  docBlobUrl(d,function(u){
    if(!u){alert('资料读取失败，请检查网络后重试。');return;}
    var a=document.createElement('a');
    a.href=u;a.download=name;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
  });
}
function docPreviewById(id){var d=findDoc(id);if(d)docPreview(d);}
function docDownloadById(id){var d=findDoc(id);if(d)docDownload(d);}
/* 图片缩略图：raw 链接给的是 base64 文本，需取回后转成 data URL 才能显示 */
function docLoadThumbs(){
  var els=document.querySelectorAll('img.doc-thumb[data-doc]');
  for(var i=0;i<els.length;i++){
    (function(el){
      var d=findDoc(el.getAttribute('data-doc'));
      if(!d)return;
      el.removeAttribute('data-doc');
      fetch(d.rawUrl||docRawUrl(d.gistFile))
        .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text();})
        .then(function(t){el.src='data:'+(d.stored||d.type||'image/jpeg')+';base64,'+t.replace(/\s+$/,'');})
        .catch(function(){el.parentNode.innerHTML='<div class="doc-fileicon" onclick="docPreviewById(\''+d.id+'\')">🖼️</div>';});
    })(els[i]);
  }
}
function docDel(id){
  var d=findDoc(id);
  if(!d)return;
  if(!confirm('确定删除资料「'+d.name+'」？\n\n记录与云端文件都会被删除，其他设备同步删除后不可恢复。'))return;
  var finish=function(){
    markDel([d.id]);
    db.docs=db.docs.filter(function(x){return x.id!==id;});
    save();
    if(_docPanel.redraw)redrawDocPanel();else render();
  };
  if(!d.gistFile){finish();return;}   // 极少数无云端文件的记录：只删台账记录
  var body={};
  body[d.gistFile]=null;
  docPatchGist(body,function(err){
    if(err&&!confirm('云端文件删除失败（'+err.message+'）。\n仍要从台账记录中移除这条资料吗？'))return;
    finish();
  });
}
/* ---- 展示组件 ---- */
/* 图片压缩提示：让用户确认"传上去的是压缩版、原图仍在手机里" */
function docShrinkTip(d){
  var o=Number(d.origSize)||0,s=Number(d.size)||0;
  return (o>s*1.05)?'（原 '+docSizeText(o)+' 已压缩）':'';
}
function docGridHTML(list,emptyTip){

       '<button class="btn sm" onclick="docPreviewById(\''+d.id+'\')">'+docPreviewLabel(d)+'</button>'+

       '<button class="btn sm dgr" onclick="docDel(\''+d.id+'\')">删除</button>'+
       '</div></div>';

/* 上传区：压缩包 / 图片 / 其他电子版文件 三个入口（对应"整套压缩包 + 具体内容图片"两种形态）
   lead 用于在按钮前插入额外控件（如企业首营资料的「资料类别」下拉） */
function docUpZone(scope,kind,refId,lead){
  var a='\''+scope+'\',\''+kind+'\',\''+refId+'\'';

/* ================= 销售合同到期提醒（OEM 合同到期前 1 个月预警） ================= */
var CONTRACT_WARN_DAYS=30;
function contractLeftDays(r){
  if(!r||!r.contractEnd)return null;
  var a=new Date(String(r.contractEnd).slice(0,10).replace(/-/g,'/'));
  if(isNaN(a.getTime()))return null;
  var b=new Date(today().replace(/-/g,'/'));
  return Math.round((a-b)/86400000);
}
function contractState(r){
  var d=contractLeftDays(r);
  if(d===null)return {d:null,cls:'',txt:''};
  if(d<0)return {d:d,cls:'exp-warn',txt:'已过期 '+(-d)+' 天'};
  if(d<=CONTRACT_WARN_DAYS)return {d:d,cls:'exp-soon',txt:'剩 '+d+' 天'};
  return {d:d,cls:'exp-ok',txt:'剩 '+d+' 天'};
}
function contractAlertRows(){
  var rows=[];
  for(var i=0;i<db.products.length;i++){
    var p=db.products[i];
    if(p.cat!=='OEM')continue;
    var st=contractState(p);
    if(st.d!==null&&st.d<=CONTRACT_WARN_DAYS)rows.push({p:p,st:st});
  }
  rows.sort(function(a,b){return a.st.d-b.st.d;});
  return rows;
}
function contractAlertHTML(){
  var rows=contractAlertRows(),oem=[],i;
  for(i=0;i<db.products.length;i++)if(db.products[i].cat==='OEM')oem.push(db.products[i]);
  var noDate=0,noFile=0;
  for(i=0;i<oem.length;i++){
    if(!oem[i].contractEnd)noDate++;
    if(!docCount('prod',oem[i].id,'contract'))noFile++;
  }
  var h='';
  if(!rows.length){
    h+='<div class="doc-sub">近 30 天内没有到期的 OEM 销售合同'+(oem.length?('（共 '+oem.length+' 个 OEM 产品，暂无预警）'):'')+'。</div>';
  }else{
    h+='<table class="exp-tbl"><thead><tr><th>产品</th><th>代理商</th><th>到期日</th><th>状态</th><th></th></tr></thead><tbody>';
    for(i=0;i<rows.length;i++){

      h+='<tr><td>'+esc(p.name)+(p.spec?(' '+esc(p.spec)):'')+'</td>'
        +'<td>'+esc(p.agent||'—')+'</td>'

    }

  return h;
}

/* 产品导入 Excel（支持模板 .xlsx 与导出的 .xls） */
function importProdExcel(input){
  var f=input.files&&input.files[0];if(!f)return;
  if(!window.XLSX){whenXLSX(function(){importProdExcel(input);});return;}
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var wb=XLSX.read(new Uint8Array(rd.result),{type:'array'});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var json=XLSX.utils.sheet_to_json(ws,{header:1});
      var headRow=-1,headMap={};
      for(var i=0;i<json.length;i++){
        var row=json[i];if(!row||!row.length)continue;
        if(row.join(',').indexOf('产品分类')>=0||row.join(',').indexOf('产品名称')>=0){headRow=i;break;}
      }
      if(headRow<0){alert('未识别到表头，请先点击"模板"下载模板按格式填写');return;}
      var map={'产品分类':'cat','客户分类':'custCat','代理商':'agent','客户名称':'custName','产品名称':'name','规格':'spec','商标':'brand','底价':'basePrice','供货价':'supplyPrice','开票价':'invoicePrice','挂网价格':'netPrice'};
      var head=json[headRow];
      for(var j=0;j<head.length;j++){
        var hc=String(head[j]==null?'':head[j]).trim();
        if(map[hc])headMap[j]=map[hc];
      }
      var NUM=['basePrice','supplyPrice','invoicePrice','netPrice'];
      var added=0,skip=0,skipMsg=[];
      for(var k=headRow+1;k<json.length;k++){
        var rr=json[k];if(!rr)continue;
        var rec={id:uid(),created:today()},any=false;
        for(var c in headMap){
          var v=String(rr[c]==null?'':rr[c]).trim();
          rec[headMap[c]]=v;
          if(v)any=true;
        }
        if(!any)continue;
        if(isTplExample(rec)){skip++;if(typeof skipMsg!=='undefined')skipMsg.push('模板示例行（'+String(rec.name||rec.custName||rec.company||rec.prodName||rec.agent||rec.agentName||'')+'…）已自动跳过');continue;}
        for(var n=0;n<NUM.length;n++){var kk=NUM[n];rec[kk]=parseFloat(rec[kk])||0;}
        rec.cat=(rec.cat==='oem'||rec.cat==='Oem')?'OEM':rec.cat;
        if(!rec.name){skip++;skipMsg.push('第'+(k+1)+'行：产品名称缺失');continue;}
        rec.perBox=parsePerBox(rec.spec)||40;rec.safeStock=0;
        db.products.push(rec);added++;
      }
      save();
      if(input)input.value='';
      alert(added?('成功导入 '+added+' 条产品'+(skip?('，跳过 '+skip+' 条：\n'+skipMsg.slice(0,5).join('\n')):'')):('未导入数据。\n'+(skipMsg.length?skipMsg.slice(0,5).join('\n'):'请检查表格内容')));
      render();
    }catch(e){console.log('导入失败',e);alert('导入失败：'+e.message);}
  };
  rd.readAsArrayBuffer(f);
}

/* 产品订单表单：产品名称 / 规格候选严格限定在「当前所选产品分类」范围内（选自销不出现 OEM，反之亦然） */
var PRODO_FCAT='',PRODO_FNAME='';
function prodoCatProds(cat){return db.products.filter(function(p){return p.cat===cat;});}
function prodoNameOpts(cat){
  var s={};prodoCatProds(cat).forEach(function(p){if(p.name)s[p.name]=1;});
  return pySortArr(Object.keys(s));
}
function prodoSpecOpts(cat,name){
  var s={};prodoCatProds(cat).forEach(function(p){if(p.spec&&(!name||p.name===name))s[p.spec]=1;});
  return pySortArr(Object.keys(s));
}
function prodoFillProdOpts(catChanged){
  var selEl=document.querySelector('#mBody select[data-k="cat"]');
  var cat=selEl?selEl.value:PRODO_FCAT;
  PRODO_FCAT=cat;
  var nmEl=document.querySelector('#mBody input[data-k="name"]');
  var spEl=document.querySelector('#mBody input[data-k="spec"]');
  var nm=nmEl?String(nmEl.value||'').trim():'';
  /* 切换分类后，已填的产品名称/规格若不属于新分类则清空，避免张冠李戴 */
  if(catChanged&&nm&&!prodoCatProds(cat).some(function(p){return p.name===nm;})){nmEl.value='';nm='';}
  var dln=document.getElementById('dl_name');
  if(dln)dln.innerHTML=prodoNameOpts(cat).map(function(x){return '<option value="'+esc(x)+'">';}).join('');
  if(nm&&spEl&&spEl.value&&!prodoCatProds(cat).some(function(p){return p.name===nm&&p.spec===spEl.value;}))spEl.value='';
  var dls=document.getElementById('dl_spec');
  if(dls)dls.innerHTML=prodoSpecOpts(cat,nm).map(function(x){return '<option value="'+esc(x)+'">';}).join('');
}
