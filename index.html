<style>

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--txt);font-size:14px}

.btn:hover{border-color:var(--blue);color:var(--blue)}

.tabs{display:flex;gap:6px;flex-wrap:wrap}

.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}

.bar-row{display:flex;align-items:center;gap:9px;margin-bottom:9px;font-size:12.5px}
.bar-row .bl{width:110px;text-align:right;color:var(--sub);flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .bt{flex:1;background:#eef2f7;border-radius:4px;height:18px;position:relative}
.bar-row .bf{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#60a5fa,#2563eb)}

.a-red{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}

.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px 16px}

.fitem label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:5px}
.fitem label b{color:var(--red)}
.fitem input,.fitem select,.fitem textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:13.5px;font-family:inherit;background:#fff}
.fitem input:focus,.fitem select:focus,.fitem textarea:focus{outline:none;border-color:var(--blue)}
.fitem input[readonly]{background:#f8fafc;color:var(--sub)}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.photo-box{border:1px dashed var(--line);border-radius:6px;padding:8px;text-align:center;cursor:pointer;color:var(--sub);font-size:12.5px;min-height:56px;display:flex;align-items:center;justify-content:center;gap:8px;background:#fafbfc}
.photo-box img{max-height:52px;max-width:100%;border-radius:4px}
.err{border-color:var(--red)!important}
.search{padding:7px 11px;border:1px solid var(--line);border-radius:6px;font-size:13px;width:190px}
.photo-thumb{width:44px;height:34px;object-fit:cover;border-radius:4px;cursor:zoom-in;border:1px solid var(--line)}
.big-photo-mask{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:200;display:none;align-items:center;justify-content:center;cursor:zoom-out}
.big-photo-mask.show{display:flex}
.big-photo-mask img{max-width:92%;max-height:92%}
.mono{font-family:Consolas,monospace}
.sec-title{font-size:13px;font-weight:600;color:var(--sub);margin:4px 0 10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.two{grid-template-columns:1fr}}
.fgroup{grid-column:1/-1;margin-top:4px;padding:7px 10px;background:#f0f5ff;border-radius:6px;font-size:12.5px;font-weight:600;color:var(--blue)}
.flt{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;margin-left:2px;border-radius:4px;cursor:pointer;font-size:11px;color:var(--sub);vertical-align:middle;user-select:none}
.flt:hover{background:#e0e7ff;color:var(--blue)}
.flt.on{background:var(--blue);color:#fff}
.flt-pop{position:fixed;z-index:300;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(15,23,42,.14);padding:8px;min-width:170px}
.flt-pop .flt-opt{padding:7px 11px;border-radius:6px;cursor:pointer;font-size:13px}
.flt-pop .flt-opt:hover{background:#f1f5f9}
.flt-pop .flt-opt.on{background:#dbeafe;color:var(--blue-d);font-weight:600}
.flt-pop .flt-input{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px;margin-bottom:7px}
.flt-pop .flt-input:focus{outline:none;border-color:var(--blue)}
.flt-pop .row{display:flex;gap:6px;align-items:center;justify-content:space-between}
.tbl-foot{padding:9px 12px;border-top:1px solid var(--line);color:var(--sub);font-size:12px}
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
/* ================= 苹果风增强：马卡龙渐变 / 毛玻璃 / 圆角 / 移动端 ================= */
html,body{max-width:100%;overflow-x:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","SF Pro Text","PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;background:linear-gradient(180deg,#f5f8fc 0%,#edf2f8 100%);-webkit-font-smoothing:antialiased}
.main{min-width:0}
.sidebar{background:linear-gradient(180deg,#23344d 0%,#16202f 100%)}
.sidebar .logo small{color:#8fa4c4}
.nav a{gap:10px;border-left:none;border-radius:12px;margin:2px 9px;padding:10px 13px;color:#aeb9c9;transition:all .18s}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.active{background:linear-gradient(90deg,var(--accent-g2) 0%,var(--accent) 100%);color:#fff;box-shadow:0 5px 14px rgba(0,0,0,.22)}
.nav .nav-ic{font-size:17px;width:22px;text-align:center;flex-shrink:0}
.nav .badge{margin-left:auto}
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.74);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(231,236,243,.85);padding:13px 24px}
.topbar h2{font-size:17px;letter-spacing:.3px}
.topbar h2::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--accent-g1),var(--accent));margin-right:9px;vertical-align:2px}
.card{border:none;border-radius:var(--r);box-shadow:var(--shadow);background:linear-gradient(180deg,var(--accent-soft) 0%,rgba(255,255,255,.99) 12%,rgba(255,255,255,.995) 100%)}
.card .card-hd{background:linear-gradient(90deg,var(--accent-soft) 0%,rgba(251,253,255,0) 78%);border-bottom:1px solid var(--line);border-radius:var(--r) var(--r) 0 0;padding:13px 18px}
.card .card-hd h3{font-size:14.5px;color:#33415a}
.card .card-bd{padding:16px 18px}
.btn{border-radius:999px;border:1px solid #e3e9f1;box-shadow:0 1px 2px rgba(60,80,110,.05);transition:all .18s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:linear-gradient(135deg,var(--accent-g1) 0%,var(--accent) 60%,var(--accent-d) 100%);border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(60,80,110,.18)}
.btn.pri:hover{background:linear-gradient(135deg,var(--accent) 0%,var(--accent-d) 100%);color:#fff;box-shadow:0 6px 18px rgba(60,80,110,.24)}
.btn.sm{border-radius:9px}
.btn.dgr:hover{border-color:var(--red);color:var(--red)}
.tabs span{border-radius:999px;border:1px solid transparent;transition:all .18s}
.tabs span:hover{border-color:var(--accent);color:var(--accent)}
.tabs span.on{background:linear-gradient(135deg,var(--accent-g1) 0%,var(--accent) 100%);color:#fff;box-shadow:0 3px 10px rgba(60,80,110,.16)}
.bar-row .bt{border-radius:6px;background:#eef2f7}
.bar-row .bf{display:block;border-radius:6px;background:linear-gradient(90deg,var(--accent-g1),var(--accent))}
th{background:#f6f9fc}
tr:hover td{background:#f6faff}
/* 列表隔行斑马纹：同色系更淡的标注，方便观看 */
tbody tr:nth-child(even) td{background:var(--accent-soft)}
tbody tr:nth-child(even):hover td{background:#f6faff}
/* 同一订单/发货单多行明细分组标识 */
tbody tr.grp-hd td{background:#e5eefb;border-top:2px solid #2F5597;border-bottom:1px solid #c9d8f2;color:#1d4ed8;font-weight:700;font-size:12px}
tbody tr.grp-hd:hover td{background:#e5eefb}
tbody tr.grp td{background:#f2f7ff}
tbody tr.grp:hover td{background:#f6faff}
.grp-hd .mono{font-weight:700}
.fitem input,.fitem select,.fitem textarea{border-radius:10px;border-color:#e4eaf2;background:#fbfcfe}
.fitem input:focus,.fitem select:focus,.fitem textarea:focus{border-color:var(--accent);background:#fff}
.fgroup{background:var(--accent-soft);color:var(--accent-d);border-radius:8px}
.flt.on{background:var(--accent);color:#fff}
.flt:hover{background:var(--accent-soft);color:var(--accent)}
.flt-pop{border-radius:14px;box-shadow:0 12px 36px rgba(30,45,70,.16)}
.flt-pop .flt-opt.on{background:var(--accent-soft);color:var(--accent-d)}
.mask{background:rgba(30,40,60,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.modal{border-radius:20px;box-shadow:0 24px 60px rgba(30,45,70,.28)}
/* 首页 hero 回款任务卡 */
.hero-card{position:relative;border-radius:22px;padding:22px 24px;margin-bottom:16px;color:#fff;overflow:hidden;background:linear-gradient(135deg,var(--accent-g1) 0%,var(--accent) 60%,var(--accent-d) 100%);box-shadow:0 10px 26px rgba(60,80,110,.16)}
.hero-card::after{content:"";position:absolute;right:-60px;top:-70px;width:230px;height:230px;border-radius:50%;background:rgba(255,255,255,.14)}
.hero-card::before{content:"";position:absolute;right:70px;bottom:-90px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;position:relative;z-index:1}
.hero-lb{font-size:12.5px;opacity:.88;letter-spacing:1.5px}
.hero-target{font-size:34px;font-weight:800;margin-top:4px;letter-spacing:.5px}
.hero-target small{font-size:14px;font-weight:600;opacity:.85}
.hero-right{flex-shrink:0}
.hero-badge{padding:6px 13px;border-radius:999px;font-size:12px;font-weight:700;display:inline-block}
.hero-badge.ok{background:rgba(255,255,255,.94);color:var(--accent-d)}
.hero-badge.warn{background:rgba(255,255,255,.22);color:#fff;border:1px solid rgba(255,255,255,.55)}
.hero-progress{position:relative;z-index:1;margin-top:18px}
.hp-track{height:12px;border-radius:999px;background:rgba(255,255,255,.3);overflow:hidden}
.hp-fill{height:100%;border-radius:999px;background:rgba(255,255,255,.95);transition:width .5s ease}
.hp-meta{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;opacity:.96}
.hp-meta b{font-size:15px}
.hero-foot{position:relative;z-index:1;margin-top:12px;display:flex;gap:8px;justify-content:flex-end}
.btn.ghost{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.42);color:#fff}
.btn.ghost:hover{background:rgba(255,255,255,.3);color:#fff}
/* 待办明细 */
.todo-add{display:flex;gap:8px;margin-bottom:12px}
.todo-add input{flex:1;border-radius:999px;padding:9px 16px;border:1px solid var(--line);background:#f6f9fc;font-size:14px;min-width:0}
.todo-add input:focus{outline:none;border-color:var(--accent);background:#fff}
.todo-list{display:flex;flex-direction:column;gap:6px}
.todo-item{display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:13px;background:linear-gradient(90deg,var(--accent-soft) 0%,#f8fafc 60%);border:1px solid #eef2f7;transition:all .25s}
.todo-box{width:24px;height:24px;border-radius:8px;border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:800;cursor:pointer;background:#fff;flex-shrink:0;transition:all .2s}
.todo-box:hover{background:var(--accent-soft)}
.todo-item.done{opacity:.55;background:#f1f4f8;order:10}
.todo-item.done .todo-box{background:var(--accent);border-color:var(--accent)}
.todo-item.done .todo-txt{text-decoration:line-through;color:var(--sub)}
.todo-txt{flex:1;font-size:13.5px;word-break:break-all}
.todo-del{font-size:12px;color:var(--sub);cursor:pointer;padding:2px 9px;border-radius:999px}
.todo-del:hover{color:var(--red);background:#fdeaea}
/* 动态表 */
.dyn-tool{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.dyn-tool label{font-size:12.5px;color:var(--sub)}
.dyn-tool select{padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:13px;color:var(--txt)}
.dyn-tool .sub2{font-size:12px;color:var(--sub);margin-left:auto}
/* 年度产品销量动态波浪线（产品名称 + 年度总销量） */
.wave-svg{width:100%;height:auto;display:block}
.wave-area{opacity:0;animation:waveFade 1.2s ease-out .3s forwards}
@keyframes waveFade{to{opacity:1}}
.wave-line{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100;stroke-dashoffset:100;animation:waveDraw 1.6s ease-out forwards}
.wave-flow{fill:none;stroke:#fff;stroke-width:3.4;stroke-linecap:round;stroke-dasharray:5 45;stroke-dashoffset:0;animation:waveFlow 3s linear infinite;opacity:.75}
@keyframes waveDraw{to{stroke-dashoffset:0}}
@keyframes waveFlow{from{stroke-dashoffset:0}to{stroke-dashoffset:-50}}
.wave-dot{transform-box:fill-box;transform-origin:center;animation:waveDot 2.6s ease-in-out infinite}
@keyframes waveDot{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.5);opacity:1}}
.wave-xl{font-size:10.5px;fill:#8a94a6}
.wave-hit{cursor:pointer}

<script>
/* ================= 存储 ================= */
var DB_KEY='pharmaSalesWorkbench';
var DB_TABLES=['customers','products','batches','orders','shipments','payments','logs','prodOrders','develop','todos'];
var db=load();
function ensureStruct(d){
  for(var i=0;i<DB_TABLES.length;i++)if(!Array.isArray(d[DB_TABLES[i]]))d[DB_TABLES[i]]=[];
  if(typeof d.seq!=='number')d.seq=1;
  return d;
}
function load(){
  try{var d=JSON.parse(localStorage.getItem(DB_KEY));if(d&&d.orders)return ensureStruct(d);}catch(e){}
  return ensureStruct({customers:[],products:[],batches:[],orders:[],shipments:[],payments:[],logs:[],prodOrders:[],develop:[],seq:1});
}
/* 清0批次直接删除：库存为0的批次不保留（保存时自动清理） */
function purgeZeroBatches(){
  var n=0;
  db.batches=db.batches.filter(function(b){
    var p=findProd(b.pid);
    var per=p?prodPerBox(p):(Number(b.perBox)||40);
    if((Number(b.boxes)||0)*per+(Number(b.units)||0)>0)return true;
    n++;return false;
  });
  return n;
}
function save(){purgeZeroBatches();db._t=Date.now();try{localStorage.setItem(DB_KEY,JSON.stringify(db));}catch(e){alert('保存失败：本地存储空间已满（照片过多）。请删除部分含照片的记录后再试。');}pushCloud();}
/* ---- 数据救援：覆盖前自动备份本地数据，防止误覆盖丢失 ---- */
function backupLocal(){
  try{
    var raw=localStorage.getItem(DB_KEY);
    if(raw){localStorage.setItem(DB_KEY+'_bk',raw);}
  }catch(e){}
}
function restoreBackup(){
  try{
    var bk=localStorage.getItem(DB_KEY+'_bk');
    if(bk){
      var d=JSON.parse(bk);
      if(d&&d.orders){
        var n=Object.keys(d).length;
        if(confirm('将恢复本地自动备份的数据（订单 '+d.orders.length+' 条等）。\n恢复会覆盖本设备当前数据，确定继续？')){
          db=d;localStorage.setItem(DB_KEY,bk);render();alert('已从本地自动备份恢复！');
          return true;
        }
      }else{alert('本地自动备份不存在或已损坏。');}
    }else{alert('本地自动备份不存在。');}
  }catch(e){alert('恢复失败：'+e.message);}
  return false;
}
/* ============ 云同步（GitHub Gist 免费通道，0 资源点消耗，浏览器直连无需云函数） ============ */
var GIST_ID='ecdef7144b996b73a00b570a5387da2c';
var GIST_FILE='workbench.json';
var DEFAULT_TOKEN=''; // 不内置 token（防公开页面泄漏被 GitHub 吊销）；首次在设置页输入，存本机 localStorage
var GIST_URL='https://api.github.com/gists/'+GIST_ID;
var CLOUD_ON=false,cloudReady=false,cloudPulling=false;
var _dirty=false,_uploading=false;
function getToken(){try{return localStorage.getItem('gh_token')||DEFAULT_TOKEN;}catch(e){return DEFAULT_TOKEN;}}
function initCloud(){
  CLOUD_ON=true;cloudReady=true;
  if(!getToken()){cloudStatus('未配置同步 Token，请到设置页粘贴');return;}
  pullCloud();
}
function cloudStatus(txt){
  var el=document.getElementById('cloudTip');
  if(el)el.textContent=txt||'云同步未开启';
  var el2=document.getElementById('setCloudTip');
  if(el2)el2.textContent=txt||'云同步未开启';
}
function localIsEmpty(){
  return db.orders.length===0&&db.customers.length===0&&db.products.length===0
    &&db.batches.length===0&&db.payments.length===0&&db.shipments.length===0
    &&db.prodOrders.length===0&&db.develop.length===0;
}
var MERGE_KEYS=['orders','customers','products','batches','payments','shipments','prodOrders','develop','logs','todos'];
/* 多设备安全合并：按 id 取并集，冲突保留记录级 _t 较大者；
   保证手机/电脑并发录入互不覆盖、记录不丢失（同 id 只保留一边，云端缺失的本地记录会补回云端） */
function mergeCloud(cloud){
  var any=false;
  MERGE_KEYS.forEach(function(k){
    var lm={},cm={},ids={};
    (db[k]||[]).forEach(function(r){if(r&&r.id){lm[r.id]=r;ids[r.id]=1;}});
    (cloud[k]||[]).forEach(function(r){if(r&&r.id){cm[r.id]=r;ids[r.id]=1;}});
    var out=[],changed=false;
    Object.keys(ids).forEach(function(id){
      var lr=lm[id],cr=cm[id];
      if(lr&&!cr)out.push(lr);                     // 本地独有：保留（并会随推送回传云端）
      else if(cr&&!lr){out.push(cr);changed=true;} // 云端独有：并入本地
      else{                                        // 两边都有：取记录级 _t 较大者，都不带 _t 则保留本地
        var lt=Number(lr._t)||0,ct=Number(cr._t)||0;
        if(ct>lt){out.push(cr);changed=true;}else out.push(lr);
      }
    });
    if(changed||out.length!==(db[k]||[]).length){db[k]=out;any=true;}
  });
  var cs=Number(cloud.seq)||0;
  if(cs> (Number(db.seq)||0)){db.seq=cs;any=true;}
  return any;
}
function pullCloud(){
  if(!cloudReady||cloudPulling)return;
  cloudPulling=true;
  fetch(GIST_URL,{method:'GET',headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+getToken()}})
  .then(function(r){return r.json().then(function(d){return {ok:r.ok,status:r.status,data:d};});})
  .then(function(res){
    cloudPulling=false;
    var d=res.data;
    if(!res.ok){
      console.log('云拉取失败',res.status,d&&d.message);
      cloudStatus('云同步未连接');
      if(_dirty)flushPush();
      return;
    }
    var content=d&&d.files&&d.files[GIST_FILE]&&d.files[GIST_FILE].content;
    if(content){
      var cloud;
      try{cloud=JSON.parse(content);}catch(e){cloud=null;}
      if(cloud&&Array.isArray(cloud.orders)){
        var ct=Number(cloud._t)||0,lt=Number(db._t)||0;
        backupLocal(); // 合并前备份本地数据（救援保险）
        ensureStruct(cloud);
        var changed=mergeCloud(cloud);
        var newT=Math.max(lt,ct);
        if(newT>lt){db._t=newT;changed=true;}
        if(changed){
          try{localStorage.setItem(DB_KEY,JSON.stringify(db));}catch(e){}
          var modalOpen=false;try{modalOpen=document.getElementById('mask').classList.contains('show');}catch(e){}
          if(!modalOpen)render();
          _dirty=true;flushPush(); // 合并结果回传云端，两端保持一致（内容含云端全部记录，不会丢数据）
          cloudStatus('已合并同步 · '+new Date().toLocaleTimeString('zh-CN',{hour12:false}));
        }else{
          cloudStatus('已连接云端 · '+new Date().toLocaleTimeString('zh-CN',{hour12:false}));
        }
      }else{cloudStatus('已连接云端');}
    }else{
      // 云端还没有数据：本地有数据则首次上传建库
      if(!localIsEmpty())flushPush();
      cloudStatus('已连接云端');
    }
    if(_dirty)flushPush();
  }).catch(function(e){
    cloudPulling=false;console.log('云拉取失败',e);
    cloudStatus('云同步未连接');
    if(_dirty)flushPush();
  });
}
/* ---- 多设备自动同步：每20秒静默拉取一次；窗口切回前台时立即拉取 ---- */
function autoPull(){
  if(!cloudReady||_uploading||cloudPulling)return;
  pullCloud();
}
setInterval(autoPull,20000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)autoPull();});
window.addEventListener('focus',function(){autoPull();});
function pushRow(){
  db._t=Date.now();
  return fetch(GIST_URL,{
    method:'PATCH',
    headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+getToken(),'Content-Type':'application/json'},
    body:JSON.stringify({files:{'workbench.json':{content:JSON.stringify(db)}}})
  }).then(function(r){return r.json().then(function(d){return {ok:r.ok,status:r.status,data:d};});}).then(function(res){
    if(!res.ok)throw new Error((res.data&&res.data.message)||('HTTP '+res.status));
  });
}
function pushCloud(){
  // 每次保存都标记待上传并立即触发（无防抖），保证每次改动都会同步到云端
  if(!cloudReady)return;
  _dirty=true;
  flushPush();
}
function flushPush(){
  if(!cloudReady||cloudPulling||_uploading)return;
  _dirty=false;
  _uploading=true;
  pushRow().then(function(){
    _uploading=false;
    cloudStatus('已同步云端 · '+new Date().toLocaleTimeString('zh-CN',{hour12:false}));
    if(_dirty)flushPush(); // 上传期间又有新改动，继续补传
  }).catch(function(e){
    _uploading=false;
    console.log('云上传失败',e);
    cloudStatus('云同步失败');
    if(_dirty)setTimeout(flushPush,2000); // 失败自动重试，确保最终上传
  });
}
function flushNow(){
  // 页面关闭前的兜底上传，确保最后一次改动也同步到云端
  if(!cloudReady)return;
  try{
    fetch(GIST_URL,{
      method:'PATCH',keepalive:true,
      headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+getToken(),'Content-Type':'application/json'},
      body:JSON.stringify({files:{'workbench.json':{content:JSON.stringify(db)}}})
    }).catch(function(){});
  }catch(e){}
}
window.addEventListener('pagehide',function(){if(_dirty||_uploading)flushNow();});
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function fmtN(n){return (Number(n)||0).toLocaleString('zh-CN',{maximumFractionDigits:2});}
function p2(n){return n<10?'0'+n:''+n;}
function today(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function ym(s){return (s||'').slice(0,7);}
function curYm(){return today().slice(0,7);}
function daysTo(dstr){if(!dstr)return 99999;return Math.ceil((new Date(dstr)-new Date(today()))/86400000);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* ================= 导航 ================= */
var MODULES=[
  {key:'dash',name:'首页',i:'🏠'},
  {key:'order',name:'销售订单',i:'🧾'},
  {key:'pay',name:'回款明细',i:'💰'},
  {key:'prodo',name:'产品订单',i:'🏭'},
  {key:'stock',name:'销售库存',i:'📦'},
  {key:'dev',name:'新品开发',i:'🚀'},
  {key:'log',name:'工作记录',i:'📝'},
  {key:'ship',name:'物流明细',i:'🚚'},
  {key:'cust',name:'客户档案',i:'👥'},
  {key:'prod',name:'产品档案',i:'💊'},
  {key:'set',name:'设置',i:'⚙️'}
];
function getMod(key){for(var i=0;i<MODULES.length;i++)if(MODULES[i].key===key)return MODULES[i];return MODULES[0];}
var cur='dash', viewState={};

function renderNav(){
  var alerts=allAlerts();
  var n=alerts.filter(function(a){return a.lv==='red'||a.lv==='org';}).length;
  var h='';
  MODULES.forEach(function(m){
    var b=(m.key==='dash'&&n>0)?'<span class="badge">'+n+'</span>':'';
    h+='<a data-k="'+m.key+'" class="'+(cur===m.key?'active':'')+'"><span class="nav-ic">'+m.i+'</span><span>'+m.name+'</span>'+b+'</a>';
  });
  document.getElementById('nav').innerHTML=h;
  var as=document.querySelectorAll('#nav a');
  for(var i=0;i<as.length;i++)as[i].onclick=function(){cur=this.dataset.k;render();};
}
function setPage(m,cb){
  renderNav();
  document.getElementById('pageTitle').textContent=m.name;
  document.getElementById('todayStr').textContent=today()+' 星期'+'日一二三四五六'[new Date().getDay()];
  var al=allAlerts();var red=al.filter(function(a){return a.lv==='red';}).length;
  document.getElementById('alertTips').innerHTML=red>0?'<b onclick="cur=\'dash\';render();">'+red+' 项红色预警，点击查看</b>':'当前无红色预警';
  cb(document.getElementById('content'));
}
function render(){
  document.body.setAttribute('data-mod',cur);
  var box=document.getElementById('content');
  if(cur==='dash')renderDash(box);
  else if(cur==='cust')renderCust(box);
  else if(cur==='prod')renderProd(box);
  else if(cur==='prodo')renderProdo(box);
  else if(cur==='stock')renderStock(box);
  else if(cur==='order')renderOrder(box);
  else if(cur==='ship')renderShip(box);
  else if(cur==='pay')renderPay(box);
  else if(cur==='dev')renderDev(box);
  else if(cur==='log')renderLog(box);
  else if(cur==='set')renderSet(box);
}

/* ================= 联动计算 ================= */
function prodLabel(p){return p?p.name+' '+p.spec:'';}
function findProd(id){for(var i=0;i<db.products.length;i++)if(db.products[i].id===id)return db.products[i];return null;}
/* 件装量解析：规格最后一组数为件装量，如 12*2*300 → 300盒/件 */
function parsePerBox(spec){
  var m=String(spec||'').match(/(\d+(?:\.\d+)?)/g);
  if(!m)return 0;
  var n=Math.floor(parseFloat(m[m.length-1]));
  return (n>=10&&n<=20000)?n:0;
}
/* 产品件装量：优先取规格末组数，其次取档案存储值，兜底40 */
function prodPerBox(p){
  if(!p)return 40;
  return parsePerBox(p.spec)||Number(p.perBox)||40;
}
function findCust(id){for(var i=0;i<db.customers.length;i++)if(db.customers[i].id===id)return db.customers[i];return null;}
function stockUnits(pid){var s=0;var p=findProd(pid);var per=prodPerBox(p);for(var i=0;i<db.batches.length;i++)if(db.batches[i].pid===pid)s+=db.batches[i].boxes*per+db.batches[i].units;return s;}
function stockText(pid){var p=findProd(pid);if(!p)return '0盒';var u=stockUnits(pid);var per=prodPerBox(p);return Math.floor(u/per)+'件'+u%per+'盒';}
/* 回款关联的发货单号列表（支持一笔回款对应多笔订单，单号间用逗号/空格分隔） */
function payNos(r){var s=String((r&&(r.shipNo||r.orderNo))||'');return s.split(/[,，、;；\s]+/).filter(function(x){return x;});}
function orderPaid(no){var s=0,n=String(no);for(var i=0;i<db.payments.length;i++){if(payNos(db.payments[i]).indexOf(n)>=0)s+=Number(db.payments[i].amount)||0;}return s;}
function orderShipped(no){var s=0;for(var i=0;i<db.shipments.length;i++)if(db.shipments[i].orderNo===no)s+=Number(db.shipments[i].totalUnits)||0;return s;}
function orderNeed(o){var p=findProd(o.pid);return (Number(o.qtyBoxes)||0)*prodPerBox(p)+(Number(o.qtyUnits)||0);}
/* 未回款金额按整单（同订单号多行合并）计算，供首页预警使用 */
function orderDue(o){
  var total=0;
  db.orders.forEach(function(x){if(x.no===o.no)total+=(Number(x.amount)||0)-(Number(x.rebate)||0)-(Number(x.refund)||0);});
  return total-orderPaid(o.no);
}
/* 订单状态：自动匹配回款明细——有匹配回款即已回款，无匹配即未回款（一笔订单可对应多笔回款，如预付款+尾款） */
function orderStatus(o){
  if(orderPaid(o.no)>0)return {t:'已回款',c:'ok'};
  return {t:'未回款',c:'warn'};
}
function custCatTag(c){var map={'省总':'c1','大包商':'c2','零散客户':'c3'};return '<span class="tag '+(map[c]||'c1')+'">'+esc(c)+'</span>';}

function allAlerts(){
  var arr=[];
  for(var i=0;i<db.batches.length;i++){
    var b=db.batches[i],_bp=findProd(b.pid),left=b.boxes*(_bp?prodPerBox(_bp):(Number(b.perBox)||1))+b.units;if(left<=0)continue;
    var d=daysTo(b.expire);
    if(d<=90&&d>-1)arr.push({lv:d<60?'red':'org',txt:'近效期预警：'+prodLabel(findProd(b.pid))+' 批号 '+b.batchNo+' 剩余 '+left+' 盒，距有效期至 '+b.expire+' 仅剩 '+d+' 天'});
  }
  /* 有库存批次记录的产品才做低库存提醒（库存清零/未录入时不刷屏） */
  var hasBatchPid={};
  for(var hb=0;hb<db.batches.length;hb++)hasBatchPid[db.batches[hb].pid]=1;
  for(var j=0;j<db.products.length;j++){
    var p=db.products[j];
    if(!hasBatchPid[p.id])continue;
    var u=stockUnits(p.id),per=prodPerBox(p),jian=Math.floor(u/per);
    var lowBy50=jian<50;
    var lowBySafe=u<=(Number(p.safeStock)||0);
    if(lowBy50||lowBySafe)arr.push({lv:'org',txt:'低库存提醒：'+prodLabel(p)+' 当前 '+jian+' 件 / '+u+' 盒（低于 50 件'+(p.safeStock?('，安全库存 '+p.safeStock+' 盒'):'')+'）'});
  }
  for(var k=0;k<db.orders.length;k++){
    var o=db.orders[k],need=orderNeed(o),sh=orderShipped(o.no),due=orderDue(o);
    if(sh<need){
      var late=(o.shipDate||'')<today()?'（发货日期 '+o.shipDate+' 已过）':'';
      arr.push({lv:'yel',txt:'订单预警：订单 '+o.no+'（'+o.custName+'，'+o.prodLabel+'）已发 '+sh+' 盒，待发 '+(need-sh)+' 盒'+late});
    }
    if(due>0.01)arr.push({lv:'red',txt:'未回款：订单 '+o.no+'（'+o.custName+'）未回款 '+fmtN(due)+' 元'});
  }
  /* 月度回款任务：完成率是否达 85% */
  var target=Number(db.payTarget)||PAY_TARGET;
  var _cur=curYm(),got=0;
  for(var t=0;t<db.payments.length;t++)if(ym(db.payments[t].payDate)===_cur)got+=Number(db.payments[t].amount)||0;
  var pct=target>0?got/target*100:0;
  if(target>0&&pct<85)arr.push({lv:'org',txt:'月度回款任务：本月已回款 '+fmtN(got)+' 元，完成率 '+pct.toFixed(1)+'%，未达 85%（目标 '+fmtN(target)+' 元）'});
  for(var m=0;m<db.develop.length;m++){
    var dv=db.develop[m];
    if(dv.done)continue;
    var dAg=dv.custName||dv.customer||'',dNm=dv.name||'';
    if(dv.nextVisit&&dv.nextVisit<=today()){
      arr.push({lv:'yel',txt:'新品待回访：客户 '+dAg+' 的「'+dNm+'」回访日期 '+dv.nextVisit+' 已到/已过期，请及时跟进'});
    }else if(dv.orderDate&&daysTo(dv.orderDate)<=-30&&(dv.contract||'')!=='已完成'){
      arr.push({lv:'yel',txt:'新品开发跟进：客户 '+dAg+' 的「'+dNm+'」订单日期 '+dv.orderDate+' 已超 30 天，合同尚未完成'});
    }
  }
  for(var lg=0;lg<db.logs.length;lg++){
    var lw=db.logs[lg];
    if(lw.done||!lw.planDate)continue;
    if(daysTo(lw.planDate)<=0)arr.push({lv:'yel',txt:'工作记录到期：'+(lw.custName||lw.customer||'')+' 的「'+(lw.content||'').slice(0,20)+'」预计完成时间 '+lw.planDate+' 已到/已过期'});
  }
  return arr;
}

/* ================= 通用智能表格（自动序号 / 列筛选 / 合计行 / 排序辅助） ================= */
var PROD_CAT_ORDER={'自销':0,'OEM':1};
var colFilterState={},colFilterData={},_colFltEl=null;
function zhCmp(a,b){return String(a==null?'':a).localeCompare(String(b==null?'':b),'zh-Hans-CN');}
function dateDescCmp(a,b){return (a||'')>(b||'')?-1:((a||'')<(b||'')?1:0);}
/* 取列的显示值（去掉 HTML 标签，用于筛选匹配） */
function colVal(col,row){
  var v=col.fmt?col.fmt(row):row[col.key];
  return String(v==null?'':v).replace(/<[^>]*>/g,'');
}
function smartFiltered(mod,cols,rows){
  var st=colFilterState[mod]||{};
  for(var k in st){
    var fv=st[k];if(!fv)continue;
    var col=null;
    for(var i=0;i<cols.length;i++)if(cols[i].key===k)col=cols[i];
    if(!col)continue;
    rows=rows.filter(function(x){return colVal(col,x).indexOf(fv)>=0;});
  }
  return rows;
}
/* 智能表格：第一列自动序号；每列 ▾ 筛选；末行合计（列配 sum:true 或 sumFn） */
function smartTableHTML(mod,cols,rows,actionsFn,redraw,grp){
  colFilterData[mod]={cols:cols,rows:rows||[],redraw:redraw||null};
  rows=smartFiltered(mod,cols,(rows||[]).slice());
  var st=colFilterState[mod]||{};
  if(!rows.length){
    var fany=false;for(var kk in st)if(st[kk])fany=true;
    return '<div class="empty">'+(fany?'当前筛选条件下暂无数据，可点击列头 ▾ 清除筛选':'暂无数据，请点击右上角"新增"录入')+'</div>';
  }
  var colTotal=cols.length+1+(actionsFn?1:0);
  var gcnt={};
  if(grp&&grp.key){for(var q=0;q<rows.length;q++){var gk=grp.key(rows[q]);gcnt[gk]=(gcnt[gk]||0)+1;}}
  var h='<div class="tbl-scroll"><table><thead><tr><th style="width:44px">序号</th>';
  for(var i=0;i<cols.length;i++){
    var on=st[cols[i].key]?' on':'';
    h+='<th>'+cols[i].label+' <span class="flt'+on+'" onclick="openColFilter(\''+mod+'\',\''+cols[i].key+'\',this)" title="筛选">▾</span></th>';
  }
  if(actionsFn)h+='<th style="width:130px">操作</th>';
  h+='</tr></thead><tbody>';
  var lastG=null;
  for(var r=0;r<rows.length;r++){
    var ck=(grp&&grp.key)?grp.key(rows[r]):null;
    if(ck!=null&&gcnt[ck]>1){
      if(ck!==lastG){
        var grs=rows.filter(function(x){return grp.key(x)===ck;});
        h+='<tr class="grp-hd"><td colspan="'+colTotal+'">'+grp.head(grs,ck)+'</td></tr>';
        lastG=ck;
      }
      h+='<tr class="grp"><td>'+(r+1)+'</td>';
    }else{
      lastG=ck;
      h+='<tr><td>'+(r+1)+'</td>';
    }
    for(var c=0;c<cols.length;c++){var cd=cols[c];h+='<td>'+(cd.fmt?cd.fmt(rows[r]):esc(rows[r][cd.key]==null?'':rows[r][cd.key]))+'</td>';}
    if(actionsFn)h+='<td>'+actionsFn(rows[r])+'</td>';
    h+='</tr>';
  }
  h+='</tbody><tfoot><tr><td><b>合计</b></td>';
  for(var c2=0;c2<cols.length;c2++){
    var cc=cols[c2];
    if(cc.sum===true)h+='<td><b>'+fmtN(sumCol(rows,cc.key))+'</b></td>';
    else if(cc.sumFn)h+='<td><b>'+cc.sumFn(rows)+'</b></td>';
    else if(c2===0)h+='<td>共 '+rows.length+' 条</td>';
    else h+='<td></td>';
  }
  if(actionsFn)h+='<td></td>';
  h+='</tr></tfoot></table></div>';
  return h;
}
function colFltPos(dv,btn){
  var r=btn.getBoundingClientRect();
  dv.style.top=(r.bottom+6)+'px';
  dv.style.left=Math.min(r.left,Math.max(6,window.innerWidth-260))+'px';
}
function openColFilter(mod,key,btn){
  closeColFilter();
  var ctx=colFilterData[mod];if(!ctx)return;
  var col=null;for(var i=0;i<ctx.cols.length;i++)if(ctx.cols[i].key===key)col=ctx.cols[i];
  if(!col)return;
  var cur=(colFilterState[mod]||{})[key]||'';
  var vals={},keys=[];
  for(var j=0;j<ctx.rows.length;j++){
    var v=colVal(col,ctx.rows[j]);
    if(v===''||v==='—'||vals[v])continue;
    vals[v]=1;keys.push(v);
  }
  keys.sort(function(a,b){return a.localeCompare(b,'zh-Hans-CN');});
  var dv=document.createElement('div');
  dv.className='flt-pop';dv.id='colFltPop';
  if(keys.length&&keys.length<=12){
    var inner='<div class="flt-opt'+(cur===''?' on':'')+'" data-v="">全部</div>';
    for(var k=0;k<keys.length;k++)inner+='<div class="flt-opt'+(cur===keys[k]?' on':'')+'" data-v="'+esc(keys[k])+'">'+esc(keys[k])+'</div>';
    dv.innerHTML=inner;
    document.body.appendChild(dv);
    colFltPos(dv,btn);
    dv.querySelectorAll('.flt-opt').forEach(function(el){
      el.onclick=function(){
        if(!colFilterState[mod])colFilterState[mod]={};
        colFilterState[mod][key]=this.dataset.v;
        closeColFilter();
        if(ctx.redraw)ctx.redraw();
      };
    });
  }else{
    dv.innerHTML='<input class="flt-input" id="colFltInput" placeholder="输入内容过滤…" value="'+esc(cur)+'"><div class="row"><button class="btn sm" onclick="clearColFilter(\''+mod+'\',\''+key+'\')">清除</button><button class="btn sm pri" onclick="closeColFilter()">完成</button></div>';
    document.body.appendChild(dv);
    colFltPos(dv,btn);
    var inp=document.getElementById('colFltInput');
    inp.focus();
    inp.oninput=function(){
      if(!colFilterState[mod])colFilterState[mod]={};
      colFilterState[mod][key]=this.value;
      if(ctx.redraw)ctx.redraw();
    };
    inp.onkeydown=function(e){if(e.key==='Enter')closeColFilter();};
  }
  _colFltEl=dv;
}
function clearColFilter(mod,key){
  if(colFilterState[mod])colFilterState[mod][key]='';
  closeColFilter();
  var ctx=colFilterData[mod];
  if(ctx&&ctx.redraw)ctx.redraw();
}
function closeColFilter(){if(_colFltEl){_colFltEl.remove();_colFltEl=null;}}
document.addEventListener('click',function(e){
  if(_colFltEl&&!e.target.closest('#colFltPop')&&!e.target.closest('.flt'))closeColFilter();
});
/* 按日期倒序 → 代理商拼音 → 客户名称拼音 排序 */
function sortDateAgentCust(rows,dateKey,agFn,cuFn){
  rows.sort(function(a,b){
    var d=dateDescCmp(dateKey(a),dateKey(b));
    if(d)return d;
    var g=zhCmp(agFn(a),agFn(b));
    if(g)return g;
    return zhCmp(cuFn(a),cuFn(b));
  });
  return rows;
}
/* 按产品分类（自销→OEM）排序 */
function prodCatIdx(c){return PROD_CAT_ORDER[c]!==undefined?PROD_CAT_ORDER[c]:9;}
function custCatIdx(c){return CAT_ORDER[c]!==undefined?CAT_ORDER[c]:9;}

/* ================= 弹窗表单引擎 ================= */
var mFields=[],mSave=null,mPhotoVals={};
function openForm(title,fields,values,onSave){
  document.getElementById('mTitle').textContent=title;
  mFields=fields;mSave=onSave;mPhotoVals={};
  var h='';
  for(var i=0;i<fields.length;i++){
    var f=fields[i],v=(values&&values[f.key]!=null)?values[f.key]:(f.def!=null?f.def:'');
    if(f.group){h+='<div class="fgroup">'+esc(f.group)+'</div>';continue;}
    h+='<div class="fitem '+(f.full?'full':'')+'"><label>'+f.label+(f.required?' <b>*</b>':'')+'</label>';
    if(f.type==='select'){
      var opts=typeof f.options==='function'?f.options():f.options;
      h+='<select data-k="'+f.key+'"'+(f.onchange?' onchange="'+f.onchange+'(this)"':'')+(f.readonly?' disabled':'')+'>';
      h+='<option value="">请选择</option>';
      for(var o=0;o<opts.length;o++){var it=opts[o];var val=it.v!=null?it.v:it,txt=it.t!=null?it.t:it;
        h+='<option value="'+esc(val)+'"'+(String(v)===String(val)?' selected':'')+'>'+esc(txt)+'</option>';}
      h+='</select>';
    }else if(f.type==='textarea'){
      h+='<textarea data-k="'+f.key+'" placeholder="'+esc(f.ph||'')+'">'+esc(v)+'</textarea>';
    }else if(f.type==='photo'){
      h+='<div class="photo-box" data-k="'+f.key+'" onclick="pickPhoto(this)">点击拍照/上传</div><input type="file" accept="image/*" capture="environment" style="display:none">';
    }else{
      var attrs='data-k="'+f.key+'"';
      if(f.ph)attrs+=' placeholder="'+esc(f.ph)+'"';
      if(f.readonly)attrs+=' readonly';
      if(f.type==='number')attrs+=' step="any"';
      if(f.oninput)attrs+=' oninput="'+f.oninput+'(this)"';
      if(f.datalist){
        var dl=typeof f.datalist==='function'?f.datalist():f.datalist;
        var dlId='dl_'+f.key;
        h+='<input type="text" list="'+dlId+'" '+attrs+' value="'+esc(v)+'"><datalist id="'+dlId+'">';
        for(var d=0;d<dl.length;d++)h+='<option value="'+esc(dl[d])+'">';
        h+='</datalist>';
      }else{
        h+='<input type="'+(f.type||'text')+'" '+attrs+' value="'+esc(v)+'">';
      }
    }
    if(f.hint)h+='<div class="hint">'+f.hint+'</div>';
    if(f.errhint)h+='<div class="errhint">'+f.errhint+'</div>';
    h+='</div>';
  }
  document.getElementById('mBody').innerHTML=h;
  document.getElementById('mask').classList.add('show');
}
function pickPhoto(box){
  var fi=box.nextElementSibling;
  fi.onchange=function(){
    if(!fi.files||!fi.files[0])return;
    compressPhoto(fi.files[0],function(dataUrl){
      mPhotoVals[box.dataset.k]=dataUrl;
      box.innerHTML='<img src="'+dataUrl+'"><span>重新上传</span>';
    });
  };
  fi.click();
}
function compressPhoto(file,cb){
  var rd=new FileReader();
  rd.onload=function(){
    var img=new Image();
    img.onload=function(){
      var max=900,w=img.width,h=img.height;
      if(w>max){h=h*max/w;w=max;}
      var cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      cb(cv.toDataURL('image/jpeg',0.68));
    };
    img.src=rd.result;
  };
  rd.readAsDataURL(file);
}
function submitModal(){
  var vals={},ok=true;
  for(var i=0;i<mFields.length;i++){
    var f=mFields[i],v;
    if(f.type==='photo'){v=mPhotoVals[f.key]||'';vals[f.key]=v;}
    else{
      var el=document.querySelector('[data-k="'+f.key+'"]');
      if(!el)continue;
      v=el.value;
      vals[f.key]=(f.type==='number')?(parseFloat(v)||0):v;
    }
    var empty=(v===''||v==null)||(f.type==='number'&&f.required&&(!v||v===0)&&f.minZero!==false);
    if(f.required&&f.type!=='number'&&empty){markErr(f.key);ok=false;continue;}
    if(f.required&&f.type==='number'&&f.minZero&&(!v||v===0)){markErr(f.key);ok=false;continue;}
  }
  if(!ok){alert('请填写所有必填项（标 * 的字段）');return;}
  mSave(vals);
}
function markErr(k){var el=document.querySelector('[data-k="'+k+'"]');if(el){el.classList.add('err');setTimeout(function(){el.classList.remove('err');},1600);}}
function closeModal(){document.getElementById('mask').classList.remove('show');}

  for(var i=0;i<cols.length;i++)h+='<th style="background:#dbeafe">'+cols[i].label+'</th>';
  h+='</tr>';
  for(var r=0;r<rows.length;r++){
    h+='<tr>';
    for(var c=0;c<cols.length;c++){var cd=cols[c];h+='<td>'+esc(cd.fmt?cd.fmt(rows[r]):rows[r][cd.key])+'</td>';}
    h+='</tr>';
  }
  h+='</table>';
  var blob=new Blob(['\ufeff<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head></head><body>'+h+'</body></html>'],{type:'application/vnd.ms-excel'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=moduleName+'_'+today()+'.xls';a.click();
}
/* ================= 数据备份 / 恢复（多设备同步用） ================= */
function backupData(){
  var payload={app:'evaWorkbench',ver:2,exported:new Date().toISOString(),data:db};
  var blob=new Blob([JSON.stringify(payload)],{type:'application/json'});

function waveNiceMax(v){if(v<=5)return 5;var p=Math.pow(10,Math.floor(Math.log(v)/Math.LN10));var n=v/p;var s=n<=1?1:n<=2?2:n<=5?5:10;return s*p;}
/* Catmull-Rom 平滑曲线转贝塞尔路径（波浪效果） */
function waveSmoothPath(pts){
  if(!pts.length)return '';
  if(pts.length<3)return 'M'+pts.map(function(q){return q[0]+' '+q[1];}).join(' L');
  var d='M'+pts[0][0]+' '+pts[0][1];
  for(var i=0;i<pts.length-1;i++){
    var p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];
    var c1x=p1[0]+(p2[0]-p0[0])/6,c1y=p1[1]+(p2[1]-p0[1])/6;
    var c2x=p2[0]-(p3[0]-p1[0])/6,c2y=p2[1]-(p3[1]-p1[1])/6;
    d+=' C'+c1x.toFixed(1)+' '+c1y.toFixed(1)+' '+c2x.toFixed(1)+' '+c2y.toFixed(1)+' '+p2[0]+' '+p2[1];
  }

}

/* 点击产品 → 放大查看该产品年度明细（月度销量 / 客户分布 / 金额）；OEM 为代理商维度 */
function waveDetail(cat,idx){
  var c=WAVE_CACHE[cat];if(!c)return;
  var row=c.rows[idx];if(!row)return;
  if(cat==='OEM'){oemAgentDetail(row.agent,c.year);return;}
  var p=row.p,y=c.year,per=prodPerBox(p);
  /* 订单映射：orderNo+pid → 订单行（取客户） */
  var omap={};
  for(var i=0;i<db.orders.length;i++){var o=db.orders[i];if(!omap[o.no+'|'+o.pid])omap[o.no+'|'+o.pid]=o;}
  /* 金额 / 订单笔数：直接按该产品当年订单行统计（避免同单多次发货重复计金额） */
  var amt=0,ocnt=0,oseen={},agents={};
  function agGet(an){if(!agents[an])agents[an]={jian:0,amt:0,custs:{}};return agents[an];}
  function cuGet(ag,cn){if(!ag.custs[cn])ag.custs[cn]={jian:0,amt:0};return ag.custs[cn];}
  for(var o2=0;o2<db.orders.length;o2++){
    var oo=db.orders[o2];
    if(oo.pid!==p.id||(oo.shipDate||'').slice(0,4)!==y)continue;
    amt+=Number(oo.amount)||0;
    if(!oseen[oo.no]){oseen[oo.no]=1;ocnt++;}
    var oan=oo.agentName||'（未关联代理商）';
    var ocn=oo.custName||oo.agentName||'（未关联客户）';
    var ag1=agGet(oan);
    ag1.amt+=Number(oo.amount)||0;
    cuGet(ag1,ocn).amt+=Number(oo.amount)||0;
  }
  /* 该产品当年全部发货（与图表口径一致，用于月度/代理商客户件数） */
  var months=[],mMax=0,units=0,ret=0;
  for(var m=0;m<12;m++)months.push(0);
  for(var s=0;s<db.shipments.length;s++){
    var sh=db.shipments[s];
    if(sh.pid!==p.id||(sh.shipDate||'').slice(0,4)!==y)continue;
    var u=Number(sh.totalUnits)||0,mm=Number((sh.shipDate||'').slice(5,7))||0,jian=0;
    if(mm>=1&&mm<=12){jian=Math.floor(u/per);months[mm-1]+=jian;if(months[mm-1]>mMax)mMax=months[mm-1];}
    units+=u;
    if(u<0)ret+=u;
    var od=omap[sh.orderNo+'|'+p.id]||{};
    var san=od.agentName||'（未关联代理商）';
    var scn=od.custName||od.agentName||'（未关联客户）';
    var ag2=agGet(san);
    ag2.jian+=jian;cuGet(ag2,scn).jian+=jian;
  }
  /* 代理商列表：按总销量降序；每个代理商内客户按销量降序 */
  var agList=[];
  for(var k2 in agents){
    var a=agents[k2],cl=[];
    for(var k3 in a.custs){var cu=a.custs[k3];if(cu.jian!==0||cu.amt)cl.push({name:k3,jian:cu.jian,amt:cu.amt});}
    cl.sort(function(x,y2){return y2.jian-x.jian;});
    if(a.jian!==0||a.amt)agList.push({name:k2,jian:a.jian,amt:a.amt,custs:cl});
  }
  agList.sort(function(x,y2){return y2.jian-x.jian;});
  /* 弹窗内容 */
  var g1=cat==='自销'?'linear-gradient(90deg,#60a5fa,#2563eb)':'linear-gradient(90deg,#fdba74,#f97316)';
  var h='<div class="wd-grid">'
    +'<div><div class="k">产品规格</div><div class="v">'+esc(p.spec||'—')+'</div></div>'
    +'<div><div class="k">产品分类 / 代理商</div><div class="v" style="font-size:13px">'+esc(cat)+(p.agent?' · '+esc(p.agent):'')+'</div></div>'
    +'<div><div class="k">'+y+' 年总销量</div><div class="v"><b>'+fmtN(row.total)+'</b> 件（'+fmtN(units)+' 盒）</div></div>'
    +'<div><div class="k">年度发货金额</div><div class="v">'+fmtN(amt)+' 元</div></div>'
    +'<div><div class="k">涉及订单</div><div class="v">'+ocnt+' 笔</div></div>'
    +'<div><div class="k">退货冲回</div><div class="v" style="font-size:13px">'+(ret<0?fmtN(ret)+' 盒':'无')+'</div></div>'
    +'</div>';
  h+='<div class="wd-sec">月度销量走势<span class="sub">单位：件</span></div>';
  if(mMax>0){
    for(var b=0;b<12;b++){
      h+='<div class="bar-row"><span class="bl" style="width:44px">'+(b+1)+'月</span><span class="bt"><span class="bf" style="width:'+Math.max(0,months[b]/mMax*100)+'%;background:'+g1+'"></span></span><span class="bv" style="width:70px">'+months[b]+' 件</span></div>';
    }
  }else h+='<div class="empty" style="padding:10px">暂无月度数据</div>';
  /* 客户分布：仅自销 —— 按代理商总销量排序，组内列出下游客户明细 */
  if(cat!=='OEM'&&agList.length){
    var aMax=Math.max.apply(null,agList.map(function(x){return Math.abs(x.jian)||1;}))||1;
    var cMax=1;
    for(var a2=0;a2<agList.length;a2++)for(var c3=0;c3<agList[a2].custs.length;c3++)if(Math.abs(agList[a2].custs[c3].jian)>cMax)cMax=Math.abs(agList[a2].custs[c3].jian);
    h+='<div class="wd-sec">代理商 · 下游客户分布<span class="sub">按代理商总销量排序</span></div>';
    var shown=0;
    for(var a3=0;a3<agList.length&&shown<10;a3++){
      var ag=agList[a3];
      if(agList.length>10&&a3===9)break;
      h+='<div class="wd-ag-hd"><span class="an" title="'+esc(ag.name)+'">'+esc(ag.name)+'</span><span class="as">合计 <b>'+ag.jian+'</b> 件 · '+fmtN(ag.amt)+' 元 · '+ag.custs.length+' 个客户</span></div>';
      h+='<div class="bar-row"><span class="bl" style="width:0"></span><span class="bt"><span class="bf" style="width:'+Math.max(0,Math.abs(ag.jian)/aMax*100)+'%;background:'+g1+'"></span></span><span class="bv" style="width:0"></span></div>';
      for(var c4=0;c4<ag.custs.length;c4++){
        var cu2=ag.custs[c4];
        h+='<div class="bar-row wd-sub"><span class="bl" title="'+esc(cu2.name)+'">'+esc(cu2.name)+'</span><span class="bt"><span class="bf" style="width:'+Math.max(0,Math.abs(cu2.jian)/cMax*100)+'%;background:'+g1+';opacity:.55"></span></span><span class="bv">'+cu2.jian+' 件 · '+fmtN(cu2.amt)+' 元</span></div>';
      }
      shown++;
    }
    if(agList.length>10)h+='<div class="wd-tip">…仅显示销量前 10 个代理商，共 '+agList.length+' 个</div>';
  }
  document.getElementById('wdTitle').textContent=p.name+'（'+y+' 年 '+cat+'）';
  document.getElementById('wdBody').innerHTML=h;
  document.getElementById('wdMask').classList.add('show');
}

  var opt=years.map(function(yy){return '<option'+(yy===y?' selected':'')+'>'+yy+'</option>';}).join('');

/* 客户表单候选项：取客户档案中已有记录（可按客户分类 + 代理商过滤），去重后按首字母排序 */
function custDLOpts(key,cat,agent){
  agent=agent?String(agent).trim():'';
  var seen={},out=[];
  db.customers.forEach(function(c){
    if(cat&&c.cat!==cat)return;
    if(agent&&String(c.agent||'').trim()!==agent)return;
    var v=c[key];if(!v||seen[v])return;seen[v]=1;out.push(v);
  });
  out.sort(function(a,b){return a.localeCompare(b,'zh-Hans-CN');});
  return out;
}
function custDLHTML(key,cat,agent){
  return custDLOpts(key,cat,agent).map(function(v){return '<option value="'+esc(v)+'">';}).join('');
}

/* 导入 Excel（支持模板 .xlsx 与导出的 .xls） */
function importCustExcel(input){
  var f=input.files&&input.files[0];if(!f)return;
  if(!window.XLSX){alert('Excel解析库未加载，请检查网络后刷新重试');return;}
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var wb=XLSX.read(new Uint8Array(rd.result),{type:'array'});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var json=XLSX.utils.sheet_to_json(ws,{header:1});
      var headRow=-1,headMap={};
      for(var i=0;i<json.length;i++){
        var row=json[i];if(!row||!row.length)continue;
        if(row.join(',').indexOf('客户分类')>=0||row.join(',').indexOf('客户名称')>=0){headRow=i;break;}
      }
      if(headRow<0){alert('未识别到表头，请先点击"模板"下载模板按格式填写');return;}
      var map={'客户分类':'cat','代理商':'agent','客户名称':'company','收货人':'contact','联系电话':'phone','收货地址':'addr','配送要求':'delivery','邮寄收件人':'mailContact','邮寄电话':'mailPhone','邮寄地址':'mailAddr','备注':'note'};
      var head=json[headRow];
      for(var j=0;j<head.length;j++){
        var hc=String(head[j]==null?'':head[j]).trim();
        if(map[hc])headMap[j]=map[hc];
      }
      var added=0,skip=0;
      for(var k=headRow+1;k<json.length;k++){
        var rr=json[k];if(!rr)continue;
        var rec={id:uid(),created:today()},any=false;
        for(var c in headMap){
          rec[headMap[c]]=String(rr[c]==null?'':rr[c]).trim();
          if(rec[headMap[c]])any=true;
        }
        if(!any)continue;
        if(rec.cat&&rec.cat!=='省总'&&rec.cat!=='大包商'&&rec.cat!=='零散客户'){skip++;continue;}
        if(!rec.company){skip++;continue;}
        rec.cat=rec.cat||'零散客户';
        db.customers.push(rec);added++;
      }
      save();
      if(input)input.value='';
      alert(added?('成功导入 '+added+' 条客户'+(skip?('，跳过 '+skip+' 条无效行'):'')):('未导入数据，请检查格式'+(skip?('（跳过 '+skip+' 条无效行）'):'')));
      render();
    }catch(e){console.log('导入失败',e);alert('导入失败：'+e.message);}
  };
  rd.readAsArrayBuffer(f);
}
/* 下载客户档案导入模板 */
function downCustTpl(){
  var headers=['客户分类','代理商','客户名称','收货人','联系电话','收货地址','配送要求','邮寄收件人','邮寄电话','邮寄地址','备注'];
  var example=['省总','示例代理商','示例客户','张三','13800138000','北京市朝阳区XX路1号','物流','李四','13900139000','上海市浦东新区XX路2号',''];
  if(window.XLSX){
    var ws=XLSX.utils.aoa_to_sheet([headers,example]);
    var wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'客户档案模板');
    XLSX.writeFile(wb,'客户档案导入模板_'+today()+'.xlsx');
  }else{
    var h='<meta charset="utf-8"><title>客户档案模板</title><table border="1"><tr>';
    headers.forEach(function(l){h+='<th style="background:#dbeafe">'+l+'</th>';});
    h+='</tr><tr>';
    example.forEach(function(v){h+='<td>'+esc(v)+'</td>';});
    h+='</tr></table>';
    var blob=new Blob(['\ufeff<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head></head><body>'+h+'</body></html>'],{type:'application/vnd.ms-excel'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='客户档案导入模板_'+today()+'.xls';a.click();
  }
}

function filterStock(){
  var rows=db.batches.slice().sort(function(a,b){return (b.inDate||'')<(a.inDate||'')?-1:1;});
  var q=(document.getElementById('stockSearch')||{}).value||'';
  if(q)rows=rows.filter(function(b){
    var p=findProd(b.pid)||{};
    return ((p.name||'')+(p.spec||'')+(b.batchNo||'')+(p.agent||'')+(p.brand||'')+(p.cat||'')).indexOf(q)>=0;
  });
  return rows;
}
/* 数量换算：总盒数/件装量 → x件y盒 */
function stockQtyText(b){
  var p=findProd(b.pid);
  var per=p?prodPerBox(p):(Number(b.perBox)||1);
  var t=(Number(b.boxes)||0)*per+(Number(b.units)||0);
  return Math.floor(t/per)+'件'+(t%per)+'盒';
}

/* 入库表单：bid 为批次id则编辑该条库存记录 */
function openInForm(bid){
  var b=bid?db.batches.filter(function(x){return x.id===bid;})[0]:null;
  var bp=b?findProd(b.pid):null;
  var fields=[
    {key:'cat',label:'产品分类',type:'select',required:true,options:[{v:'自销',t:'自销'},{v:'OEM',t:'OEM'}],onchange:'stockCatSel'},
    {key:'pid',label:'产品名称',type:'select',required:true,options:[],onchange:'stockProdSel',hint:'只列出产品档案中与所选分类一致的产品'},
    {key:'spec',label:'规格',readonly:true},
    {key:'totalUnits',label:'数量（总盒数）',type:'number',required:true,minZero:true,ph:'如 1000',hint:'按件装量自动换算为 x件y盒'},
    {key:'batchNo',label:'批号',required:true},
    {key:'expire',label:'有效期至',type:'date',required:true},
    {key:'agent',label:'代理商',readonly:true},
    {key:'brand',label:'商标',readonly:true},
    {key:'note',label:'备注',full:true}
  ];
  var vals=b?{cat:(bp&&(bp.cat==='自销'||bp.cat==='OEM'))?bp.cat:'',pid:b.pid,spec:bp?bp.spec:'',totalUnits:(Number(b.boxes)||0)*(bp?prodPerBox(bp):(Number(b.perBox)||1))+(Number(b.units)||0),batchNo:b.batchNo,expire:b.expire,agent:bp?bp.agent:'',brand:bp?bp.brand:'',note:b.note}:{};
  openForm(b?'编辑库存记录':'新增入库',fields,vals,function(v){
    var p=findProd(v.pid);
    if(!p){markErr('pid');alert('请选择产品名称');return;}
    var per=prodPerBox(p);
    var t=Math.floor(Number(v.totalUnits)||0);
    if(!(t>0)){markErr('totalUnits');alert('请填写数量（总盒数，大于0）');return;}
    var boxes=Math.floor(t/per),units=t%per;
    if(b){
      b.pid=v.pid;b.perBox=per;b.batchNo=v.batchNo;b.expire=v.expire;b.note=v.note;
      b.boxes=boxes;b.units=units;
    }else{
      db.batches.push({id:uid(),pid:v.pid,perBox:per,batchNo:v.batchNo,expire:v.expire,
        boxes:boxes,units:units,inBoxes:boxes,inUnits:units,inDate:today(),note:v.note});
    }
    save();closeModal();render();
  });
  // 初始化：按分类填充产品下拉，并联动自动字段
  stockCatSel(document.querySelector('[data-k="cat"]'));
  if(b){var ps=document.querySelector('[data-k="pid"]');if(ps)ps.value=b.pid;}
  stockProdSel(document.querySelector('[data-k="pid"]'));
  var qtyEl=document.querySelector('[data-k="totalUnits"]');
  if(qtyEl)qtyEl.oninput=stockCalcQty;
  stockCalcQty();
}

/* 选择产品 → 自动带出规格/代理商/商标并刷新数量换算 */
function stockProdSel(sel){
  var p=findProd(sel?sel.value:'');
  function set(k,v){var el=document.querySelector('[data-k="'+k+'"]');if(el)el.value=v||'';}
  set('spec',p?p.spec:'');
  set('agent',p?p.agent:'');
  set('brand',p?p.brand:'');
  stockCalcQty();
}
/* 数量换算：总盒数/件装量 → 整数件 + 剩余盒 */
function stockCalcQty(){
  var pidSel=document.querySelector('[data-k="pid"]');
  var qtyEl=document.querySelector('[data-k="totalUnits"]');
  if(!qtyEl)return;
  var hintEl=qtyEl.parentNode?qtyEl.parentNode.querySelector('.hint'):null;
  var p=pidSel?findProd(pidSel.value):null;
  if(!hintEl)return;
  if(!p){hintEl.textContent='按件装量自动换算为 x件y盒';return;}
  var per=prodPerBox(p);
  var t=Math.floor(Number(qtyEl.value)||0);

/* 库存导入 Excel（支持模板 .xlsx 与导出的 .xls） */
function importStockExcel(input){
  var f=input.files&&input.files[0];if(!f)return;
  if(!window.XLSX){alert('Excel解析库未加载，请检查网络后刷新重试');return;}
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var wb=XLSX.read(new Uint8Array(rd.result),{type:'array'});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var json=XLSX.utils.sheet_to_json(ws,{header:1});
      var headRow=-1,headMap={};
      for(var i=0;i<json.length;i++){
        var row=json[i];if(!row||!row.length)continue;
        if(row.join(',').indexOf('产品名称')>=0||row.join(',').indexOf('批号')>=0){headRow=i;break;}
      }
      if(headRow<0){alert('未识别到表头，请先点击"模板"下载模板按格式填写');return;}
      var map={'产品分类':'cat','产品名称':'name','规格':'spec','批号':'batchNo','数量':'qty','有效期至':'expire','代理商':'agent','商标':'brand'};
      var head=json[headRow];
      for(var j=0;j<head.length;j++){
        var hc=String(head[j]==null?'':head[j]).trim();
        if(map[hc])headMap[j]=map[hc];
      }
      var added=0,skip=0,skipMsg=[];
      for(var k=headRow+1;k<json.length;k++){
        var rr=json[k];if(!rr)continue;
        var rec={},any=false;
        for(var c in headMap){
          var v=String(rr[c]==null?'':rr[c]).trim();
          rec[headMap[c]]=v;
          if(v)any=true;
        }
        if(!any)continue;
        if(rec.cat!=='自销'&&rec.cat!=='OEM'){skip++;skipMsg.push('第'+(k+1)+'行：产品分类需为 自销 或 OEM');continue;}
        if(!rec.name){skip++;skipMsg.push('第'+(k+1)+'行：产品名称缺失');continue;}
        if(!rec.batchNo){skip++;skipMsg.push('第'+(k+1)+'行：批号缺失');continue;}
        if(!rec.expire){skip++;skipMsg.push('第'+(k+1)+'行：有效期至缺失');continue;}
        // 数量支持"3件100盒"、"1000盒"、"1000"三种写法
        var m=String(rec.qty||'').match(/^(\d+)\s*件\s*(\d+)?\s*盒?$/);
        var t=0;
        if(m){
          var p0=findProdByNameCat(rec.name,rec.cat);
          var per=p0?prodPerBox(p0):1;
          t=(parseInt(m[1],10)||0)*per+(parseInt(m[2]||'0',10)||0);
        }else{
          var m2=String(rec.qty||'').match(/^(\d+)\s*盒?$/);
          if(m2)t=parseInt(m2[1],10)||0;
        }
        if(!(t>0)){skip++;skipMsg.push('第'+(k+1)+'行：数量无法识别（如 3件100盒 或 1000）');continue;}
        // 匹配产品档案：同分类+同名称（规格有值时优先精确匹配）
        var p=findProdByNameCat(rec.name,rec.cat,rec.spec);
        if(!p){skip++;skipMsg.push('第'+(k+1)+'行：产品档案中未找到「'+rec.cat+'」分类下名称为「'+rec.name+'」的产品，请先在产品档案中新增');continue;}
        var per2=prodPerBox(p);
        var boxes=Math.floor(t/per2),units=t%per2;
        db.batches.push({id:uid(),pid:p.id,perBox:per2,batchNo:rec.batchNo,expire:rec.expire,
          boxes:boxes,units:units,inBoxes:boxes,inUnits:units,inDate:today(),note:''});
        added++;
      }
      save();
      if(input)input.value='';
      alert(added?('成功导入 '+added+' 条库存'+(skip?('，跳过 '+skip+' 条：\n'+skipMsg.slice(0,5).join('\n')):'')):('未导入数据。\n'+(skipMsg.length?skipMsg.slice(0,5).join('\n'):'请检查表格内容')));
      render();
    }catch(e){console.log('导入失败',e);alert('导入失败：'+e.message);}
  };
  rd.readAsArrayBuffer(f);
}
/* 按分类+名称(+规格)匹配产品档案 */
function findProdByNameCat(name,cat,spec){
  var list=db.products.filter(function(p){return p.cat===cat&&p.name===name;});
  if(spec&&list.length>1){
    var exact=list.filter(function(p){return p.spec===spec;});
    if(exact.length)return exact[0];
  }
  return list[0]||null;
}

/* 批号下拉选项：来自该产品当前有库存的批次（近效期在前），编辑时保留原批号 */
function orderBatchOpts(pid,keep){
  var p=findProd(pid),per=prodPerBox(p);
  var bs=db.batches.filter(function(b){return b.pid===pid;})
    .filter(function(b){return (Number(b.boxes)||0)*per+(Number(b.units)||0)>0;});
  bs.sort(function(a,b){if(a.expire<b.expire)return -1;if(a.expire>b.expire)return 1;return String(a.batchNo||'')<String(b.batchNo||'')?-1:1;});
  var h='<option value="">选择批号</option>',found=false;
  for(var i=0;i<bs.length;i++){var b=bs[i],u=(Number(b.boxes)||0)*per+(Number(b.units)||0);
    if(keep&&keep===b.batchNo)found=true;
    h+='<option value="'+esc(b.batchNo)+'"'+(keep===b.batchNo?' selected':'')+'>'
      +esc(b.batchNo+'（库存'+u+'盒，效期'+(b.expire||'—')+'）')+'</option>';}
  if(keep&&!found)h='<option value="'+esc(keep)+'" selected>'+esc(keep+'（当前无库存）')+'</option>'+h;
  return h;
}

function orderItemCalc(i){
  var it=OF.items[i];if(!it)return;
  it.qty=parseFloat(itF(i,'qty'))||0;
  it.basePrice=parseFloat(itF(i,'basePrice'))||0;
  it.supplyPrice=parseFloat(itF(i,'supplyPrice'))||0;
  it.invoicePrice=parseFloat(itF(i,'invoicePrice'))||0;
  it.amount=r2(it.invoicePrice*it.qty);
  if(!it.taxManual)it.tax=payTaxCalc(it.invoicePrice,it.supplyPrice,it.qty);
  if(!it.refundManual)it.refund=r2((it.invoicePrice-it.supplyPrice)*it.qty-it.tax);
  it.rebatePer=parseFloat(itF(i,'rebatePer'))||0;
  it.rebate=it.rebateOn?r2(it.rebatePer*it.qty):0;
  itSet(i,'amount',it.amount||'');
  if(!it.refundManual)itSet(i,'refund',it.refund||'');
  itSet(i,'rebate',it.rebate||'');
  if(!it.taxManual)itSet(i,'tax',it.tax||'');
}

function delOrder(id){  var o=db.orders.filter(function(x){return x.id===id;})[0];if(!o)return;
  var others=db.orders.filter(function(x){return x.no===o.no&&x.id!==id;}).length;
  var sh=db.shipments.filter(function(s){return s.orderNo===o.no;}).length;
  var py=db.payments.filter(function(s){return s.orderNo===o.no;}).length;
  var msg=others>0?('该订单号下还有 '+others+' 条其他产品行，本次仅删除这一行「'+(o.prodLabel||'')+'」。确定？')
    :('删除订单 '+o.no+' 将同时删除其 '+sh+' 条发货、'+py+' 条回款记录（库存不受影响）。确定？');
  if(!confirm(msg))return;
  db.orders=db.orders.filter(function(x){return x.id!==id;});
  if(!others){
    db.shipments=db.shipments.filter(function(x){return x.orderNo!==o.no;});
    db.payments=db.payments.filter(function(x){return x.orderNo!==o.no&&x.shipNo!==o.no;});
  }
  save();render();
}

/* 销售订单导入 Excel */
function importOrderExcel(input){
  var f=input.files&&input.files[0];if(!f)return;
  if(!window.XLSX){alert('Excel解析库未加载，请检查网络后刷新重试');return;}
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var wb=XLSX.read(new Uint8Array(rd.result),{type:'array'});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var json=XLSX.utils.sheet_to_json(ws,{header:1});
      var headRow=-1,headMap={};
      for(var i=0;i<json.length;i++){
        var row=json[i];if(!row||!row.length)continue;
        if(row.join(',').indexOf('代理商')>=0||row.join(',').indexOf('产品名称')>=0){headRow=i;break;}
      }
      if(headRow<0){alert('未识别到表头，请先点击"模板"下载模板按格式填写');return;}
      var map={'发货单号':'orderNo','代理商':'agentName','客户名称':'custName','发货日期':'shipDate','产品分类':'pcat','产品名称':'name','规格':'spec','批号':'batchNo',
        '数量（件）':'qtyBoxes','数量（盒）':'qtyUnits','底价':'basePrice','供货价':'supplyPrice','开票价':'invoicePrice','总金额':'amount','金额':'amount',
        '返利':'rebate','税金':'tax','返款':'refund','付款方式':'payMethod','备注':'note'};
      var head=json[headRow];
      for(var j=0;j<head.length;j++){
        var hc=String(head[j]==null?'':head[j]).trim();
        if(map[hc])headMap[j]=map[hc];
      }
      var NUM=['qtyBoxes','qtyUnits','basePrice','supplyPrice','invoicePrice','amount','rebate','tax','refund'];
      var added=0,healed=0,skip=0,skipMsg=[],shortMsg={};
      for(var k=headRow+1;k<json.length;k++){
        var rr=json[k];if(!rr)continue;
        var rec={},any=false;
        for(var c in headMap){
          var v=String(rr[c]==null?'':rr[c]).trim();
          rec[headMap[c]]=v;
          if(v)any=true;
        }
        if(!any)continue;
        for(var n=0;n<NUM.length;n++){var kk=NUM[n];rec[kk]=parseFloat(rec[kk])||0;}
        if(!rec.agentName){skip++;skipMsg.push('第'+(k+1)+'行：代理商缺失');continue;}
        if(!rec.name){skip++;skipMsg.push('第'+(k+1)+'行：产品名称缺失');continue;}
        if(!rec.shipDate){skip++;skipMsg.push('第'+(k+1)+'行：发货日期缺失');continue;}
        var pl=db.products.filter(function(x){return x.name===rec.name&&(!rec.spec||x.spec===rec.spec);});
        if(rec.pcat){var byCat=pl.filter(function(x){return x.cat===rec.pcat;});if(byCat.length)pl=byCat;}
        var p=pl[0];
        if(!p){skip++;skipMsg.push('第'+(k+1)+'行：产品档案中未找到「'+rec.name+(rec.spec?' '+rec.spec:'')+'」，请先在产品档案中新增');continue;}
        var per=prodPerBox(p);
        var need=(Number(rec.qtyBoxes)||0)*per+(Number(rec.qtyUnits)||0);
        /* 数量为负 = 退货入库（自动恢复库存），为正 = 发货出库 */
        if(!need){skip++;skipMsg.push('第'+(k+1)+'行：数量（盒）缺失');continue;}
        if(!rec.amount)rec.amount=Math.round(need*((Number(rec.invoicePrice)>0?Number(rec.invoicePrice):Number(rec.supplyPrice))||0)*100)/100;
        if(!rec.invoicePrice&&rec.amount&&need)rec.invoicePrice=r2(rec.amount/need);
        var cust=db.customers.filter(function(x){return x.company===rec.agentName;})[0]
          ||db.customers.filter(function(x){return x.agent===rec.agentName;})[0]
          ||null;
        var no=String(rec.orderNo||'').trim()||newOrderNo();
        var dup=db.orders.filter(function(x){return x.no===no&&x.pid===p.id&&x.batchNo===(rec.batchNo||'')&&x.qtyUnits===(Number(rec.qtyUnits)||0);})[0];
        if(dup){
          /* 已导入过：若该明细尚未生成物流明细，自动补生成并扣减/恢复库存（用于旧版模板导入后的补齐） */
          var sh=db.shipments.filter(function(x){return x.orderNo===dup.no&&x.pid===dup.pid&&x.batchNo===(rec.batchNo||'')&&Number(x.totalUnits)===need;})[0];
          if(!sh){var shrt=autoShipImported(dup.no,p,rec.batchNo,need,rec.shipDate);if(shrt>0)shortMsg[prodLabel(p)]=1;healed++;}
          else skip++;
          continue;
        }
        db.orders.push({id:uid(),no:no,agentId:cust?cust.id:'',agentName:rec.agentName,custName:rec.custName||rec.agentName,cat:cust?cust.cat:'',
          shipDate:rec.shipDate,pid:p.id,prodLabel:prodLabel(p),batchNo:rec.batchNo||'',qtyBoxes:Number(rec.qtyBoxes)||0,qtyUnits:Number(rec.qtyUnits)||0,
          basePrice:Number(rec.basePrice)||0,supplyPrice:Number(rec.supplyPrice)||0,invoicePrice:Number(rec.invoicePrice)||0,amount:Number(rec.amount)||0,
          rebate:Number(rec.rebate)||0,tax:Number(rec.tax)||0,refund:Number(rec.refund)||0,
          payMethod:rec.payMethod||'现款',note:rec.note||''});
        var shrt2=autoShipImported(no,p,rec.batchNo,need,rec.shipDate);
        if(shrt2>0)shortMsg[prodLabel(p)]=1;
        added++;
      }
      save();
      if(input)input.value='';
      var msg='';
      if(added)msg+='成功导入 '+added+' 条销售订单，已同步生成物流明细并扣减/恢复库存';
      if(healed)msg+=(msg?'\n':'')+'检测到 '+healed+' 条订单此前已导入但无物流明细，已自动补生成并扣减/恢复库存';
      if(skip)msg+=(msg?'\n':'')+'跳过 '+skip+' 条（重复或数据缺失）'+(skipMsg.length?('\n'+skipMsg.slice(0,5).join('\n')):'');
      var sk=Object.keys(shortMsg);
      if(sk.length)msg+='\n注意：以下产品库存不足，未能全额扣减：'+sk.join('、');
      if(!msg)msg='未导入数据。\n'+(skipMsg.length?skipMsg.slice(0,5).join('\n'):'请检查表格内容');
      alert(msg);
      render();
    }catch(e){console.log('导入失败',e);alert('导入失败：'+e.message);}
  };
  rd.readAsArrayBuffer(f);
}

/* 批次件装量：跟随产品档案规格解析 */
function batchPer(b){var p=findProd(b.pid);return p?prodPerBox(p):(Number(b.perBox)||1);}
/* 按效期先出（FIFO）扣减库存 */
function deductStock(pid,units){
  var log=[],need=units;
  var bs=db.batches.filter(function(b){return b.pid===pid;}).sort(function(a,b){return a.expire<b.expire?-1:(a.expire>b.expire?1:(a.batchNo<b.batchNo?-1:1));});
  for(var i=0;i<bs.length&&need>0;i++){
    var b=bs[i],per=batchPer(b),have=b.boxes*per+b.units;
    if(have<=0)continue;
    var take=Math.min(have,need);
    log.push({bid:b.id,units:take,pid:b.pid,batchNo:b.batchNo||'',expire:b.expire||''});
    need-=take;
  }
  return {log:log,shortage:need};
}
function applyDeduct(log){
  for(var i=0;i<log.length;i++){
    var b=db.batches.filter(function(x){return x.id===log[i].bid;})[0];if(!b)continue;
    var per=batchPer(b),t=log[i].units;
    var newTotal=Math.max(0,b.boxes*per+b.units-t);
    b.boxes=Math.floor(newTotal/per);
    b.units=newTotal%per;
  }
}
function restoreStock(log){
  for(var i=0;i<log.length;i++){
    var b=db.batches.filter(function(x){return x.id===log[i].bid;})[0];
    /* 清0批次可能已被自动清除：按日志中的批号信息重建，确保冲回不丢库存 */
    if(!b&&log[i].pid){
      b={id:uid(),pid:log[i].pid,batchNo:log[i].batchNo||'',boxes:0,units:0,expire:log[i].expire||''};
      db.batches.push(b);
    }
    if(!b)continue;
    var per=batchPer(b),t=log[i].units;
    var newTotal=b.boxes*per+b.units+t;
    b.boxes=Math.floor(newTotal/per);
    b.units=newTotal%per;
  }
}
/* 按批号优先扣减库存：先扣指定批号，不足部分按效期先出（FIFO）兜底 */
function deductStockBatch(pid,batchNo,units){
  var bs=db.batches.filter(function(b){return b.pid===pid;}).sort(function(a,b){return a.expire<b.expire?-1:(a.expire>b.expire?1:(a.batchNo<b.batchNo?-1:1));});
  if(batchNo){
    bs=bs.slice().sort(function(a,b){
      var am=a.batchNo===batchNo?0:1,bm=b.batchNo===batchNo?0:1;
      if(am!==bm)return am-bm;
      return a.expire<b.expire?-1:(a.expire>b.expire?1:0);
    });
  }
  var log=[],need=units;
  for(var i=0;i<bs.length&&need>0;i++){
    var b=bs[i],per=batchPer(b),have=b.boxes*per+b.units;
    if(have<=0)continue;
    var take=Math.min(have,need);
    log.push({bid:b.id,units:take,pid:b.pid,batchNo:b.batchNo||'',expire:b.expire||''});
    need-=take;
  }
  return {log:log,shortage:need};
}
/* 退货入库：恢复到指定批号（批次不存在则新建），返回可回滚日志（删除物流记录时会自动冲回） */
function restoreStockBatch(pid,batchNo,units){
  var b=db.batches.filter(function(x){return x.pid===pid&&x.batchNo===(batchNo||'');})[0];
  if(!b){
    b={id:uid(),pid:pid,batchNo:batchNo||'',boxes:0,units:0,expire:''};
    db.batches.push(b);
  }
  var per=batchPer(b),t=b.boxes*per+b.units+units;
  b.boxes=Math.floor(t/per);
  b.units=t%per;
  return [{bid:b.id,units:-units,pid:b.pid,batchNo:b.batchNo||'',expire:b.expire||''}];
}
/* 导入订单后自动生成物流明细：数量为正=发货出库（扣库存），为负=退货入库（恢复库存） */
function autoShipImported(no,p,batchNo,need,shipDate){
  var per=prodPerBox(p),dl=[],short=0;
  if(need>0){
    var res=deductStockBatch(p.id,batchNo,need);
    applyDeduct(res.log);dl=res.log;short=res.shortage;
  }else{
    dl=restoreStockBatch(p.id,batchNo,-need);
  }
  db.shipments.push({id:uid(),orderNo:no,shipDate:shipDate,pid:p.id,prodLabel:prodLabel(p),batchNo:batchNo||'',
    qtyBoxes:need>0?Math.floor(need/per):0,qtyUnits:need>0?(need%per):need,totalUnits:need,
    logistics:need>0?'':'退货入库',tracking:'',photo:'',deductLog:dl});
  return short;
}

/* 导入物流记录（按发货单号关联销售订单，自动扣减库存） */
function importShipExcel(input){
  var f=input.files&&input.files[0];if(!f)return;
  if(!window.XLSX){alert('Excel解析库未加载，请检查网络后刷新重试');return;}
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var wb=XLSX.read(new Uint8Array(rd.result),{type:'array'});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var json=XLSX.utils.sheet_to_json(ws,{header:1,raw:false});
      var headRow=-1,headMap={};
      for(var i=0;i<json.length;i++){
        var row=json[i];if(!row||!row.length)continue;
        if(row.join(',').indexOf('发货单号')>=0||row.join(',').indexOf('物流单号')>=0){headRow=i;break;}
      }
      if(headRow<0){alert('未识别到表头，请先点击"模板"下载模板按格式填写');return;}
      var map={'发货单号':'orderNo','发货日期':'shipDate','数量（件）':'qtyBoxes','数量(件)':'qtyBoxes','物流公司':'logistics','物流单号':'tracking'};
      var head=json[headRow];
      for(var j=0;j<head.length;j++){
        var hc=String(head[j]==null?'':head[j]).trim();
        if(map[hc])headMap[j]=map[hc];
      }
      function normDate(s){s=String(s||'').trim().replace(/[\/\.]/g,'-');var m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);return m?m[1]+'-'+(m[2].length<2?'0'+m[2]:m[2])+'-'+(m[3].length<2?'0'+m[3]:m[3]):s;}
      var added=0,skip=0,skipMsg=[];
      for(var k=headRow+1;k<json.length;k++){
        var rr=json[k];if(!rr)continue;
        var rec={};var any=false;
        for(var c in headMap){
          var v=String(rr[c]==null?'':rr[c]).trim();
          rec[headMap[c]]=v;if(v)any=true;
        }
        if(!any)continue;
        if(!rec.orderNo){skip++;skipMsg.push('第'+(k+1)+'行：发货单号缺失');continue;}
        var o=db.orders.filter(function(x){return x.no===rec.orderNo;})[0];
        if(!o){skip++;skipMsg.push('第'+(k+1)+'行：销售订单中不存在发货单号「'+rec.orderNo+'」，物流记录需关联销售订单');continue;}
        var existed=db.shipments.filter(function(s){return s.orderNo===rec.orderNo;})[0];
        if(existed){ // 已有记录：只更新物流信息
          if(rec.shipDate)existed.shipDate=normDate(rec.shipDate);
          if(rec.logistics)existed.logistics=rec.logistics;
          if(rec.tracking)existed.tracking=rec.tracking;
          added++;continue;
        }
        var per=prodPerBox(findProd(o.pid));
        var boxes=parseFloat(rec.qtyBoxes)||0;
        if(!(boxes>0)){skip++;skipMsg.push('第'+(k+1)+'行：数量（件）缺失');continue;}
        var need=boxes*per;
        var res=deductStock(o.pid,need);
        if(res.shortage>0){
          restoreStock(res.log);
          skip++;skipMsg.push('第'+(k+1)+'行：库存不足（需 '+need+' 盒），请先入库');continue;
        }
        applyDeduct(res.log);
        db.shipments.push({id:uid(),orderNo:o.no,shipDate:normDate(rec.shipDate)||today(),pid:o.pid,prodLabel:o.prodLabel,
          qtyBoxes:boxes,qtyUnits:0,totalUnits:need,logistics:rec.logistics||'',tracking:rec.tracking||'',photo:'',deductLog:res.log});
        added++;
      }
      save();
      if(input)input.value='';
      alert(added?('成功导入/更新 '+added+' 条物流记录'+(skip?('，跳过 '+skip+' 条：\n'+skipMsg.slice(0,5).join('\n')):'')):('未导入数据。\n'+(skipMsg.length?skipMsg.slice(0,5).join('\n'):'请检查表格内容')));
      render();
    }catch(e){console.log('导入失败',e);alert('导入失败：'+e.message);}
  };
  rd.readAsArrayBuffer(f);
}

/* ---- 记录访问器（兼容新旧数据结构） ---- */
function payType(r){if(r.type==='ship'||r.type==='prepay')return r.type;var ns=payNos(r);for(var i=0;i<ns.length;i++){if(orderShipped(ns[i])>0)return 'ship';}return 'prepay';}
function payYm(r){return r.ym||((r.payDate||'').slice(0,7));}
function payShipNo(r){return r.shipNo||r.orderNo||'';}
function payItems(r){
  var t=payType(r);
  if(t==='prepay'){
    if(r.items&&r.items.length)return r.items;
    return (r.name||r.spec)?[{name:r.name,spec:r.spec,qty:r.qty,supplyPrice:r.supplyPrice,invoicePrice:r.invoicePrice}]:[];
  }
  var nos=payNos(r),out=[];
  for(var i=0;i<nos.length;i++){
    var o=db.orders.filter(function(x){return x.no===nos[i];})[0];
    if(o){var p=findProd(o.pid)||{};var per=prodPerBox(p);var q=(Number(o.qtyBoxes)||0)*per+(Number(o.qtyUnits)||0);
      out.push({name:p.name||o.prodLabel,spec:p.spec||'',qty:q,supplyPrice:o.supplyPrice,invoicePrice:(Number(o.invoicePrice)>0?o.invoicePrice:(Number(p.invoicePrice)>0?p.invoicePrice:o.supplyPrice))});}
  }
  if(!out.length&&r.name)return [{name:r.name,spec:r.spec,qty:r.qty,supplyPrice:r.supplyPrice,invoicePrice:r.invoicePrice}];
  return out;
}

function r2(n){return Math.round((Number(n)||0)*100)/100;}
function setV(k,v){var el=document.querySelector('[data-k="'+k+'"]');if(el)el.value=v;}
/* 税金：开票价高于供货价部分，50%以内（含）×数量×18%，超出50%部分×数量×21% */
function payTaxCalc(inv,sup,qty){
  var i=Number(inv)||0,s=Number(sup)||0,q=Number(qty)||0;
  var mk=i-s;if(mk<=0||q<=0)return 0;
  var cap=s*0.5;
  var low=Math.min(mk,cap),high=Math.max(0,mk-cap);
  return r2(low*q*0.18+high*q*0.21);
}

/* 发货单号勾选列表：先按客户信息（代理商/客户名称）过滤，再按搜索过滤 */
function payOrderPick(){
  var box=document.getElementById('payOrderList');if(!box)return;

  var ag=String(PF.agentName||'').trim(),cn=String(PF.custName||'').trim();
  var orders=db.orders.slice().sort(function(a,b){return String(a.no)>String(b.no)?-1:1;});
  if(ag||cn)orders=orders.filter(function(o){
    if(ag&&String(o.agentName||'').trim()!==ag)return false;
    if(cn&&String(o.custName||'').trim()!==cn)return false;
    return true;
  });
  if(q)orders=orders.filter(function(o){return (String(o.no)+(o.agentName||'')+(o.custName||'')+(o.prodLabel||'')).indexOf(q)>=0;});
  if(orders.length>60)orders=orders.slice(0,60);

      +'<span class="mono">'+esc(o.no)+'</span>　'+esc(o.custName||'')+'　'+esc(o.prodLabel||'')+'</label>';

function payOrderToggle(no){
  var i=PF.shipNos.indexOf(no);
  if(i>=0)PF.shipNos.splice(i,1);else PF.shipNos.push(no);
  payOrderPick();payShipFill();
}
function payShipFill(){
  var box=document.getElementById('payShipInfo');if(!box)return;
  if(!PF.shipNos.length){box.className='hint';box.textContent='请先勾选发货单号';PF.qty=0;return;}
  var rows=[],qty=0,sub=0,rf=0,tax=0;
  for(var i=0;i<PF.shipNos.length;i++){
    var o=db.orders.filter(function(x){return x.no===PF.shipNos[i];})[0];
    if(!o)continue;
    var p=findProd(o.pid)||{};
    var per=prodPerBox(p);
    var q=(Number(o.qtyBoxes)||0)*per+(Number(o.qtyUnits)||0);
    var ip=(Number(o.invoicePrice)>0?Number(o.invoicePrice):(Number(p.invoicePrice)>0?Number(p.invoicePrice):Number(o.supplyPrice)||0));
    var sp=Number(o.supplyPrice)||0;
    var st=r2(ip*q),rb=r2((ip-sp)*q),tx=payTaxCalc(ip,sp,q);
    qty+=q;sub+=st;rf+=rb;tax+=tx;
    rows.push('<tr><td>'+esc(p.name||o.prodLabel)+'</td><td>'+esc(p.spec||'')+'</td><td>'+q+'</td><td>'+fmtN(o.basePrice)+'</td><td>'+fmtN(sp)+'</td><td>'+fmtN(ip)+'</td><td>'+fmtN(st)+'</td><td>'+fmtN(rb)+'</td></tr>');
    if(i===0){
      var cc=findCust(o.agentId);
      setV('cat',(cc&&cc.cat)||'');setV('agentName',o.agentName||'');setV('custName',o.custName||'');
      payCustChg();
    }
  }
  PF.qty=qty;PF.subtotal=r2(sub);PF.refundBase=r2(rf);PF.tax=r2(tax);setV('tax',PF.tax||'');
  box.className='';
  box.innerHTML='<table class="pay-info"><tr><th>产品名称</th><th>规格</th><th>数量（盒）</th><th>底价</th><th>供货价</th><th>开票价</th><th>小计</th><th>返款</th></tr>'
    +rows.join('')+'</table>';
  payShipCalc();
  if(!PF.amountManual){PF.amount=PF.subtotal||0;setV('amount',PF.subtotal||'');}
}
