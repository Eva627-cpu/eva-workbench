function payItemSel(i,sel){
  var it=PF.items[i];if(!it)return;
  it.pid=sel.value;
  var p=findProd(sel.value);
  if(p){
    if(!it.cat&&(p.cat==='自销'||p.cat==='OEM'))it.cat=p.cat;
    it.name=p.name;it.spec=p.spec||'';it.basePrice=p.basePrice;it.supplyPrice=p.supplyPrice;it.invoicePrice=p.invoicePrice||'';
    itSet(i,'spec',it.spec);itSet(i,'basePrice',it.basePrice||'');itSet(i,'supplyPrice',it.supplyPrice||'');itSet(i,'invoicePrice',it.invoicePrice||'');
  }
  payItemCalc(i);
}
/* 产品分类切换：切换后清空已选产品与价格，产品下拉只列该分类 */
function payItemCatSel(i,sel){
  var it=PF.items[i];if(!it)return;
  var v=sel?sel.value:'';
  if(v!==it.cat){
    it.cat=v;it.pid='';it.name='';it.spec='';it.basePrice='';it.supplyPrice='';it.invoicePrice='';it.subtotal='';it.refund='';it.rebate='';
  }
  payRenderItems();payPreTotals();
}
function payItemCalc(i){
  var it=PF.items[i];if(!it)return;
  it.qty=parseFloat(itF(i,'qty'))||0;
  it.invoicePrice=parseFloat(itF(i,'invoicePrice'))||0;
  it.supplyPrice=parseFloat(itF(i,'supplyPrice'))||0;
  it.subtotal=r2(it.invoicePrice*it.qty);
  it.refund=r2((it.invoicePrice-it.supplyPrice)*it.qty);
  it.rebatePer=parseFloat(itF(i,'rebatePer'))||0;
  it.rebate=it.rebateOn?r2(it.rebatePer*it.qty):0;
  itSet(i,'subtotal',it.subtotal||'');itSet(i,'refund',it.refund||'');itSet(i,'rebate',it.rebate||'');
  payPreTotals();
}
function payItemRebate(i,chk){
  var it=PF.items[i];if(!it)return;
  it.rebateOn=chk.checked;
  itShow(i,'rebatePerBox',chk.checked);
  payItemCalc(i);
}
function payDelItem(i){PF.items.splice(i,1);payRenderItems();payPreTotals();}
function payAddItem(){
  PF.items.push({cat:'',pid:'',name:'',spec:'',qty:'',basePrice:'',supplyPrice:'',invoicePrice:'',subtotal:'',refund:'',rebateOn:false,rebatePer:'',rebate:''});
  payRenderItems();
}
function payPreTotals(){
  var tax=0,rf=0,amt=0;
  for(var i=0;i<PF.items.length;i++){
    var it=PF.items[i];if(!it.pid)continue;
    tax+=payTaxCalc(it.invoicePrice,it.supplyPrice,it.qty);
    rf+=Number(it.refund)||0;
    amt+=Number(it.subtotal)||0;
  }
  tax=r2(tax);rf=r2(rf);amt=r2(amt);
  if(!PF.amountManual){PF.amount=amt;setV('amount',amt||'');}
  if(!PF.taxManual)PF.tax=tax;
  PF.refund=r2(rf-(Number(PF.tax)||0));
  setV('tax',PF.tax||'');setV('refund',PF.refund||'');
}
/* 税金/回款金额手动修改：手改后不再自动覆盖；清空输入框则恢复自动计算 */
function payTaxInput(el){
  var v=parseFloat(el.value);
  if(isNaN(v)){PF.taxManual=false;payPreTotals();return;}
  PF.taxManual=true;PF.tax=r2(v);
  var rf=0;
  for(var i=0;i<PF.items.length;i++){var it=PF.items[i];if(it.pid)rf+=Number(it.refund)||0;}
  PF.refund=r2(rf-PF.tax);
  setV('refund',PF.refund||'');
}
function payAmountInput(el){
  var v=parseFloat(el.value);
  if(isNaN(v)){
    PF.amountManual=false;
    if(PF.type==='ship'){if(PF.subtotal)setV('amount',PF.subtotal);}
    else payPreTotals();
    return;
  }
  PF.amountManual=true;PF.amount=r2(v);
}
function savePayForm(id){
  function gv(k){var el=document.querySelector('[data-k="'+k+'"]');return el?el.value:'';}
  var ymV=gv('ym')||payYmFallbackVal();
  if(!ymV){alert('请选择回款月份');return;}
  if(!gv('payDate')){alert('请选择回款日期');return;}
  if(!gv('cat')){alert('请选择客户分类');return;}
  if(!gv('agentName')){alert('请填写代理商');return;}
  if(!gv('custName')){alert('请填写客户名称');return;}
  var amount=parseFloat(gv('amount'));
  if(!(amount>0)){alert('请填写回款金额');return;}
  var rec={id:id||uid(),type:PF.type,ym:ymV,payDate:gv('payDate'),cat:gv('cat'),agentName:gv('agentName'),custName:gv('custName'),
    amount:amount,tax:parseFloat(gv('tax'))||0,note:gv('note'),invoice:gv('invoice')};
  if(PF.type==='ship'){
    if(!PF.shipNos||!PF.shipNos.length){alert('请勾选发货单号');return;}
    var rp=parseFloat(gv('rebatePer'))||0;
    rec.shipNo=PF.shipNos.join(',');
    if(PF.shipNos.length===1){
      var so=db.orders.filter(function(x){return x.no===PF.shipNos[0];})[0];
      if(so){var spp=findProd(so.pid)||{};rec.name=spp.name||so.prodLabel;rec.spec=spp.spec||'';}
      else{rec.name=PF.name||'';rec.spec=PF.spec||'';}
    }else{rec.name='';rec.spec='';}
    rec.qty=Number(PF.qty)||0;
    rec.basePrice=Number(PF.basePrice)||0;rec.supplyPrice=Number(PF.supplyPrice)||0;rec.invoicePrice=Number(PF.invoicePrice)||0;
    rec.subtotal=Number(PF.subtotal)||0;
    rec.rebateOn=!!PF.rebateOn;rec.rebatePer=rp;rec.rebate=r2(rp*(Number(PF.qty)||0));
    rec.refund=r2((Number(PF.refundBase)||0)-(parseFloat(gv('tax'))||0));
  }else{
    rec.shipNo='';rec.items=[];rec.rebate=0;
    for(var i=0;i<PF.items.length;i++){
      var it=PF.items[i];if(!it.pid)continue;
      rec.items.push({cat:it.cat||'',pid:it.pid,name:it.name,spec:it.spec,qty:Number(it.qty)||0,basePrice:Number(it.basePrice)||0,
        supplyPrice:Number(it.supplyPrice)||0,invoicePrice:Number(it.invoicePrice)||0,subtotal:Number(it.subtotal)||0,
        refund:Number(it.refund)||0,rebateOn:!!it.rebateOn,rebatePer:Number(it.rebatePer)||0,rebate:Number(it.rebate)||0});
      rec.rebate+=Number(it.rebate)||0;
    }
    rec.rebate=r2(rec.rebate);
    rec.refund=parseFloat(gv('refund'))||0;
  }
  if(id){var o=db.payments.filter(function(x){return x.id===id;})[0];if(o){for(var k in rec)o[k]=rec[k];}}
  else db.payments.push(rec);
  save();closeModal();render();
}
/* ---- 回款导入 / 模板 ---- */
function importPayExcel(input){
  var f=input.files&&input.files[0];if(!f)return;
  if(!window.XLSX){alert('Excel解析库未加载，请检查网络后刷新重试');return;}
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var wb=XLSX.read(new Uint8Array(rd.result),{type:'array'});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var json=XLSX.utils.sheet_to_json(ws,{header:1});
      var headRow=-1,headMap={};
      for(var i=0;i<json.length;i++){
        var row=json[i];if(!row||!row.length)continue;
        if(row.join(',').indexOf('回款日期')>=0||row.join(',').indexOf('回款金额')>=0){headRow=i;break;}
      }
      if(headRow<0){alert('未识别到表头，请先点击"模板"下载模板按格式填写');return;}
      var map={'回款年/月':'ym','发货单号':'shipNo','回款日期':'payDate','客户分类':'cat','代理商':'agentName','客户名称':'custName','产品名称':'name','规格':'spec','供货价':'supplyPrice','开票单价':'invoicePrice','回款金额':'amount','返利金额':'rebate','返款金额':'refund','发票':'invoice','发货状态':'shipStatus','备注':'note'};
      var head=json[headRow];
      for(var j=0;j<head.length;j++){
        var hc=String(head[j]==null?'':head[j]).trim();
        if(map[hc])headMap[j]=map[hc];
      }
      var NUM=['supplyPrice','invoicePrice','amount','rebate','refund'];
      var added=0,skip=0,skipMsg=[];
      for(var k=headRow+1;k<json.length;k++){
        var rr=json[k];if(!rr)continue;
        var rec={},any=false;
        for(var c in headMap){var v=String(rr[c]==null?'':rr[c]).trim();rec[headMap[c]]=v;if(v)any=true;}
        if(!any)continue;
        for(var n=0;n<NUM.length;n++){var kk=NUM[n];rec[kk]=parseFloat(rec[kk])||0;}
        if(!rec.payDate){skip++;skipMsg.push('第'+(k+1)+'行：回款日期缺失');continue;}
        if(!(rec.amount>0)){skip++;skipMsg.push('第'+(k+1)+'行：回款金额缺失');continue;}
        var ymV=String(rec.ym||'').replace('年','-').replace('月','').replace('/','-');
        if(/^\d{4}-\d{1,2}$/.test(ymV)){var ps=ymV.split('-');ymV=ps[0]+'-'+(ps[1].length<2?'0':'')+ps[1];}
        else ymV=String(rec.payDate).slice(0,7);
        var invFlag=(rec.invoice==='是'||rec.invoice==='✓'||rec.invoice==='☑')?'是':'否';
        var _ns=String(rec.shipNo||'').split(/[,，、;；\s]+/).filter(function(x){return x;});
        var anySh=(rec.shipStatus==='已发货');for(var q=0;q<_ns.length;q++){if(orderShipped(_ns[q])>0){anySh=true;break;}}
        var type=(_ns.length&&anySh)?'ship':'prepay';
        var out={id:uid(),type:type,ym:ymV,shipNo:(type==='ship'?(rec.shipNo||''):''),payDate:rec.payDate,cat:rec.cat||'',
          agentName:rec.agentName||'',custName:rec.custName||'',amount:Number(rec.amount)||0,
          rebate:Number(rec.rebate)||0,refund:Number(rec.refund)||0,tax:0,invoice:invFlag,note:rec.note||''};
        if(type==='ship'){
          out.name=rec.name||'';out.spec=rec.spec||'';
          out.supplyPrice=Number(rec.supplyPrice)||0;out.invoicePrice=Number(rec.invoicePrice)||0;
        }else{
          out.items=rec.name?[{pid:'',name:rec.name,spec:rec.spec||'',qty:0,basePrice:0,supplyPrice:Number(rec.supplyPrice)||0,invoicePrice:Number(rec.invoicePrice)||0,subtotal:0,refund:0,rebateOn:false,rebatePer:0,rebate:0}]:[];
        }
        db.payments.push(out);added++;
      }
      save();
      if(input)input.value='';
      alert(added?('成功导入 '+added+' 条回款记录'+(skip?('，跳过 '+skip+' 条：\n'+skipMsg.slice(0,5).join('\n')):'')):('未导入数据。\n'+(skipMsg.length?skipMsg.slice(0,5).join('\n'):'请检查表格内容')));
      render();
    }catch(e){console.log('导入失败',e);alert('导入失败：'+e.message);}
  };
  rd.readAsArrayBuffer(f);
}

      if(headRow<0){alert('未识别到表头，请先点击"模板"下载模板按格式填写');return;}
      var map={'日期':'date','客户分类':'cat','代理商':'agent','客户名称':'custName','事项':'item','纪要':'content','预计完成时间':'planDate'};
      var head=json[headRow];
      for(var j=0;j<head.length;j++){
        var hc=String(head[j]==null?'':head[j]).trim();
        if(map[hc])headMap[j]=map[hc];
      }
      function normDate(s){s=String(s||'').trim().replace(/[\/\.]/g,'-');var m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);return m?m[1]+'-'+(m[2].length<2?'0'+m[2]:m[2])+'-'+(m[3].length<2?'0'+m[3]:m[3]):s;}
      var added=0,skip=0,skipMsg=[];
      for(var k=headRow+1;k<json.length;k++){
        var rr=json[k];if(!rr)continue;
        var rec={id:uid(),created:today(),done:false},any=false;
        for(var c in headMap){
          var v=String(rr[c]==null?'':rr[c]).trim();
          rec[headMap[c]]=v;if(v)any=true;
        }
        if(!any)continue;
        if(!rec.date||!/^\d{4}-\d{2}-\d{2}$/.test(rec.date=normDate(rec.date))){skip++;skipMsg.push('第'+(k+1)+'行：日期缺失或格式不对');continue;}
        if(!rec.custName){skip++;skipMsg.push('第'+(k+1)+'行：客户名称缺失');continue;}
        if(!rec.content){skip++;skipMsg.push('第'+(k+1)+'行：纪要缺失');continue;}
        if(LOG_ITEMS.indexOf(rec.item)<0)rec.item='其他';
        rec.planDate=normDate(rec.planDate);
        db.logs.push(rec);added++;
      }
      save();
      if(input)input.value='';
      alert(added?('成功导入 '+added+' 条工作记录'+(skip?('，跳过 '+skip+' 条：\n'+skipMsg.slice(0,5).join('\n')):'')):('未导入数据。\n'+(skipMsg.length?skipMsg.slice(0,5).join('\n'):'请检查表格内容')));
      render();
    }catch(e){console.log('导入失败',e);alert('导入失败：'+e.message);}
  };
  rd.readAsArrayBuffer(f);
}

/* 产品导入 Excel（支持模板 .xlsx 与导出的 .xls） */
function importProdExcel(input){
  var f=input.files&&input.files[0];if(!f)return;
  if(!window.XLSX){alert('Excel解析库未加载，请检查网络后刷新重试');return;}
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var wb=XLSX.read(new Uint8Array(rd.result),{type:'array'});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var json=XLSX.utils.sheet_to_json(ws,{header:1});
      var headRow=-1,headMap={};
      for(var i=0;i<json.length;i++){
        var row=json[i];if(!row||!row.length)continue;
        if(row.join(',').indexOf('产品分类')>=0||row.join(',').indexOf('产品名称')>=0){headRow=i;break;}
      }
      if(headRow<0){alert('未识别到表头，请先点击"模板"下载模板按格式填写');return;}
      var map={'产品分类':'cat','客户分类':'custCat','代理商':'agent','客户名称':'custName','产品名称':'name','规格':'spec','商标':'brand','底价':'basePrice','供货价':'supplyPrice','开票价':'invoicePrice'};
      var head=json[headRow];
      for(var j=0;j<head.length;j++){
        var hc=String(head[j]==null?'':head[j]).trim();
        if(map[hc])headMap[j]=map[hc];
      }
      var NUM=['basePrice','supplyPrice','invoicePrice'];
      var added=0,skip=0,skipMsg=[];
      for(var k=headRow+1;k<json.length;k++){
        var rr=json[k];if(!rr)continue;
        var rec={id:uid(),created:today()},any=false;
        for(var c in headMap){
          var v=String(rr[c]==null?'':rr[c]).trim();
          rec[headMap[c]]=v;
          if(v)any=true;
        }
        if(!any)continue;
        for(var n=0;n<NUM.length;n++){var kk=NUM[n];rec[kk]=parseFloat(rec[kk])||0;}
        rec.cat=(rec.cat==='oem'||rec.cat==='Oem')?'OEM':rec.cat;
        if(!rec.name){skip++;skipMsg.push('第'+(k+1)+'行：产品名称缺失');continue;}
        rec.perBox=parsePerBox(rec.spec)||40;rec.safeStock=0;
        db.products.push(rec);added++;
      }
      save();
      if(input)input.value='';
      alert(added?('成功导入 '+added+' 条产品'+(skip?('，跳过 '+skip+' 条：\n'+skipMsg.slice(0,5).join('\n')):'')):('未导入数据。\n'+(skipMsg.length?skipMsg.slice(0,5).join('\n'):'请检查表格内容')));
      render();
    }catch(e){console.log('导入失败',e);alert('导入失败：'+e.message);}
  };
  rd.readAsArrayBuffer(f);
}

/* 导入 Excel */
function importProdoExcel(input){
  var f=input.files&&input.files[0];if(!f)return;
  if(!window.XLSX){alert('Excel解析库未加载，请检查网络后刷新重试');return;}
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var wb=XLSX.read(new Uint8Array(rd.result),{type:'array'});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var json=XLSX.utils.sheet_to_json(ws,{header:1,raw:false});
      var headRow=-1,headMap={};
      for(var i=0;i<json.length;i++){
        var row=json[i];if(!row||!row.length)continue;
        if(row.join(',').indexOf('产品分类')>=0||row.join(',').indexOf('订单日期')>=0){headRow=i;break;}
      }
      if(headRow<0){alert('未识别到表头，请先点击"模板"下载模板按格式填写');return;}
      var map={'客户分类':'custCat','代理商':'agent','客户名称':'custName','订单日期':'date','产品分类':'cat','产品名称':'name','规格':'spec','订单数量（件）':'qty','订单数量(件)':'qty','订单金额':'amount','预付款金额':'prepaid','订单进展':'status','工序':'process','出货时间':'shipDate'};
      var head=json[headRow];
      for(var j=0;j<head.length;j++){
        var hc=String(head[j]==null?'':head[j]).trim();
        if(map[hc])headMap[j]=map[hc];
      }
      function normDate(s){s=String(s||'').trim().replace(/[\/\.]/g,'-');var m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);return m?m[1]+'-'+(m[2].length<2?'0'+m[2]:m[2])+'-'+(m[3].length<2?'0'+m[3]:m[3]):s;}
      var added=0,skip=0,skipMsg=[];
      for(var k=headRow+1;k<json.length;k++){
        var rr=json[k];if(!rr)continue;
        var rec={id:uid(),no:newProdoNo()},any=false;
        for(var c in headMap){
          rec[headMap[c]]=String(rr[c]==null?'':rr[c]).trim();
          if(rec[headMap[c]])any=true;
        }
        if(!any)continue;
        rec.cat=(rec.cat==='oem'||rec.cat==='Oem')?'OEM':rec.cat;
        rec.qty=parseFloat(rec.qty)||0;
        rec.amount=parseFloat(rec.amount)||0;
        rec.prepaid=parseFloat(rec.prepaid)||0;
        rec.date=normDate(rec.date);
        rec.shipDate=normDate(rec.shipDate);
        if(rec.cat!=='自销'&&rec.cat!=='OEM'){skip++;skipMsg.push('第'+(k+1)+'行：产品分类需为 自销 或 OEM');continue;}
        if(!rec.date||!/^\d{4}-\d{2}-\d{2}$/.test(rec.date)){skip++;skipMsg.push('第'+(k+1)+'行：订单日期缺失或格式不对');continue;}
        if(!rec.name){skip++;skipMsg.push('第'+(k+1)+'行：产品名称缺失');continue;}
        if(!rec.spec){skip++;skipMsg.push('第'+(k+1)+'行：规格缺失');continue;}
        if(!(rec.qty>0)){skip++;skipMsg.push('第'+(k+1)+'行：订单数量需大于0');continue;}
        if(PRODO_STATUS.indexOf(rec.status)<0)rec.status='未投产';
        if(rec.status!=='已投产')rec.process='';
        if(!rec.shipDate&&rec.status==='已出货')rec.shipDate=today();
        if(rec.cat==='自销'){rec.agent='';rec.custName='';rec.amount=0;rec.prepaid=0;}
        if(rec.cat==='OEM'&&!(rec.amount>0)){skip++;skipMsg.push('第'+(k+1)+'行：OEM订单需填写订单金额');continue;}
        db.prodOrders.push(rec);added++;
      }
      save();
      if(input)input.value='';
      alert(added?('成功导入 '+added+' 条订单'+(skip?('，跳过 '+skip+' 条：\n'+skipMsg.slice(0,5).join('\n')):'')):('未导入数据。\n'+(skipMsg.length?skipMsg.slice(0,5).join('\n'):'请检查表格内容')));
      render();
    }catch(e){console.log('导入失败',e);alert('导入失败：'+e.message);}
  };
  rd.readAsArrayBuffer(f);
}

    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='新品开发导入模板_'+today()+'.xls';a.click();
  }
}
/* ================= 设置 ================= */
function renderSet(c){
  setPage(getMod('set'),function(root){
    var cloudEl=cloudReady?'<span class="tag ok">已连接云端</span>':'<span class="tag warn">未连接</span>';
    root.innerHTML=
      '<div class="card"><div class="card-hd"><h3>云端同步（多设备自动同步）</h3></div><div class="card-bd">'+
      '<p style="color:var(--sub);margin-bottom:12px">当前状态：'+cloudEl+'　<span id="setCloudTip"></span></p>'+
      '<p style="color:var(--sub);margin-bottom:12px">数据通过 GitHub Gist 免费同步，任何设备打开工作台都会自动读写同一份数据，刷新即同步，不消耗任何积分。</p>'+
      '<button class="btn" onclick="initCloud();alert(\'正在重新连接云端，请稍候…\')">重新连接云端</button> '+
      '<button class="btn" onclick="var t=prompt(\'输入 GitHub Token（ghp_ 开头；留空则清除本机 Token）\',\'\');if(t){localStorage.setItem(\'gh_token\',t.trim());alert(\'已保存 Token，正在重连…\');initCloud();}else if(t===\'\'){localStorage.removeItem(\'gh_token\');alert(\'已清除本机 Token\');initCloud();}">修改 Token</button>'+
      '</div></div>'+
      '<div class="card"><div class="card-hd"><h3>数据备份 / 恢复</h3></div><div class="card-bd">'+
      '<p style="color:var(--sub);margin-bottom:12px">备份包含全部数据（客户、产品、订单、库存、物流、回款、新品、工作记录及照片）。恢复会覆盖本设备全部数据。</p>'+
      '<button class="btn pri" onclick="backupData()">备份数据（导出JSON）</button> '+
      '<button class="btn" onclick="restoreBackup()">恢复本地自动备份</button> '+
      '<button class="btn" onclick="document.getElementById(\'restoreFile\').click()">恢复数据（导入JSON）</button>'+
      '<input type="file" id="restoreFile" accept=".json,application/json" style="display:none" onchange="restoreData(this)">'+
      '</div></div>'+
      '<div class="card"><div class="card-hd"><h3>数据管理</h3></div><div class="card-bd">'+
      '<p style="color:var(--sub);margin-bottom:12px">首次使用可载入示例数据了解各板块功能；清空数据会同时覆盖云端，操作前请先备份。</p>'+
      '<button class="btn" onclick="loadDemo()">载入示例数据</button> '+
      '<button class="btn dgr" onclick="clearAllData()">清空全部数据</button>'+
      '<div style="border-top:1px solid var(--line);margin:14px 0"></div>'+
      '<p style="color:var(--sub);margin-bottom:12px">仅清空销售与库存台账（销售订单、物流发货、回款明细、库存批次），保留客户档案、产品档案、生产订单、新品开发、工作记录、待办。适合数据导入有误、重新从头记账时使用。</p>'+
      '<button class="btn dgr" onclick="clearSalesStockData()">清空销售与库存数据（重新记账）</button>'+
      '</div></div>'+
      '<div class="card"><div class="card-hd"><h3>关于</h3></div><div class="card-bd">'+
      '<p><b>Eva工作台</b> v2.0　医药销售业务数据管理系统</p>'+
      '<p style="color:var(--sub);margin-top:6px">模块：客户档案 · 产品档案 · 产品订单 · 销售库存 · 销售订单 · 物流明细 · 回款明细 · 新品开发 · 工作记录</p>'+
      '<p style="color:var(--sub);margin-top:6px">所有台账支持 Excel 导出留痕，用于对账与公司内部核查。</p>'+
      '</div></div>';
  });
}
function clearAllData(){
  if(!confirm('确定清空全部数据？此操作不可恢复（云端数据也会被覆盖为空）。建议先备份！'))return;
  db=ensureStruct({customers:[],products:[],batches:[],orders:[],shipments:[],payments:[],logs:[],prodOrders:[],develop:[],seq:1});
  save();render();
}
/* 仅清空销售与库存台账，保留基础档案（客户/产品/生产订单/新品开发/工作记录/待办） */
function clearSalesStockData(){
  var n=db.orders.length+db.shipments.length+db.payments.length+db.batches.length;
  if(!n){alert('当前没有销售与库存数据，无需清理。');return;}
  var msg='确定清空以下销售与库存数据？共 '+n+' 条，此操作不可恢复（云端数据也会被覆盖）：\n\n'
    +'· 销售订单 '+db.orders.length+' 条\n'
    +'· 物流发货 '+db.shipments.length+' 条\n'
    +'· 回款明细 '+db.payments.length+' 条\n'
    +'· 库存批次 '+db.batches.length+' 条\n\n'
    +'将保留：客户档案、产品档案、生产订单、新品开发、工作记录、待办。\n建议先到「数据备份」导出一份留底！';
  if(!confirm(msg))return;
  db.orders=[];db.shipments=[];db.payments=[];db.batches=[];
  WAVE_CACHE={};
  save();render();
  alert('已清空销售与库存数据。\n\n接下来：\n1. 到「销售库存」录入现有实际库存（批次）；\n2. 从 9 月 1 日起正常记录订单、发货与回款。');
}

/* ================= 初始化 ================= */
render();
initCloud();
</script>
